<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050b1e">
<title>Frost Blocks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:#050b1e;color:#e8f7ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 0;pointer-events:none;z-index:6}
#muteWrap{display:flex;justify-content:flex-end;height:44px}
#scoreRow{position:relative;display:flex;align-items:flex-end;justify-content:center;gap:18px;margin-top:6px;max-width:560px;margin-left:auto;margin-right:auto}
.stat{display:flex;flex-direction:column;align-items:center;line-height:1}
.stat .lbl{font-size:11px;letter-spacing:.22em;color:#7fcfff;opacity:.85;font-weight:700;margin-bottom:3px}
.stat .val{font-size:40px;font-weight:900;color:#fff;text-shadow:0 0 14px rgba(90,210,255,.75);font-variant-numeric:tabular-nums;transition:transform .12s}
.stat .val.bump{transform:scale(1.14)}
.stat.best{position:absolute;right:12px;align-items:flex-end}
.stat.best .val{font-size:20px;color:#bfefff}
.stat.best .val::before{content:"\2605 ";color:#ffe27a;font-size:15px}
body.intitle #scoreRow{visibility:hidden}
.ibtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid rgba(127,233,255,.35);background:rgba(10,30,60,.55);color:#bff4ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 14px rgba(60,180,255,.2) inset}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:22px;height:22px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 40%,rgba(20,50,100,.55),rgba(3,8,22,.9));z-index:5;transition:opacity .35s ease;text-align:center;padding:24px}
.overlay.hidden{opacity:0;pointer-events:none;visibility:hidden;transition:opacity .25s ease,visibility 0s linear .25s}
.overlay.hidden *{pointer-events:none!important}
.logo{font-size:clamp(46px,13vw,96px);font-weight:900;letter-spacing:.03em;line-height:.92;background:linear-gradient(180deg,#ffffff 0%,#b5f5ff 40%,#3fb2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(80,200,255,.55));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sub{color:#9fdcff;font-size:15px;max-width:340px;line-height:1.45;opacity:.9}
.big-btn{pointer-events:auto;font:inherit;font-size:22px;font-weight:900;letter-spacing:.12em;color:#032036;padding:16px 46px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(180deg,#e9fdff,#6fdcff 55%,#2ea8ff);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 30px rgba(70,200,255,.7),0 8px 22px rgba(0,0,0,.45);transition:transform .12s}
.big-btn:active{transform:scale(.95)}
.ghost-btn{pointer-events:auto;font:inherit;font-size:15px;font-weight:700;letter-spacing:.1em;color:#bdefff;padding:10px 26px;border-radius:999px;border:1px solid rgba(127,233,255,.45);background:rgba(10,30,60,.5);cursor:pointer}
.panel{background:linear-gradient(180deg,rgba(30,70,130,.55),rgba(8,20,45,.75));border:1px solid rgba(127,233,255,.35);border-radius:24px;padding:26px 34px;box-shadow:0 0 40px rgba(60,170,255,.25),0 0 0 1px rgba(255,255,255,.05) inset;min-width:260px}
.panel h2{font-size:30px;font-weight:900;letter-spacing:.08em;color:#dff8ff;text-shadow:0 0 16px rgba(80,200,255,.8);margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:30px;font-size:16px;color:#9fdcff;margin:6px 0}
.row b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,#ff7ad9,#7fe9ff);color:#061a2c;font-weight:900;font-size:13px;letter-spacing:.15em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.titlebest{color:#7fcfff;font-size:14px;letter-spacing:.18em;font-weight:700}
.flake{position:absolute;color:rgba(200,240,255,.5);pointer-events:none;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="muteWrap"><button class="ibtn" id="mute" aria-label="Toggle sound"></button></div>
  <div id="scoreRow">
    <div class="stat"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
    <div class="stat best"><span class="lbl">BEST</span><span class="val" id="best">0</span></div>
  </div>
</div>

<div class="overlay" id="title">
  <div class="logo">FROST<br>BLOCKS</div>
  <div class="sub">Drag ice pieces onto the board. Fill a row or column to shatter it. Chain clears for combos!</div>
  <div class="titlebest" id="titleBest"></div>
  <button class="big-btn" id="contBtn" style="display:none">CONTINUE</button>
  <button class="big-btn" id="playBtn">PLAY</button>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h2>FROZEN OUT</h2>
    <div class="row"><span>Score</span><b id="oScore">0</b></div>
    <div class="row"><span>Best</span><b id="oBest">0</b></div>
    <div class="row"><span>Lines cleared</span><b id="oLines">0</b></div>
    <div id="oNew"></div>
  </div>
  <button class="big-btn" id="againBtn">PLAY AGAIN</button>
  <button class="ghost-btn" id="homeBtn">MENU</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
const LS = 'blizzard_frostblocks_';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- audio ---------- */
let actx = null, master = null, muted = !!store.get('muted', false);
function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(f, dur, type, vol, when, slide) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
let noiseBuf = null;
function noise(dur, vol, when, freq) {
  if (!actx || muted) return;
  try {
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = actx.currentTime + (when || 0);
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq || 3000;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  } catch (e) {}
}
// C-major pentatonic ladder (Hz) for bright, always-consonant feedback
const PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.51, 1567.98, 1760, 2093];
const sfx = {
  pick() { tone(784, 0.07, 'sine', 0.09); tone(1175, 0.06, 'sine', 0.05, 0.03); },
  drop(n) { const f = PENTA[Math.max(0, 4 - Math.min(4, n - 1))] / 2; tone(f, 0.16, 'triangle', 0.2); tone(f * 2, 0.08, 'sine', 0.06); },
  bad() { tone(392, 0.09, 'triangle', 0.08); tone(330, 0.12, 'triangle', 0.07, 0.07); },
  clear(n, streak) {
    const s = Math.min(streak - 1, 5);
    const notes = Math.min(3 + n, 6);
    for (let i = 0; i < notes; i++) tone(PENTA[Math.min(PENTA.length - 1, s + i)], 0.3, 'triangle', 0.12, i * 0.05);
    for (let i = 0; i < 4; i++) tone(PENTA[Math.min(PENTA.length - 1, s + 5 + (i % 3))] * 2, 0.12, 'sine', 0.025, 0.08 + i * 0.045);
    tone(PENTA[s] / 2, 0.5, 'sine', 0.12);
  },
  allclear() { [0, 2, 4, 5, 7, 9, 10].forEach((k, i) => tone(PENTA[k], 0.45, 'sine', 0.12, i * 0.07)); },
  newTray() { tone(1319, 0.06, 'sine', 0.05); tone(1568, 0.08, 'sine', 0.045, 0.05); },
  best() { [0, 2, 4, 5].forEach((k, i) => tone(PENTA[k + 2], 0.25, 'triangle', 0.1, i * 0.08)); },
  over() { [783.99, 659.25, 523.25, 392, 523.25].forEach((f, i) => tone(f, i === 4 ? 0.8 : 0.32, 'triangle', 0.11, i * 0.14)); }
};
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function updateMuteIcon() { $('mute').innerHTML = muted ? ICON_OFF : ICON_ON; }
updateMuteIcon();
$('mute').addEventListener('pointerdown', e => {
  e.stopPropagation();
  muted = !muted; store.set('muted', muted); updateMuteIcon();
  ensureAudio();
  try { if (master) master.gain.value = muted ? 0 : 0.55; } catch (er) {}
});

/* ---------- colors ---------- */
const COLORS = ['#3fdcff', '#4a86ff', '#a47cff', '#2fe8b5', '#cfeeff', '#ff6fcf'];
const GREY = 6;
const ALLC = COLORS.concat(['#5d6f8c']);
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, to, a) { const c = hexRgb(h); return `rgb(${Math.round(c[0] + (to[0] - c[0]) * a)},${Math.round(c[1] + (to[1] - c[1]) * a)},${Math.round(c[2] + (to[2] - c[2]) * a)})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const WH = [255, 255, 255], BK = [0, 10, 30];

/* ---------- shapes ---------- */
const N = 8;
const BASE = [
  [2.0, [[0, 0]]],
  [3.0, [[0, 0], [0, 1]]],
  [3.0, [[0, 0], [0, 1], [0, 2]]],
  [2.6, [[0, 0], [0, 1], [0, 2], [0, 3]]],
  [1.6, [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]]],
  [3.0, [[0, 0], [0, 1], [1, 0], [1, 1]]],
  [1.5, [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]]],
  [0.9, [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]],
  [3.0, [[0, 0], [1, 0], [1, 1]]],
  [3.0, [[0, 0], [1, 0], [2, 0], [2, 1]]],
  [2.4, [[0, 0], [0, 1], [0, 2], [1, 1]]],
  [2.0, [[0, 1], [0, 2], [1, 0], [1, 1]]],
  [2.0, [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]],
  [0.8, [[0, 1], [1, 0], [1, 1], [1, 2], [2, 1]]],
  [0.9, [[0, 0], [1, 1]]],
  [0.7, [[0, 0], [0, 2], [1, 0], [1, 1], [1, 2]]]
];
function norm(cells) {
  let mr = Infinity, mc = Infinity;
  cells.forEach(([r, c]) => { mr = Math.min(mr, r); mc = Math.min(mc, c); });
  return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function variants(cells) {
  const out = new Map(); let cur = cells;
  for (let m = 0; m < 2; m++) {
    for (let k = 0; k < 4; k++) {
      cur = cur.map(([r, c]) => [c, -r]);
      const n = norm(cur); out.set(JSON.stringify(n), n);
    }
    cur = cur.map(([r, c]) => [r, -c]);
  }
  return [...out.values()];
}
const POOL = [];
BASE.forEach(([w, cells], bi) => {
  const vs = variants(cells);
  // "big" = 5+ cells; these get more common as the score climbs
  vs.forEach(v => POOL.push({ cells: v, w: w / vs.length, base: bi, n: cells.length }));
});
function shapeWeight(p, diff) {
  if (p.n >= 5) return p.w * (0.55 + 0.9 * diff);
  if (p.n <= 2) return p.w * (1.15 - 0.5 * diff);
  return p.w;
}
function randomShape(diff, avoid) {
  let tot = 0;
  for (const p of POOL) if (!avoid.has(p.base)) tot += shapeWeight(p, diff);
  let r = Math.random() * tot;
  for (const p of POOL) { if (avoid.has(p.base)) continue; r -= shapeWeight(p, diff); if (r <= 0) return p; }
  return POOL[0];
}
function makePiece(sh) {
  const cells = sh.cells;
  let w = 0, h = 0;
  cells.forEach(([r, c]) => { h = Math.max(h, r + 1); w = Math.max(w, c + 1); });
  return { cells, w, h, base: sh.base, ci: (Math.random() * COLORS.length) | 0, used: false, appear: now, ret: null };
}

/* ---------- state ---------- */
let grid, placeAnim, tray = [], score = 0, shownScore = 0, best = store.get('best', 0) | 0;
let bestAtStart = 0, streak = 0, sinceClear = 0, lines = 0, state = 'title', drag = null, endT = 0, bestPopped = false;
let lineFx = [];
let clears = [], parts = [], pops = [], shake = 0, now = 0, boardFlash = 0;
let W = 0, H = 0, dpr = 1, cell = 40, bx = 0, by = 0, S = 320, trayRects = [], trayCell = 20, sideLayout = false;
let flakes = [];

function canPlaceOn(g, p, r, c) {
  for (const [dr, dc] of p.cells) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || g[rr][cc]) return false;
  }
  return true;
}
function canPlace(p, r, c) { return canPlaceOn(grid, p, r, c); }
function fits(p) {
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
  return false;
}
// Put p on a copy of g, clear full lines, return the new grid and how many lines cleared.
function simPlace(g, p, r, c) {
  const t = g.map(row => row.slice());
  p.cells.forEach(([dr, dc]) => { t[r + dr][c + dc] = 1; });
  const rows = [], cols = [];
  for (let i = 0; i < N; i++) {
    if (t[i].every(v => v)) rows.push(i);
    let full = true; for (let j = 0; j < N; j++) if (!t[j][i]) { full = false; break; }
    if (full) cols.push(i);
  }
  rows.forEach(i => t[i].fill(0));
  cols.forEach(i => { for (let j = 0; j < N; j++) t[j][i] = 0; });
  return { g: t, n: rows.length + cols.length };
}
// Can these pieces all be placed in some order (letting clears happen)? Greedy per order, cheap enough per tray.
function traySolvable(g, ps) {
  const orders = [[0, 1, 2], [0, 2, 1], [1, 0, 2], [1, 2, 0], [2, 0, 1], [2, 1, 0]].map(o => o.filter(i => i < ps.length));
  for (const ord of orders) {
    let cur = g, ok = true;
    for (const i of ord) {
      const p = ps[i];
      let bestS = -1, bestG = null;
      for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) {
        if (!canPlaceOn(cur, p, r, c)) continue;
        const res = simPlace(cur, p, r, c);
        let touch = 0;
        p.cells.forEach(([dr, dc]) => {
          const a = r + dr, b = c + dc;
          if (a === 0 || a === N - 1 || cur[a - 1] && cur[a - 1][b] || cur[a + 1] && cur[a + 1][b]) touch++;
          if (b === 0 || b === N - 1 || cur[a][b - 1] || cur[a][b + 1]) touch++;
        });
        const s = res.n * 100 + touch;
        if (s > bestS) { bestS = s; bestG = res.g; }
      }
      if (!bestG) { ok = false; break; }
      cur = bestG;
    }
    if (ok) return true;
  }
  return false;
}
function newTray() {
  // Difficulty ramps with score: more big pieces later. Every tray is checked so it can always
  // be fully placed from the current board with good play; losing comes from your own placements.
  const diff = Math.min(1, score / 12000);
  let t = null, fallback = null;
  for (let tries = 0; tries < 60 && !t; tries++) {
    const avoid = new Set(), cand = [];
    for (let i = 0; i < 3; i++) { const sh = randomShape(diff, avoid); avoid.add(sh.base); cand.push(makePiece(sh)); }
    if (!fallback && cand.some(fits)) fallback = cand;
    if (traySolvable(grid, cand)) t = cand;
  }
  // Rare: nothing solvable found. Prefer a tray with at least one fitting piece, else game over follows.
  if (!t) t = fallback || [0, 1, 2].map(() => makePiece(randomShape(diff, new Set())));
  // distinct colours for variety
  const used = new Set();
  t.forEach((p, i) => { p.appear = now + i * 0.06; while (used.has(p.ci)) p.ci = (p.ci + 1) % COLORS.length; used.add(p.ci); });
  tray = t;
  sizeTray();
  sfx.newTray();
}
function resetGame() {
  grid = Array.from({ length: N }, () => new Array(N).fill(0));
  placeAnim = Array.from({ length: N }, () => new Array(N).fill(-9));
  bestAtStart = best; score = 0; shownScore = 0; streak = 0; sinceClear = 0; lines = 0; bestPopped = false;
  clears = []; parts = []; pops = []; lineFx = []; drag = null;
  newTray();
  state = 'play';
  saveGame();
  updateHud(true);
}
/* ---------- resume an unfinished game ---------- */
function saveGame() {
  if (state !== 'play') { store.set('save', null); return; }
  store.set('save', { grid, score, streak, sinceClear, lines, bestAtStart, bestPopped,
    tray: tray.map(p => ({ cells: p.cells, base: p.base, ci: p.ci, used: p.used })) });
}
function loadGame() {
  const s = store.get('save', null);
  try {
    if (!s || !Array.isArray(s.grid) || s.grid.length !== N || !Array.isArray(s.tray) || s.tray.length !== 3) return false;
    grid = s.grid.map(row => row.map(v => (v | 0) > 0 && (v | 0) <= COLORS.length ? v | 0 : 0));
    placeAnim = Array.from({ length: N }, () => new Array(N).fill(-9));
    tray = s.tray.map(q => { const p = makePiece({ cells: q.cells, base: q.base | 0 }); p.ci = (q.ci | 0) % COLORS.length; p.used = !!q.used; return p; });
    score = s.score | 0; shownScore = score; streak = s.streak | 0; sinceClear = s.sinceClear | 0; lines = s.lines | 0;
    bestAtStart = s.bestAtStart | 0; bestPopped = !!s.bestPopped;
    clears = []; parts = []; pops = []; drag = null;
    if (tray.every(p => p.used)) newTray();
    sizeTray();
    if (!tray.some(p => !p.used && fits(p))) return false;
    state = 'play';
    updateHud(true);
    return true;
  } catch (e) { return false; }
}

/* ---------- layout ---------- */
const spriteCache = new Map();
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  sideLayout = W > H * 1.15;
  const sr = $('scoreRow').getBoundingClientRect();
  // In landscape the score sits above the board; the exit bar lives top-left, so keep 64px clear up there.
  const top = Math.max(sr.bottom + 14, 64);
  const bottomPad = 14;
  const availH = H - top - bottomPad, availW = W - 16;
  if (sideLayout) {
    S = Math.min(availH * 0.93, (availW - 24) / 1.55, 640);
  } else {
    S = Math.min(availW, (availH - 12) / 1.36, 600);
  }
  S = Math.max(160, Math.floor(S / 8) * 8);
  cell = S / 8;
  trayRects = [];
  if (sideLayout) {
    const tw = S * 0.5, gap = S * 0.06, total = S + gap + tw;
    bx = Math.round((W - total) / 2); by = Math.round(top + (availH - S) / 2);

<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();

    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
</body>
</html>
