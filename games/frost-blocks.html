<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050b1e">
<title>Frost Blocks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:#050b1e;color:#e8f7ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 10px) 14px 0;pointer-events:none;z-index:6;max-width:640px;margin:0 auto}
.stat{display:flex;flex-direction:column;line-height:1}
.stat .lbl{font-size:11px;letter-spacing:.22em;color:#7fcfff;opacity:.85;font-weight:700}
.stat .val{font-size:30px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(90,210,255,.75);font-variant-numeric:tabular-nums}
.stat.best .val{font-size:20px;color:#bfefff}
.spacer{flex:1}
body.intitle #hud .stat{visibility:hidden}
.ibtn{pointer-events:auto;width:44px;height:44px;border-radius:14px;border:1px solid rgba(127,233,255,.35);background:rgba(10,30,60,.55);color:#bff4ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 14px rgba(60,180,255,.2) inset}
.ibtn:active{transform:scale(.94)}
.ibtn svg{width:22px;height:22px}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 40%,rgba(20,50,100,.55),rgba(3,8,22,.9));z-index:5;transition:opacity .35s ease;text-align:center;padding:24px}
.overlay.hidden{opacity:0;pointer-events:none}
.logo{font-size:clamp(46px,13vw,96px);font-weight:900;letter-spacing:.03em;line-height:.92;background:linear-gradient(180deg,#ffffff 0%,#b5f5ff 40%,#3fb2ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(80,200,255,.55));animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
.sub{color:#9fdcff;font-size:15px;max-width:340px;line-height:1.45;opacity:.9}
.big-btn{pointer-events:auto;font:inherit;font-size:22px;font-weight:900;letter-spacing:.12em;color:#032036;padding:16px 46px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(180deg,#e9fdff,#6fdcff 55%,#2ea8ff);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 30px rgba(70,200,255,.7),0 8px 22px rgba(0,0,0,.45);transition:transform .12s}
.big-btn:active{transform:scale(.95)}
.ghost-btn{pointer-events:auto;font:inherit;font-size:15px;font-weight:700;letter-spacing:.1em;color:#bdefff;padding:10px 26px;border-radius:999px;border:1px solid rgba(127,233,255,.45);background:rgba(10,30,60,.5);cursor:pointer}
.panel{background:linear-gradient(180deg,rgba(30,70,130,.55),rgba(8,20,45,.75));border:1px solid rgba(127,233,255,.35);border-radius:24px;padding:26px 34px;box-shadow:0 0 40px rgba(60,170,255,.25),0 0 0 1px rgba(255,255,255,.05) inset;min-width:260px}
.panel h2{font-size:30px;font-weight:900;letter-spacing:.08em;color:#dff8ff;text-shadow:0 0 16px rgba(80,200,255,.8);margin-bottom:12px}
.row{display:flex;justify-content:space-between;gap:30px;font-size:16px;color:#9fdcff;margin:6px 0}
.row b{color:#fff;font-size:22px;font-variant-numeric:tabular-nums}
.newbest{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,#ff7ad9,#7fe9ff);color:#061a2c;font-weight:900;font-size:13px;letter-spacing:.15em;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}
.titlebest{color:#7fcfff;font-size:14px;letter-spacing:.18em;font-weight:700}
.flake{position:absolute;color:rgba(200,240,255,.5);pointer-events:none;animation:fall linear infinite}
@keyframes fall{from{transform:translateY(-10vh) rotate(0)}to{transform:translateY(110vh) rotate(360deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="stat"><span class="lbl">SCORE</span><span class="val" id="score">0</span></div>
  <div class="spacer"></div>
  <div class="stat best" style="align-items:flex-end"><span class="lbl">BEST</span><span class="val" id="best">0</span></div>
  <button class="ibtn" id="mute" aria-label="Toggle sound"></button>
</div>

<div class="overlay" id="title">
  <div class="logo">FROST<br>BLOCKS</div>
  <div class="sub">Drag ice pieces onto the board. Fill a row or column to shatter it. Chain clears for combos!</div>
  <div class="titlebest" id="titleBest"></div>
  <button class="big-btn" id="playBtn">PLAY</button>
</div>

<div class="overlay hidden" id="over">
  <div class="panel">
    <h2>FROZEN OUT</h2>
    <div class="row"><span>Score</span><b id="oScore">0</b></div>
    <div class="row"><span>Best</span><b id="oBest">0</b></div>
    <div class="row"><span>Lines cleared</span><b id="oLines">0</b></div>
    <div id="oNew"></div>
  </div>
  <button class="big-btn" id="againBtn">PLAY AGAIN</button>
  <button class="ghost-btn" id="homeBtn">MENU</button>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ---------- storage ---------- */
const LS = 'blizzard_frostblocks_';
const store = {
  get(k, d) { try { const v = localStorage.getItem(LS + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} }
};

/* ---------- audio ---------- */
let actx = null, master = null, muted = !!store.get('muted', false);
function ensureAudio() {
  try {
    if (!actx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = muted ? 0 : 0.55;
      master.connect(actx.destination);
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(f, dur, type, vol, when, slide) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (when || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(f, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.05);
  } catch (e) {}
}
let noiseBuf = null;
function noise(dur, vol, when, freq) {
  if (!actx || muted) return;
  try {
    if (!noiseBuf) {
      noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const t = actx.currentTime + (when || 0);
    const s = actx.createBufferSource(); s.buffer = noiseBuf;
    const f = actx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = freq || 3000;
    const g = actx.createGain();
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master);
    s.start(t); s.stop(t + dur + 0.05);
  } catch (e) {}
}
const sfx = {
  pick() { tone(880, 0.08, 'triangle', 0.12, 0, 1320); },
  drop() { tone(220, 0.12, 'sine', 0.25, 0, 110); noise(0.06, 0.08, 0, 5000); },
  bad() { tone(160, 0.15, 'square', 0.06, 0, 120); },
  clear(n, streak) {
    const base = 520 * Math.pow(1.06, Math.min(streak, 10));
    const notes = [1, 1.25, 1.5, 2, 2.5, 3];
    for (let i = 0; i < Math.min(3 + n, 6); i++) tone(base * notes[i], 0.28, 'triangle', 0.13, i * 0.055);
    noise(0.45, 0.12, 0, 4000);
    tone(base * 4, 0.5, 'sine', 0.05, 0.12);
  },
  allclear() { [1, 1.25, 1.5, 2, 2.5, 3, 4].forEach((m, i) => tone(660 * m, 0.4, 'sine', 0.12, i * 0.07)); },
  newTray() { tone(1200, 0.06, 'sine', 0.06); tone(1600, 0.08, 'sine', 0.05, 0.05); },
  over() { [660, 520, 400, 300, 220].forEach((f, i) => tone(f, 0.35, 'triangle', 0.12, i * 0.13)); }
};
const ICON_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>';
const ICON_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M17 9l5 6M22 9l-5 6"/></svg>';
function updateMuteIcon() { $('mute').innerHTML = muted ? ICON_OFF : ICON_ON; }
updateMuteIcon();
$('mute').addEventListener('pointerdown', e => {
  e.stopPropagation();
  muted = !muted; store.set('muted', muted); updateMuteIcon();
  ensureAudio();
  try { if (master) master.gain.value = muted ? 0 : 0.55; } catch (er) {}
});

/* ---------- colors ---------- */
const COLORS = ['#3fdcff', '#4a86ff', '#a47cff', '#2fe8b5', '#cfeeff', '#ff6fcf'];
const GREY = 6;
const ALLC = COLORS.concat(['#5d6f8c']);
function hexRgb(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function mix(h, to, a) { const c = hexRgb(h); return `rgb(${Math.round(c[0] + (to[0] - c[0]) * a)},${Math.round(c[1] + (to[1] - c[1]) * a)},${Math.round(c[2] + (to[2] - c[2]) * a)})`; }
function rgba(h, a) { const c = hexRgb(h); return `rgba(${c[0]},${c[1]},${c[2]},${a})`; }
const WH = [255, 255, 255], BK = [0, 10, 30];

/* ---------- shapes ---------- */
const N = 8;
const BASE = [
  [2.0, [[0, 0]]],
  [3.0, [[0, 0], [0, 1]]],
  [3.0, [[0, 0], [0, 1], [0, 2]]],
  [2.6, [[0, 0], [0, 1], [0, 2], [0, 3]]],
  [1.6, [[0, 0], [0, 1], [0, 2], [0, 3], [0, 4]]],
  [3.0, [[0, 0], [0, 1], [1, 0], [1, 1]]],
  [1.5, [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2]]],
  [0.9, [[0, 0], [0, 1], [0, 2], [1, 0], [1, 1], [1, 2], [2, 0], [2, 1], [2, 2]]],
  [3.0, [[0, 0], [1, 0], [1, 1]]],
  [3.0, [[0, 0], [1, 0], [2, 0], [2, 1]]],
  [2.4, [[0, 0], [0, 1], [0, 2], [1, 1]]],
  [2.0, [[0, 1], [0, 2], [1, 0], [1, 1]]],
  [2.0, [[0, 0], [1, 0], [2, 0], [2, 1], [2, 2]]],
  [0.8, [[0, 1], [1, 0], [1, 1], [1, 2], [2, 1]]],
  [0.9, [[0, 0], [1, 1]]],
  [0.7, [[0, 0], [0, 2], [1, 0], [1, 1], [1, 2]]]
];
function norm(cells) {
  let mr = Infinity, mc = Infinity;
  cells.forEach(([r, c]) => { mr = Math.min(mr, r); mc = Math.min(mc, c); });
  return cells.map(([r, c]) => [r - mr, c - mc]).sort((a, b) => a[0] - b[0] || a[1] - b[1]);
}
function variants(cells) {
  const out = new Map(); let cur = cells;
  for (let m = 0; m < 2; m++) {
    for (let k = 0; k < 4; k++) {
      cur = cur.map(([r, c]) => [c, -r]);
      const n = norm(cur); out.set(JSON.stringify(n), n);
    }
    cur = cur.map(([r, c]) => [r, -c]);
  }
  return [...out.values()];
}
const POOL = [];
BASE.forEach(([w, cells]) => { const vs = variants(cells); vs.forEach(v => POOL.push({ cells: v, w: w / vs.length })); });
const POOL_W = POOL.reduce((s, p) => s + p.w, 0);
function randomShape() {
  let r = Math.random() * POOL_W;
  for (const p of POOL) { r -= p.w; if (r <= 0) return p.cells; }
  return POOL[0].cells;
}
function makePiece(cells) {
  let w = 0, h = 0;
  cells.forEach(([r, c]) => { h = Math.max(h, r + 1); w = Math.max(w, c + 1); });
  return { cells, w, h, ci: (Math.random() * COLORS.length) | 0, used: false, appear: now, ret: null };
}

/* ---------- state ---------- */
let grid, placeAnim, tray = [], score = 0, shownScore = 0, best = store.get('best', 0) | 0;
let bestAtStart = 0, streak = 0, sinceClear = 0, lines = 0, state = 'title', drag = null, endT = 0;
let clears = [], parts = [], pops = [], shake = 0, now = 0, boardFlash = 0;
let W = 0, H = 0, dpr = 1, cell = 40, bx = 0, by = 0, S = 320, trayRects = [], trayCell = 20, sideLayout = false;
let flakes = [];

function canPlace(p, r, c) {
  for (const [dr, dc] of p.cells) {
    const rr = r + dr, cc = c + dc;
    if (rr < 0 || cc < 0 || rr >= N || cc >= N || grid[rr][cc]) return false;
  }
  return true;
}
function fits(p) {
  for (let r = 0; r <= N - p.h; r++) for (let c = 0; c <= N - p.w; c++) if (canPlace(p, r, c)) return true;
  return false;
}
function newTray() {
  let t;
  for (let tries = 0; tries < 30; tries++) {
    t = [makePiece(randomShape()), makePiece(randomShape()), makePiece(randomShape())];
    if (t.some(fits)) break;
  }
  // distinct colours for variety
  const used = new Set();
  t.forEach((p, i) => { p.appear = now + i * 0.07; while (used.has(p.ci)) p.ci = (p.ci + 1) % COLORS.length; used.add(p.ci); });
  tray = t;
  sfx.newTray();
}
function resetGame() {
  grid = Array.from({ length: N }, () => new Array(N).fill(0));
  placeAnim = Array.from({ length: N }, () => new Array(N).fill(-9));
  bestAtStart = best; score = 0; shownScore = 0; streak = 0; sinceClear = 0; lines = 0;
  clears = []; parts = []; pops = []; drag = null;
  newTray();
  state = 'play';
  updateHud(true);
}

/* ---------- layout ---------- */
const spriteCache = new Map();
function layout() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const top = $('hud').getBoundingClientRect().bottom + 12;
  const availH = H - top - 16, availW = W - 24;
  sideLayout = W > H * 1.15;
  if (sideLayout) {
    S = Math.min(availH, availW / 1.48);
  } else {
    S = Math.min(availW, availH / 1.46, 560);
  }
  S = Math.max(160, Math.floor(S / 8) * 8);
  cell = S / 8;
  trayRects = [];
  if (sideLayout) {
    const tw = S * 0.42, gap = S * 0.06, total = S + gap + tw;
    bx = Math.round((W - total) / 2); by = Math.round(top + (availH - S) / 2);
    for (let i = 0; i < 3; i++) trayRects.push({ x: bx + S + gap, y: by + i * S / 3, w: tw, h: S / 3 });
  } else {
    const th = S * 0.4, gap = S * 0.06, total = S + gap + th;
    bx = Math.round((W - S) / 2); by = Math.round(top + Math.max(0, (availH - total) / 2));
    const tw = Math.min(W - 8, S * 1.08), tx = (W - tw) / 2;
    for (let i = 0; i < 3; i++) trayRects.push({ x: tx + i * tw / 3, y: by + S + gap, w: tw / 3, h: th });
  }
  const r0 = trayRects[0];
  trayCell = Math.min(r0.w / 5.6, r0.h / 5.6, cell * 0.6);
  spriteCache.clear();
  if (!flakes.length) for (let i = 0; i < 70; i++) flakes.push({ x: Math.random(), y: Math.random(), r: Math.random() * 1.8 + 0.4, s: Math.random() * 0.03 + 0.01, d: Math.random() * 6.28 });
}
window.addEventListener('resize', layout);
window.addEventListener('orientationchange', () => setTimeout(layout, 200));

/* ---------- sprites ---------- */
function rr(g, x, y, w, h, r) {
  g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
}
function poly(g, pts, fill) { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (let i = 1; i < pts.length; i++) g.lineTo(pts[i][0], pts[i][1]); g.closePath(); g.fillStyle = fill; g.fill(); }
function getSprite(ci, size) {
  const key = ci + '_' + Math.round(size * 10);
  let sp = spriteCache.get(key);
  if (sp) return sp;
  const s = Math.max(4, Math.round(size * dpr)), p = Math.round(s * 0.3);
  const c = document.createElement('canvas'); c.width = c.height = s + p * 2;
  const g = c.getContext('2d');
  const base = ALLC[ci];
  const ins = s * 0.05, x0 = p + ins, y0 = p + ins, w = s - ins * 2, rad = w * 0.16, b = w * 0.2;
  g.shadowColor = rgba(base, ci === GREY ? 0.15 : 0.7); g.shadowBlur = s * 0.3;
  rr(g, x0, y0, w, w, rad); g.fillStyle = base; g.fill();
  g.shadowBlur = 0;
  g.save(); rr(g, x0, y0, w, w, rad); g.clip();
  poly(g, [[x0, y0], [x0 + w, y0], [x0 + w - b, y0 + b], [x0 + b, y0 + b]], mix(base, WH, 0.6));
  poly(g, [[x0, y0], [x0 + b, y0 + b], [x0 + b, y0 + w - b], [x0, y0 + w]], mix(base, WH, 0.3));
  poly(g, [[x0 + w, y0], [x0 + w, y0 + w], [x0 + w - b, y0 + w - b], [x0 + w - b, y0 + b]], mix(base, BK, 0.25));
  poly(g, [[x0, y0 + w], [x0 + b, y0 + w - b], [x0 + w - b, y0 + w - b], [x0 + w, y0 + w]], mix(base, BK, 0.45));
  const gr = g.createLinearGradient(x0 + b, y0 + b, x0 + w - b, y0 + w - b);
  gr.addColorStop(0, mix(base, WH, 0.45)); gr.addColorStop(0.55, base); gr.addColorStop(1, mix(base, BK, 0.15));
  g.fillStyle = gr; g.fillRect(x0 + b, y0 + b, w - 2 * b, w - 2 * b);
  // crystal fracture lines
  g.strokeStyle = 'rgba(255,255,255,0.38)'; g.lineWidth = Math.max(1, s * 0.025);
  g.beginPath();
  g.moveTo(x0 + b, y0 + w * 0.62); g.lineTo(x0 + w * 0.46, y0 + w * 0.5); g.lineTo(x0 + w - b, y0 + b + w * 0.06);
  g.moveTo(x0 + w * 0.46, y0 + w * 0.5); g.lineTo(x0 + w * 0.58, y0 + w - b);
  g.stroke();
  // glint
  const rg = g.createRadialGradient(x0 + w * 0.32, y0 + w * 0.3, 0, x0 + w * 0.32, y0 + w * 0.3, w * 0.28);
  rg.addColorStop(0, 'rgba(255,255,255,0.85)'); rg.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = rg; g.fillRect(x0, y0, w, w);
  g.restore();
  rr(g, x0 + 0.5, y0 + 0.5, w - 1, w - 1, rad); g.strokeStyle = 'rgba(255,255,255,0.45)'; g.lineWidth = Math.max(1, s * 0.03); g.stroke();
  sp = { c, pad: p / dpr };
  spriteCache.set(key, sp);
  return sp;
}
function drawBlock(ci, x, y, size, alpha, scale) {
  const sp = getSprite(ci, size);
  const sc = scale || 1;
  const full = size + sp.pad * 2;
  const d = full * sc;
  if (alpha !== undefined && alpha < 1) ctx.globalAlpha = Math.max(0, alpha);
  ctx.drawImage(sp.c, x + size / 2 - d / 2, y + size / 2 - d / 2, d, d);
  ctx.globalAlpha = 1;
}

/* ---------- input ---------- */
function pt(e) { const r = cv.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
function trayPiecePos(i, p) {
  const r = trayRects[i];
  return { x: r.x + r.w / 2 - p.w * trayCell / 2, y: r.y + r.h / 2 - p.h * trayCell / 2 };
}
cv.addEventListener('pointerdown', e => {
  ensureAudio();
  if (state !== 'play' || drag) return;
  const q = pt(e);
  let best_i = -1, bd = Infinity;
  for (let i = 0; i < 3; i++) {
    const p = tray[i]; if (!p || p.used) continue;
    const r = trayRects[i];
    const pad = 8;
    if (q.x >= r.x - pad && q.x <= r.x + r.w + pad && q.y >= r.y - pad && q.y <= r.y + r.h + pad) {
      const pp = trayPiecePos(i, p);
      const d = Math.hypot(q.x - (pp.x + p.w * trayCell / 2), q.y - (pp.y + p.h * trayCell / 2));
      if (d < bd) { bd = d; best_i = i; }
    }
  }

/* ---------- particles ---------- */

    const a = Math.random() * Math.PI * 2, sp = (Math.random() * 3 + 1.5) * cell * 0.06;

let bgGrad = null, bgW = 0, bgH = 0;

function drawBoard() {

  ctx.shadowBlur = 30 + boardFlash * 30;

  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>
<script id="blizMusicScript">
/* BlizMusic: original background music, generated live with Web Audio.
   Every song is composed in code (chords + melody + drums), so there is no copyrighted audio. */
(function(){
  if(window.BlizMusic) return;

  var SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10] };
  // prog = scale degrees (0-based) of each bar's chord; mel = melody contour seed
  var THEMES = {
    chill:   { name:'Snowfall Lounge', bpm:88,  root:60, scale:'major',  prog:[0,4,5,3], drums:'soft',   arp:'up',     lead:'triangle', pad:.5,  swing:.12 },
    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };
  function pickTheme(){
    var t = (document.title || '').toLowerCase();
    if(/sled/.test(t)) return 'snow';
    if(/frost|gem/.test(t)) return 'puzzle';
    if(/tunnel\s*2/.test(t)) return 'neon';
    if(/tunnel|road/.test(t)) return 'drive';
    if(/hollow/.test(t)) return 'mystery';
    return 'chill';
  }

  var store = {
    get:function(k,d){ try{ var v = localStorage.getItem('blizzard_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('blizzard_'+k, JSON.stringify(v)); }catch(e){} }
  };

  var ctx = null, master, comp, delay, delayGain, noiseBuf;
  var on = store.get('music', true), playing = false, timer = null;
  var theme = THEMES[pickTheme()], themeKey = pickTheme();
  var step = 0, nextTime = 0, melody = [], seed = 1;

  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function note(deg, oct){
    var sc = SCALES[theme.scale], n = sc.length;
    var o = Math.floor(deg / n); deg = ((deg % n) + n) % n;
    return theme.root + sc[deg] + 12 * (o + (oct || 0));
  }

  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0;
    delay = ctx.createDelay(1); delayGain = ctx.createGain(); delayGain.gain.value = .28;
    var fb = ctx.createGain(); fb.gain.value = .32;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delayGain); delayGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return true;
  }

  // Compose a 2-bar motif per chord so the tune repeats and is catchy, not random noise
  function compose(){
    seed = 0; for(var i=0;i<themeKey.length;i++) seed = (seed * 31 + themeKey.charCodeAt(i)) % 2147483647; seed = seed || 7;
    melody = [];
    var pos = 4;
    for(var bar=0; bar<8; bar++){
      var chord = theme.prog[bar % 4], row = [];
      for(var s=0; s<16; s++){
        var strong = s % 4 === 0;
        if(rand() < (strong ? .82 : .32)){
          var tones = [chord, chord+2, chord+4];
          if(strong) pos = tones[(rand()*3)|0] + 7;
          else pos += [-1,1,-2,2,0][(rand()*5)|0];
          pos = Math.max(4, Math.min(14, pos));
          row.push(pos);
        }else row.push(null);
      }
      melody.push(row);
    }
    for(var r=4;r<8;r++) melody[r] = melody[r-4].map(function(v, s){ return (s > 11 && v !== null) ? v + (r === 7 ? -1 : 1) : v; });
  }

  function tone(type, freq, t, dur, vol, dest, attack, cutoff){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    var a = attack || .008;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if(cutoff){ var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(dest || master);
    o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function noise(t, dur, vol, hp){
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }

  function playStep(s, t){
    var bar = Math.floor(s / 16), st = s % 16, chord = theme.prog[bar % 4];
    var sixteenth = 60 / theme.bpm / 4;
    // pad: soft chord at start of each bar
    if(st === 0 && theme.pad){
      [chord, chord+2, chord+4].forEach(function(d){
        tone('triangle', mtof(note(d, -1)), t, sixteenth*16, .045*theme.pad, null, .25, 1400);
      });
    }
    // bass
    var bassHits = theme.drums === 'drive' ? [0,3,6,8,11,14] : [0,8,10];
    if(bassHits.indexOf(st) >= 0) tone('triangle', mtof(note(chord, -2)), t, sixteenth*2.6, .16, null, .01, 700);
    // arpeggio
    var tones = [chord, chord+2, chord+4, chord+7];
    var arpVol = .05, d;
    if(theme.arp === 'up' && st % 2 === 0) d = tones[(st/2) % 4];
    else if(theme.arp === 'updown') d = [0,1,2,3,2,1,0,1][(st % 8)] !== undefined ? tones[[0,1,2,3,2,1,0,1][st % 8]] : null;
    else if(theme.arp === 'pluck' && (st % 4 === 2 || st % 4 === 3)) d = tones[(st >> 1) % 4];
    else if(theme.arp === 'box' && st % 4 === 0) { d = tones[(st/4) % 4] + 7; arpVol = .07; }
    if(d !== undefined && d !== null){
      var g = tone(theme.arp === 'box' ? 'sine' : 'square', mtof(note(d, 0)), t, sixteenth * (theme.arp === 'box' ? 6 : 1.4), arpVol, null, .005, theme.arp === 'box' ? 0 : 2200);
      g.connect(delay);
    }
    // melody
    var m = melody[bar % 8][st];
    if(m !== null && m !== undefined){
      var len = 1; while(st + len < 16 && melody[bar % 8][st + len] === null && len < 4) len++;
      var lg = tone(theme.lead, mtof(note(m, 0)), t, sixteenth * len * 1.1, theme.lead === 'sawtooth' || theme.lead === 'square' ? .045 : .09, null, .01, theme.lead === 'sine' ? 0 : 3000);
      lg.connect(delay);
    }
    // drums
    var dr = theme.drums;
    if(dr === 'drive'){
      if(st % 4 === 0) kick(t, .5);
      if(st === 4 || st === 12) noise(t, .14, .22, 1500);
      if(st % 2 === 1) noise(t, .04, .07, 7000);
    }else if(dr === 'bounce'){
      if(st === 0 || st === 7 || st === 10) kick(t, .4);
      if(st === 4 || st === 12) noise(t, .1, .14, 2000);
      if(st % 2 === 0) noise(t, .03, .05, 8000);
    }else if(dr === 'soft'){
      if(st === 0 || st === 10) kick(t, .3);
      if(st === 4 || st === 12) noise(t, .08, .08, 3000);
      if(st % 4 === 2) noise(t, .03, .04, 8000);
    }else if(dr === 'tick'){
      if(st % 4 === 0) noise(t, .025, .05, 6000);
      if(st === 0) kick(t, .18);
    }
  }

  function schedule(){
    var sixteenth = 60 / theme.bpm / 4;
    while(nextTime < ctx.currentTime + .15){
      var swing = (step % 2 === 1) ? sixteenth * theme.swing : 0;
      playStep(step, nextTime + swing);
      nextTime += sixteenth; step++;
    }
  }
  function start(){
    if(!on || playing || document.hidden || !init()) return;
    if(ctx.state === 'suspended') ctx.resume();
    compose();
    playing = true; step = 0; nextTime = ctx.currentTime + .08;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 1.2);
    timer = setInterval(schedule, 40); schedule();
  }
  function stop(){
    if(!playing) return;
    playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .25);
  }

  /* ---------- button ---------- */
  var btn = document.createElement('button');
  btn.id = 'blizMusicBtn'; btn.type = 'button';
  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
