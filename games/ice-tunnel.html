<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#02040f">
<title>Ice Tunnel</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#02040f;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(140,230,255,.55);background:rgba(8,14,40,.55);color:#c8f6ff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0;touch-action:none;
  box-shadow:0 0 14px rgba(80,200,255,.35)}
#mute svg{width:22px;height:22px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<button id="mute" aria-label="Toggle sound"></button>
<script>
(function(){
'use strict';

/* ---------- version ---------- */
const V = (function(){ try { return new URLSearchParams(location.search).get('v') === '2' ? 2 : 1; } catch(e){ return 1; } })();
const CFG = V === 2
  ? { name: 'ICE TUNNEL 2', title: 'Ice Tunnel 2', key: 'icetunnel2_best', speed0: 13, speedMax: 33, tau: 75, turn: 4.6,
      bend: 1, twist: 1, gapT0: 0.85, gapT1: 0.5, sub: 'Faster. Twistier. Stranger.' }
  : { name: 'ICE TUNNEL', title: 'Ice Tunnel', key: 'icetunnel_best', speed0: 10, speedMax: 25, tau: 70, turn: 4.0,
      bend: 0.25, twist: 0, gapT0: 1.0, gapT1: 0.6, sub: 'Spin through the endless frozen tube' };
document.title = CFG.title;

/* ---------- canvas ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, M = 1, F = 300, FS = 300;
const TAU = Math.PI * 2, R = 1, RIN = 0.58, PZ = 2, FAR = 40, NEAR = 0.7, SP = 1.5, DEPTH = 0.85;
const S = 16, SW = TAU / S, HW = 0.08, SHIP_R = 0.79, CLOSE = 0.1, GEM_R = 0.22;

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  M = Math.min(W, H);
  // on tall phones let the tube overflow the sides a little so the ship and gaps are bigger
  FS = Math.max(M * 0.47, Math.min(W * 0.58, H * 0.4)); F = FS * PZ;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const randi = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
function angDiff(a, b){ let d = (a - b) % TAU; if (d < -Math.PI) d += TAU; if (d > Math.PI) d -= TAU; return d; }
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
const hsl = (h, s, l, a) => 'hsla(' + (((h % 360) + 360) % 360).toFixed(1) + ',' + s + '%,' + l + '%,' + (a === undefined ? 1 : a.toFixed(3)) + ')';

/* ---------- storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('blizzard_' + k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('blizzard_' + k, String(v)); } catch(e){} }
};
let best = parseInt(store.get(CFG.key, '0'), 10) || 0;
let muted = store.get('muted', '0') === '1';

/* ---------- audio (bright, soft: sine/triangle only) ---------- */
let AC = null, master = null;
function ensureAudio(){
  try {
    if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain(); master.gain.value = muted ? 0 : 0.45; master.connect(AC.destination);
  } catch(e){ AC = null; }
}
function tone(freq, dur, type, vol, slide, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function noise(dur, vol, freq){
  if (!AC || muted) return;
  try {
    const n = Math.floor(AC.sampleRate * dur), b = AC.createBuffer(1, n, AC.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 900;
    const g = AC.createGain(); g.gain.value = vol || .15;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  } catch(e){}
}
const LADDER = [659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568, 1760];
const sfx = {
  start(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .16, 'triangle', .14, 0, i * .07)); },
  pass(){ tone(880, .07, 'sine', .035); },
  close(n){ const f = LADDER[Math.min(n, LADDER.length - 1)]; tone(f, .09, 'triangle', .11); tone(f * 1.5, .14, 'sine', .07, 0, .05); },
  gem(n){ const f = LADDER[Math.min(n, LADDER.length - 1)] * 1.5; tone(f, .08, 'sine', .09); tone(f * 1.26, .12, 'sine', .06, 0, .04); },
  level(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .16, 'triangle', .1, 0, i * .07)); },
  crash(){ noise(.5, .2, 700); tone(783.99, .2, 'triangle', .12); tone(587.33, .24, 'triangle', .11, 0, .1); tone(392, .5, 'sine', .14, 0, .2); },
  best(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .18, 'triangle', .13, 0, i * .09)); }
};

/* ---------- mute ---------- */
const muteBtn = document.getElementById('mute');
const SVG_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SVG_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
function refreshMute(){ muteBtn.innerHTML = muted ? SVG_OFF : SVG_ON; }
function toggleMute(){
  ensureAudio(); muted = !muted; store.set('muted', muted ? '1' : '0');
  try { if (master) master.gain.value = muted ? 0 : 0.45; } catch(e){}
  refreshMute(); if (!muted) tone(660, .08, 'sine', .15);
}
muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleMute(); });
muteBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
refreshMute();

/* ---------- input ---------- */
const keys = {}, pointers = new Map();
window.addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(c) >= 0) e.preventDefault();
  ensureAudio(); keys[c] = true;
  if (e.repeat) return;
  if (c === 'Space' || c === 'Enter') primaryAction();
  else if (c === 'KeyP' || c === 'Escape') togglePause();
  else if (c === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); ensureAudio();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  // the tap that starts a run should not also spin the ship
  pointers.set(e.pointerId, { x: e.clientX, live: state === 'play' && !paused });
  primaryAction();
});
cv.addEventListener('pointermove', e => { const p = pointers.get(e.pointerId); if (p) p.x = e.clientX; });
const endPtr = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', endPtr); cv.addEventListener('pointercancel', endPtr); cv.addEventListener('lostpointercapture', endPtr);
document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());
function steerInput(){
  let d = 0;
  if (keys.ArrowLeft || keys.KeyA) d -= 1;
  if (keys.ArrowRight || keys.KeyD) d += 1;
  let l = false, r = false;
  pointers.forEach(p => { if (!p.live) return; if (p.x < W / 2) l = true; else r = true; });
  if (l) d -= 1; if (r) d += 1;
  return clamp(d, -1, 1);
}

/* ---------- state ---------- */
let state = 'title', paused = false, t = 0, elapsed = 0;
let theta = 0, omega = 0, speed = CFG.speed0, dist = 0, score = 0, spawnAcc = 0, level = 1;
let obs = [], gems = [], parts = [], pops = [], dust = [];
let shake = 0, flash = 0, overTimer = 0, dyingTimer = 0, newBest = false, rings = 0;
let combo = 0, comboT = 0, bestCombo = 0, gemCount = 0, closes = 0, levelFlash = 0, scorePulse = 0;
let hue = 195, obsHue = 225;
let bendX = 0, bendY = 0, twist = 0;
let lastExit = 0, lastU = 0, lastEnd = PZ, introLeft = 0, introAng = 0;
let crashPt = null;
const COMBO_TIME = 3;

function primaryAction(){
  if (paused){ paused = false; return; }
  if (state === 'title') startGame();
  else if (state === 'over' && overTimer > 0.7) startGame();
}
function togglePause(){ if (state === 'play' || state === 'dying') paused = !paused; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'dying')) paused = true;
  last = performance.now();
});
window.addEventListener('pagehide', () => { if (state === 'play') paused = true; });

function startGame(){
  state = 'play'; elapsed = 0; score = 0; rings = 0; level = 1; newBest = false;
  combo = 0; comboT = 0; bestCombo = 0; gemCount = 0; closes = 0;
  theta = 0; omega = 0; speed = CFG.speed0; obs = []; gems = []; parts.length = 0; pops.length = 0;
  overTimer = 0; dyingTimer = 0; crashPt = null;
  lastExit = theta; lastU = 0; lastEnd = PZ + 4;
  spawnAcc = 0;
  // gentle intro: the first 3 walls open right where the ship starts, the first one ~1.75s away
  introLeft = 3; introAng = theta;
  let z = PZ + CFG.speed0 * 1.75;
  while (z < FAR){ spawnNext(z); z += spawnAcc; }
  spawnAcc = z - FAR;
  sfx.start();
}

function initDust(){
  dust = [];
  for (let i = 0; i < 70; i++) dust.push({ a: Math.random() * TAU, r: rand(.35, .97), z: rand(NEAR, FAR) });
}
initDust();

/* ---------- projection ---------- */
function centerAt(z){
  const k = 0.2 * (1 - Math.exp(-Math.max(0, z - PZ) / 7));
  return { x: W / 2 + bendX * k * M, y: H * 0.47 + bendY * k * M };
}
function P(a, r, z){
  const c = centerAt(z), s = F / z;
  const ang = a - theta + Math.PI / 2 + twist * (z - PZ);
  return { x: c.x + Math.cos(ang) * r * s, y: c.y + Math.sin(ang) * r * s };
}
function fogA(z){ return clamp(1 - Math.pow(z / FAR, 1.3), 0, 1); }
function fogO(z){ return clamp(1 - Math.pow(z / FAR, 2.2), 0, 1); }

/* ---------- obstacles ---------- */
function blocksFrom(mask){
  let start = mask.indexOf(false); if (start < 0) start = 0;
  const out = []; let cur = null;
  for (let k = 1; k <= S; k++){
    const i = (start + k) % S;
    if (mask[i]){ if (cur) cur.w += SW; else { cur = { a0: i * SW, w: SW }; out.push(cur); } }
    else cur = null;
  }
  return out;
}
const segOf = a => ((Math.round(a / SW) % S) + S) % S;
// a mask whose gap of `size` segments is centred on angle c
function gapMaskAt(c, size){
  const m = new Array(S).fill(true);
  const s0 = Math.round(c / SW - size / 2);
  for (let k = 0; k < size; k++) m[((s0 + k) % S + S) % S] = false;
  return { m: m, c: (s0 + size / 2) * SW };
}
function ring(z, mask, extra){
  const o = { z: z, zp: z, d: DEPTH, blocks: blocksFrom(mask), rot: 0, amp: 0, freq: 0, ph: 0, minClear: 9, passed: false, born: t, hit: -1 };
  if (extra) for (const k in extra) o[k] = extra[k];
  obs.push(o); return o;
}
function gem(z, a){ gems.push({ z: z, zp: z, a: a, got: false, spin: Math.random() * TAU }); }
function obsOff(o, at){ const tt = at === undefined ? t : at; return o.rot * (tt - o.born) + o.amp * Math.sin(o.freq * tt + o.ph); }
const arrive = z => t + (z - PZ) / Math.max(speed, 1);

/* Every pattern gets an aim angle and a reach (how far from the aim its opening may be
   while staying reachable), and returns { len, exit, u }: its length, the angle the ship
   leaves through, and how uncertain that exit is. That keeps every run fair. */
const PATTERNS = {
  gap(z, d, aim, reach){
    const size = Math.max(3, Math.round(5 - d * 2.2));
    const g = gapMaskAt(aim + rand(-reach, reach), size);
    ring(z, g.m); gem(z + DEPTH / 2, g.c);
    return { len: DEPTH, exit: g.c, u: size * SW / 2 - HW - .15 };
  },
  snake(z, d, aim, reach){
    const n = 4 + Math.floor(d * 3), dir = Math.random() < .5 ? -1 : 1, step = d > .4 && Math.random() < .5 ? 2 : 1;
    const sp = speed * (step * SW / CFG.turn) * 1.7 + 1.6;
    let c = aim + rand(-reach, reach) * .6, g = null;
    for (let i = 0; i < n; i++){ g = gapMaskAt(c, 4); ring(z + i * sp, g.m); if (i < n - 1) gem(z + i * sp + sp / 2, g.c + dir * step * SW / 2); c += dir * step * SW; }
    return { len: (n - 1) * sp + DEPTH, exit: g.c, u: .3 };
  },
  scatter(z, d, aim, reach){
    const m = []; for (let i = 0; i < S; i++) m.push(Math.random() < .32 + d * .25);
    const g = gapMaskAt(aim + rand(-reach, reach), 3);
    for (let i = 0; i < S; i++) if (!g.m[i]) m[i] = false;
    if (m.every(v => !v)) m[(segOf(g.c) + 8) % S] = true;
    ring(z, m); gem(z + DEPTH / 2, g.c);
    return { len: DEPTH, exit: g.c, u: .45 };
  },
  cross(z, d, aim, reach){
    // four 3-wide walls, four 1-segment-wider openings
    const c = aim + rand(-reach, reach), s0 = Math.round(c / SW - 2.5), m = [];
    for (let i = 0; i < S; i++) m.push(((i - s0) % 8 + 8) % 8 >= 5);
    ring(z, m); gem(z + DEPTH / 2, (s0 + 2.5) * SW);
    return { len: DEPTH, exit: (s0 + 2.5) * SW, u: .8 };
  },
  half(z, d, aim, reach){
    // open half first, then the opposite half: slide across the seam
    const c = aim + rand(-reach * .5, reach * .5), s0 = Math.round(c / SW - 4);
    const m1 = []; for (let i = 0; i < S; i++) m1.push(((i - s0 + S * 2) % S) >= 8);
    const sp = 2 + speed * 0.5;
    ring(z, m1);
    ring(z + sp, m1.map(v => !v));
    const ex = (Math.random() < .5 ? s0 - 1.5 : s0 + 9.5) * SW;   // just across one seam
    gem(z + sp * .6, ex);
    return { len: sp + DEPTH, exit: ex, u: 1.2 };
  },
  // ---- Ice Tunnel 2 only ----
  rotgap(z, d, aim, reach){
    const rot = (Math.random() < .5 ? -1 : 1) * (0.6 + d * .6);
    const at = aim + rand(-reach, reach);           // where the gap will be when it reaches you
    const g = gapMaskAt(at - rot * (arrive(z) - t), 4);
    ring(z, g.m, { rot: rot });
    return { len: DEPTH, exit: at, u: .6 };
  },
  movers(z, d, aim, reach){
    const m = new Array(S).fill(false), s0 = segOf(aim + rand(-reach, reach)) + 2;
    for (const b of [0, 5, 10]){ m[(s0 + b) % S] = true; m[(s0 + b + 1) % S] = true; }
    ring(z, m, { amp: 0.5, freq: 1.6 + d, ph: Math.random() * TAU });
    return { len: DEPTH + speed * .2, exit: aim, u: 1.4 };
  },
  blades(z, d){
    const r = randi(S), m = new Array(S).fill(false);
    m[r] = m[(r + 1) % S] = m[(r + 8) % S] = m[(r + 9) % S] = true;
    if (d > .5){ m[(r + 4) % S] = m[(r + 12) % S] = true; }
    const o = ring(z, m, { d: DEPTH * 1.5, rot: (Math.random() < .5 ? -1 : 1) * 1.3 });
    return { len: DEPTH * 1.5 + speed * .3, exit: (r + 4.5) * SW + o.rot * (arrive(z) - t), u: 1.6 };
  },
  counter(z, d, aim, reach){
    const sp = 2.5 + speed * 0.12;
    const a1 = aim + rand(-reach, reach);
    const a2 = a1 + rand(-1, 1) * Math.min(1.2, CFG.turn * (sp / speed) * .55);
    const g1 = gapMaskAt(a1 - 0.9 * (arrive(z) - t), 5), g2 = gapMaskAt(a2 + 0.9 * (arrive(z + sp) - t), 5);
    ring(z, g1.m, { rot: 0.9 });
    ring(z + sp, g2.m, { rot: -0.9 });
    return { len: sp + DEPTH, exit: a2, u: .7 };
  },
  pulse(z, d, aim){
    const s0 = segOf(aim) + 2, m = new Array(S).fill(false);
    for (let i = 0; i < S; i += 4){ m[(s0 + i) % S] = true; }
    ring(z, m, { amp: SW * 1.2, freq: 2.6, ph: 0 });
    return { len: DEPTH + speed * .15, exit: aim, u: 1.2 };
  }
};
const W1 = [['gap', 26], ['snake', 18], ['scatter', 18], ['cross', 16], ['half', 14]];
const W2 = [['gap', 10], ['snake', 12], ['scatter', 10], ['cross', 8], ['half', 8], ['rotgap', 16], ['movers', 12], ['blades', 9], ['counter', 11], ['pulse', 8]];
const diffNow = () => clamp(elapsed / 110, 0, 1);
function spawnNext(z){
  const d = diffNow();
  const turnEff = CFG.turn * (1 + d * .12);
  const time = Math.max(0.05, (z - lastEnd) / Math.max(speed, 1));
  const reach = clamp(turnEff * time * 0.6 - lastU + 0.45, 0.1, Math.PI);
  let name;
  if (elapsed < 9) name = Math.random() < .65 ? 'gap' : 'cross';
  else {
    const table = V === 2 ? W2 : W1;
    let tot = 0; for (const e of table) tot += e[1];
    let r = Math.random() * tot; name = table[0][0];
    for (const e of table){ r -= e[1]; if (r <= 0){ name = e[0]; break; } }
  }
  let res;
  if (introLeft > 0){
    introLeft--;
    const g = gapMaskAt(introAng, 6);   // wide opening centred on the starting angle
    ring(z, g.m); gem(z + DEPTH / 2, g.c);
    res = { len: DEPTH, exit: g.c, u: .3 };
  } else res = PATTERNS[name](z, d, lastExit, reach);
  // a trail of gems from the previous exit to this pattern's exit guides the eye
  if (state === 'play' && z - lastEnd > 5){
    const n = Math.floor((z - lastEnd) / 4.5);
    const da = angDiff(res.exit, lastExit);
    for (let i = 1; i <= n; i++){
      const k = i / (n + 1);
      if (Math.random() < .7) gem(lastEnd + (z - lastEnd) * k, lastExit + da * k * k);
    }
  }
  lastExit = res.exit; lastU = Math.max(0, res.u); lastEnd = z + res.len;
  spawnAcc = res.len + speed * lerp(CFG.gapT0, CFG.gapT1, d);
}

/* ---------- particles ---------- */
function burst(x, y, n, colors, spd, life, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * TAU, v = rand(.2, 1) * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * rand(.5, 1), max: life, r: size * rand(.6, 1.4), c: colors[randi(colors.length)], g: 0 });
  }
}
function pop(text, x, y, c, big){ pops.push({ text: text, x: x, y: y, life: big ? 1.5 : 1.0, c: c, big: !!big }); }
function bumpCombo(){ combo++; comboT = COMBO_TIME; if (combo > bestCombo) bestCombo = combo; }

/* ---------- update ---------- */
let last = performance.now();
function update(dt){
  t += dt;
  if (V === 2){ hue = 200 + t * 14; obsHue = hue + 165; }
  else { hue = 195 + Math.sin(t * .2) * 8; obsHue = 205 + Math.sin(t * .2) * 8; }
  bendX = (Math.sin(t * .31) * .45 + Math.sin(t * .13) * .2) * CFG.bend;
  bendY = (Math.cos(t * .23) * .3 + Math.sin(t * .41) * .08) * CFG.bend;
  twist = Math.sin(t * .21) * .055 * CFG.twist;

  if (state === 'play'){
    elapsed += dt;
    speed = CFG.speed0 + (CFG.speedMax - CFG.speed0) * (1 - Math.exp(-elapsed / CFG.tau));
    const lv = 1 + Math.floor(elapsed / 20);
    if (lv > level){ level = lv; sfx.level(); levelFlash = 1; pop('LEVEL ' + level, W / 2, H * .28, hsl(hue, 100, 80), true); }
  } else if (state === 'title') speed = CFG.speed0 * .8;
  else speed = Math.max(0, speed - speed * 2.2 * dt - 2 * dt);

  const dz = speed * dt;
  dist += dz;
  if (state === 'play') score += dz;
  lastEnd -= dz;

  let target = 0;
  const d = diffNow();
  if (state === 'play') target = -steerInput() * CFG.turn * (1 + d * .12);
  else if (state === 'title') target = Math.sin(t * .8) * 1.4;
  // fast response, quicker still when reversing direction
  const resp = (target !== 0 && Math.sign(target) !== Math.sign(omega)) ? 26 : 16;
  omega += (target - omega) * Math.min(1, resp * dt);
  theta += omega * dt;

  if (combo > 0 && state === 'play'){ comboT -= dt; if (comboT <= 0) combo = 0; }

  // obstacles (swept test: catches walls even on a slow frame)
  for (let i = obs.length - 1; i >= 0; i--){
    const o = obs[i];
    o.zp = o.z; o.z -= dz;
    if (state === 'play' && !o.passed){
      if (o.z <= PZ && o.zp + o.d >= PZ){
        const off = obsOff(o);
        for (let bi = 0; bi < o.blocks.length; bi++){
          const b = o.blocks[bi];
          const dd = Math.abs(angDiff(theta, b.a0 + off + b.w / 2)) - b.w / 2 - HW;
          if (dd < 0){ o.hit = bi; crash(o); break; }
          if (dd < o.minClear) o.minClear = dd;
        }
      }
      if (state === 'play' && o.z + o.d < PZ){ o.passed = true; passRing(o); }
    }
    if (o.z + o.d < NEAR * .6) obs.splice(i, 1);
  }
  for (let i = gems.length - 1; i >= 0; i--){
    const g = gems[i];
    g.zp = g.z; g.z -= dz; g.spin += dt * 4;
    if (state === 'play' && !g.got && g.zp >= PZ && g.z < PZ){
      if (Math.abs(angDiff(theta, g.a)) < GEM_R){
        g.got = true; gemCount++; bumpCombo();
        const b = 10 * Math.min(combo, 10); score += b; scorePulse = 1;
        const sp = P(theta, SHIP_R, PZ);
        burst(sp.x, sp.y - FS * .05, 12, ['#ffffff', hsl(hue + 40, 100, 80), '#ffe9a8'], M * .35, .45, M / 160);
        sfx.gem(combo);
        if (combo > 2) pop('+' + b, sp.x, sp.y - FS * .2, hsl(hue + 40, 100, 85));
      }
    }
    if (g.z < NEAR || g.got) gems.splice(i, 1);
  }
  if (state === 'play'){
    spawnAcc -= dz;
    if (spawnAcc <= 0) spawnNext(FAR + spawnAcc);
  }

  for (const s of dust){ s.z -= dz * 1.15; if (s.z < NEAR){ s.z = FAR * rand(.7, 1); s.a = Math.random() * TAU; s.r = rand(.35, .97); } }

  if (state === 'play'){
    const sp = P(theta, SHIP_R, PZ), u = FS * .075;
    for (let k = 0; k < 2; k++){
      parts.push({ x: sp.x + rand(-.3, .3) * u, y: sp.y + u * .35, vx: rand(-30, 30) + omega * 25, vy: rand(60, 160), life: rand(.25, .5), max: .5,
        r: rand(2, 4) * u / 20, c: Math.random() < .5 ? '#ffffff' : hsl(hue, 100, 72), g: 0 });
    }
  }
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i]; p.life -= dt;
    if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.4, dt); p.vy *= Math.pow(.4, dt); p.vy += p.g * dt;
  }
  if (parts.length > 600) parts.splice(0, parts.length - 600);
  for (let i = pops.length - 1; i >= 0; i--){ const q = pops[i]; q.life -= dt; q.y -= (q.big ? 20 : 45) * dt; if (q.life <= 0) pops.splice(i, 1); }

  shake = Math.max(0, shake - 45 * dt);
  flash = Math.max(0, flash - 2.5 * dt);
  levelFlash = Math.max(0, levelFlash - 1.2 * dt);
  scorePulse = Math.max(0, scorePulse - 3 * dt);
  if (state === 'dying'){ dyingTimer += dt; if (dyingTimer > 1.0) gameOver(); }
  if (state === 'over') overTimer += dt;
}

function passRing(o){
  rings++;
  score += 5;
  if (o.minClear < CLOSE){
    bumpCombo(); closes++;
    const b = 20 * Math.min(combo, 10);
    score += b; scorePulse = 1; shake = Math.max(shake, 3);
    const sp = P(theta, SHIP_R, PZ);
    pop('CLOSE +' + b, sp.x, sp.y - FS * .22, hsl(obsHue, 100, 82));
    burst(sp.x, sp.y, 14, ['#ffffff', hsl(obsHue, 100, 80)], M * .4, .4, M / 170);
    sfx.close(combo);
  } else sfx.pass();
}
function crash(o){
  state = 'dying'; dyingTimer = 0; shake = 20; flash = .55;
  const sp = P(theta, SHIP_R, PZ);
  crashPt = { x: sp.x, y: sp.y };
  burst(sp.x, sp.y, 60, ['#ffffff', hsl(hue, 100, 72), '#bff6ff'], M * .9, 1.2, M / 110);
  burst(sp.x, sp.y, 30, [hsl(obsHue, 100, 75), hsl(obsHue, 90, 60)], M * .6, 1.0, M / 80);
  sfx.crash();
}
function gameOver(){
  state = 'over'; overTimer = 0;
  const s = Math.floor(score);
  if (s > best){ best = s; newBest = true; store.set(CFG.key, best); sfx.best(); }
}

/* ---------- render: tunnel ---------- */
function drawTunnel(){
  const cf = centerAt(FAR);
  ctx.fillStyle = hsl(hue + 20, 70, 5); ctx.fillRect(-30, -30, W + 60, H + 60);
  const bg = ctx.createRadialGradient(cf.x, cf.y, 0, cf.x, cf.y, Math.max(W, H) * .8);
  bg.addColorStop(0, hsl(hue, 85, 24)); bg.addColorStop(.35, hsl(hue + 15, 80, 11)); bg.addColorStop(1, hsl(hue + 30, 70, 5));
  ctx.fillStyle = bg; ctx.fillRect(-30, -30, W + 60, H + 60);

  const off = dist % SP, base = Math.floor(dist / SP);
  const zs = [], idx = [];
  for (let k = Math.ceil((FAR + off) / SP); k >= 0; k--){
    const z = k * SP - off;
    if (z < NEAR) continue;
    zs.push(z); idx.push(k + base);
  }
  zs.push(NEAR); idx.push(-1);
  const G = zs.map(z => { const row = []; for (let i = 0; i < S; i++) row.push(P(i * SW, R, z)); return row; });

  for (let j = 0; j < zs.length - 1; j++){
    const za = zs[j], a = fogA(za);
    if (a <= .01) continue;
    for (let i = 0; i < S; i++){
      const p1 = G[j][i], p2 = G[j][(i + 1) % S], p3 = G[j + 1][(i + 1) % S], p4 = G[j + 1][i];
      const odd = ((idx[j] + i) & 1) !== 0;
      ctx.fillStyle = hsl(hue + i * 2, 85, odd ? 30 : 48, (odd ? .08 : .16) * a);
      ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y); ctx.closePath(); ctx.fill();
    }
  }
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < S; i++){
    ctx.strokeStyle = hsl(hue, 100, 65, .2);
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let j = 0; j < zs.length; j++){ const p = G[j][i]; j ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.stroke();
  }
  for (let j = 0; j < zs.length - 1; j++){
    const z = zs[j], a = fogA(z), c = centerAt(z), r = R * F / z;
    const big = (idx[j] % 4) === 0;
    if (big){
      ctx.strokeStyle = hsl(hue, 100, 60, (.25 + levelFlash * .5) * a); ctx.lineWidth = Math.max(2, .09 * F / z);
      ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = hsl(hue, 100, 85, .85 * a); ctx.lineWidth = Math.max(1, .022 * F / z);
    } else {
      ctx.strokeStyle = hsl(hue, 100, 70, .3 * a); ctx.lineWidth = Math.max(.75, .01 * F / z);
    }
    ctx.beginPath(); ctx.arc(c.x, c.y, r, 0, TAU); ctx.stroke();
  }
  const fr = M * .32;
  const fg = ctx.createRadialGradient(cf.x, cf.y, 0, cf.x, cf.y, fr);
  fg.addColorStop(0, hsl(hue, 100, 88, .55)); fg.addColorStop(.3, hsl(hue, 100, 60, .16)); fg.addColorStop(1, hsl(hue, 100, 50, 0));
  ctx.fillStyle = fg; ctx.fillRect(cf.x - fr, cf.y - fr, fr * 2, fr * 2);
  ctx.lineCap = 'round';
  for (const s of dust){
    const a = fogA(s.z); if (a < .05) continue;
    const p1 = P(s.a, s.r, s.z), p2 = P(s.a, s.r, s.z + .25 + speed * .03);
    ctx.strokeStyle = 'rgba(220,250,255,' + (.5 * a).toFixed(3) + ')';
    ctx.lineWidth = Math.max(1, .012 * F / s.z);
    ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  // the ship's lane, painted ahead on the wall
  if (state === 'play'){
    ctx.strokeStyle = hsl(hue, 100, 82, .3); ctx.lineWidth = Math.max(2, FS * .012);
    ctx.beginPath();
    for (let z = PZ, k = 0; z < FAR * .7; z *= 1.2, k++){ const p = P(theta, R * .995, z); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
    ctx.stroke();
  }
  ctx.restore();
}

function drawGems(){
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const g of gems){
    if (g.z < NEAR + .1 || g.z > FAR) continue;
    const a = fogO(g.z); if (a < .03) continue;
    const p = P(g.a, SHIP_R, g.z), s = F / g.z * .06;
    const rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, s * 3);
    rg.addColorStop(0, hsl(hue + 40, 100, 80, .55 * a)); rg.addColorStop(1, hsl(hue + 40, 100, 60, 0));
    ctx.fillStyle = rg; ctx.fillRect(p.x - s * 3, p.y - s * 3, s * 6, s * 6);
    const w = Math.abs(Math.cos(g.spin)) * .7 + .3;
    ctx.fillStyle = hsl(hue + 40, 100, 88, a);
    ctx.beginPath(); ctx.moveTo(p.x, p.y - s * 1.3); ctx.lineTo(p.x + s * w, p.y); ctx.lineTo(p.x, p.y + s * 1.3); ctx.lineTo(p.x - s * w, p.y); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawObstacles(){
  const list = obs.slice().sort((a, b) => b.z - a.z);
  for (const o of list){
    const z1 = Math.max(o.z, NEAR), z2 = o.z + o.d;
    if (z2 <= NEAR || z1 > FAR + 1) continue;
    const a = fogO(z1);
    const off = obsOff(o);
    const s1 = F / z1;
    const fade = clamp((FAR + 1 - o.z) / 4, 0, 1) * a;
    const tti = (o.z - PZ) / Math.max(speed, 1);
    const warn = tti > 0 && tti < .55 ? (1 - tti / .55) : 0;
    // walls that have gone past the ship fade out fast so they never smother the view
    const passedA = o.z < PZ ? clamp((o.z - NEAR) / (PZ - NEAR), 0, 1) * (o.hit >= 0 ? .8 : .45) : 1;
    for (let bi = 0; bi < o.blocks.length; bi++){
      const b = o.blocks[bi];
      const a0 = b.a0 + off, a1 = a0 + b.w, n = Math.max(2, Math.ceil(b.w / .12));
      const hitB = o.hit === bi;
      // inner (top) face
      ctx.fillStyle = hsl(obsHue, 75, hitB ? 80 : 38, .85 * fade * passedA);
      ctx.beginPath();
      for (let k = 0; k <= n; k++){ const p = P(a0 + (a1 - a0) * k / n, RIN, z2); k ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y); }
      for (let k = n; k >= 0; k--){ const p = P(a0 + (a1 - a0) * k / n, RIN, z1); ctx.lineTo(p.x, p.y); }
      ctx.closePath(); ctx.fill();
      // side faces
      ctx.fillStyle = hsl(obsHue, 70, 30, .85 * fade * passedA);
      for (const ae of [a0, a1]){
        const q1 = P(ae, R, z1), q2 = P(ae, RIN, z1), q3 = P(ae, RIN, z2), q4 = P(ae, R, z2);
        ctx.beginPath(); ctx.moveTo(q1.x, q1.y); ctx.lineTo(q2.x, q2.y); ctx.lineTo(q3.x, q3.y); ctx.lineTo(q4.x, q4.y); ctx.closePath(); ctx.fill();
      }
      // front face
      const front = [];
      for (let k = 0; k <= n; k++) front.push(P(a0 + (a1 - a0) * k / n, R, z1));
      for (let k = n; k >= 0; k--) front.push(P(a0 + (a1 - a0) * k / n, RIN, z1));
      const c = centerAt(z1);
      const g = ctx.createRadialGradient(c.x, c.y, RIN * s1, c.x, c.y, R * s1);
      g.addColorStop(0, hsl(obsHue, 95, hitB ? 95 : 84, .97 * fade * passedA)); g.addColorStop(1, hsl(obsHue, 90, hitB ? 80 : 56, .95 * fade * passedA));
      ctx.fillStyle = g;
      ctx.beginPath(); front.forEach((p, i) => i ? ctx.lineTo(p.x, p.y) : ctx.moveTo(p.x, p.y)); ctx.closePath(); ctx.fill();
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.strokeStyle = hsl(obsHue, 100, 70, (.35 + warn * .3) * fade * passedA); ctx.lineWidth = Math.max(2, .07 * s1);
      ctx.stroke();
      ctx.strokeStyle = hsl(obsHue, 100, 94, fade * passedA); ctx.lineWidth = Math.max(1, (.018 + warn * .012) * s1);
      ctx.stroke();
      ctx.restore();
    }
  }
}

function drawShip(){
  if (state !== 'play') return;
  const sp = P(theta, SHIP_R, PZ), u = FS * .075;
  ctx.save();
  ctx.translate(sp.x, sp.y);
  ctx.rotate(clamp(-omega * .07, -.35, .35));
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  const ga = .5 + Math.min(combo, 8) * .04;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, u * 2.8);
  g.addColorStop(0, hsl(hue, 100, 70, ga)); g.addColorStop(1, hsl(hue, 100, 60, 0));
  ctx.fillStyle = g; ctx.fillRect(-u * 2.8, -u * 2.8, u * 5.6, u * 5.6);
  const fl = 1 + Math.sin(t * 40) * .2 + Math.random() * .15;
  ctx.fillStyle = hsl(hue - 20, 100, 72, .9);
  ctx.beginPath(); ctx.moveTo(-u * .35, u * .3); ctx.lineTo(0, u * (.3 + .9 * fl)); ctx.lineTo(u * .35, u * .3); ctx.closePath(); ctx.fill();
  ctx.restore();
  const hg = ctx.createLinearGradient(0, -u * 1.2, 0, u * .4);
  hg.addColorStop(0, '#ffffff'); hg.addColorStop(1, hsl(hue, 90, 75));
  ctx.fillStyle = hg;
  ctx.beginPath();
  ctx.moveTo(0, -u * 1.25); ctx.lineTo(u * 1.05, u * .4); ctx.lineTo(u * .3, u * .2); ctx.lineTo(0, u * .42); ctx.lineTo(-u * .3, u * .2); ctx.lineTo(-u * 1.05, u * .4); ctx.closePath();
  ctx.fill();
  ctx.strokeStyle = hsl(hue, 100, 50); ctx.lineWidth = Math.max(1.5, u * .08); ctx.stroke();
  ctx.fillStyle = hsl(hue + 180, 100, 68);
  ctx.beginPath(); ctx.ellipse(0, -u * .35, u * .16, u * .32, 0, 0, TAU); ctx.fill();
  // wing-tip lights
  ctx.fillStyle = '#ffffff';
  const blink = Math.sin(t * 10) > 0 ? 1 : .4;
  ctx.globalAlpha = blink;
  ctx.beginPath(); ctx.arc(-u * 1.0, u * .36, u * .09, 0, TAU); ctx.arc(u * 1.0, u * .36, u * .09, 0, TAU); ctx.fill();
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawOver(){

  text('Walls ' + rings + '   ·   Gems ' + gemCount + '   ·   Top combo x' + bestCombo, W / 2, y0 + ph * .65, clamp(M * .03, 12, 16), hsl(obsHue, 100, 85), null, 'center', 600);
  if (newBest){
    const s = 1 + Math.sin(t * 6) * .05;
    ctx.save(); ctx.translate(W / 2, y0 + ph * .76); ctx.scale(s, s);
    text('NEW BEST!', 0, 0, clamp(M * .045, 16, 24), '#ffe066', '#ffd23f'); ctx.restore();
  }
  if (overTimer > .7){
    ctx.globalAlpha = a * (.55 + .45 * Math.sin(t * 4));
    text('Tap / press Space to restart', W / 2, y0 + ph * .9, clamp(M * .04, 15, 22), '#ffffff', hsl(hue, 100, 60));
  }
  ctx.globalAlpha = 1;
}
function drawPaused(){
  ctx.fillStyle = 'rgba(2,4,18,.6)'; ctx.fillRect(0, 0, W, H);
  text('PAUSED', W / 2, H * .45, clamp(M * .1, 30, 64), '#ffffff', hsl(hue, 100, 60));
  text('Tap / press Space to resume', W / 2, H * .45 + clamp(M * .1, 40, 70), clamp(M * .04, 15, 22), hsl(hue, 100, 85), null, 'center', 600);
}

function render(){
  const sx = shake > 0 ? (Math.random() * 2 - 1) * shake : 0, sy = shake > 0 ? (Math.random() * 2 - 1) * shake : 0;
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  drawTunnel();
  drawGems();
  drawObstacles();
  drawShip();
  ctx.save(); ctx.globalCompositeOperation = 'lighter';
  for (const p of parts){ ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  ctx.restore(); ctx.globalAlpha = 1;
  const vg = ctx.createRadialGradient(W / 2, H / 2, M * .35, W / 2, H / 2, Math.max(W, H) * .75);
  vg.addColorStop(0, 'rgba(0,0,10,0)'); vg.addColorStop(1, 'rgba(0,0,10,.5)');
  ctx.fillStyle = vg; ctx.fillRect(-30, -30, W + 60, H + 60);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (flash > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (flash * .6).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'dying') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) drawPaused();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > .05) dt = .05;
  if (!paused) update(dt);
  render();
}
resize();
requestAnimationFrame(t0 => { last = t0; frame(t0); });
})();
</script>
<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>
<script id="blizMusicScript">
/* BlizMusic: original background music, generated live with Web Audio.
   Every song is composed in code (chords + melody + drums), so there is no copyrighted audio. */
(function(){
  if(window.BlizMusic) return;

  var SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10] };
  // prog = scale degrees (0-based) of each bar's chord; mel = melody contour seed
  var THEMES = {
    chill:   { name:'Snowfall Lounge', bpm:88,  root:60, scale:'major',  prog:[0,4,5,3], drums:'soft',   arp:'up',     lead:'triangle', pad:.5,  swing:.12 },
    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };
  function pickTheme(){
    var t = (document.title || '').toLowerCase();
    if(/sled/.test(t)) return 'snow';
    if(/frost|gem/.test(t)) return 'puzzle';
    if(/tunnel\s*2/.test(t)) return 'neon';
    if(/tunnel|road/.test(t)) return 'drive';
    if(/hollow/.test(t)) return 'mystery';
    return 'chill';
  }

  var store = {
    get:function(k,d){ try{ var v = localStorage.getItem('blizzard_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('blizzard_'+k, JSON.stringify(v)); }catch(e){} }
  };

  var ctx = null, master, comp, delay, delayGain, noiseBuf;
  var on = store.get('music', true), playing = false, timer = null;
  var theme = THEMES[pickTheme()], themeKey = pickTheme();
  var step = 0, nextTime = 0, melody = [], seed = 1;

  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function note(deg, oct){
    var sc = SCALES[theme.scale], n = sc.length;
    var o = Math.floor(deg / n); deg = ((deg % n) + n) % n;
    return theme.root + sc[deg] + 12 * (o + (oct || 0));
  }

  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0;
    delay = ctx.createDelay(1); delayGain = ctx.createGain(); delayGain.gain.value = .28;
    var fb = ctx.createGain(); fb.gain.value = .32;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delayGain); delayGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return true;
  }

  // Compose a 2-bar motif per chord so the tune repeats and is catchy, not random noise
  function compose(){
    seed = 0; for(var i=0;i<themeKey.length;i++) seed = (seed * 31 + themeKey.charCodeAt(i)) % 2147483647; seed = seed || 7;
    melody = [];
    var pos = 4;
    for(var bar=0; bar<8; bar++){
      var chord = theme.prog[bar % 4], row = [];
      for(var s=0; s<16; s++){
        var strong = s % 4 === 0;
        if(rand() < (strong ? .82 : .32)){
          var tones = [chord, chord+2, chord+4];
          if(strong) pos = tones[(rand()*3)|0] + 7;
          else pos += [-1,1,-2,2,0][(rand()*5)|0];
          pos = Math.max(4, Math.min(14, pos));
          row.push(pos);
        }else row.push(null);
      }
      melody.push(row);
    }
    for(var r=4;r<8;r++) melody[r] = melody[r-4].map(function(v, s){ return (s > 11 && v !== null) ? v + (r === 7 ? -1 : 1) : v; });
  }

  function tone(type, freq, t, dur, vol, dest, attack, cutoff){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    var a = attack || .008;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if(cutoff){ var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(dest || master);
    o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function noise(t, dur, vol, hp){
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }

  function playStep(s, t){
    var bar = Math.floor(s / 16), st = s % 16, chord = theme.prog[bar % 4];
    var sixteenth = 60 / theme.bpm / 4;
    // pad: soft chord at start of each bar
    if(st === 0 && theme.pad){
      [chord, chord+2, chord+4].forEach(function(d){
        tone('triangle', mtof(note(d, -1)), t, sixteenth*16, .045*theme.pad, null, .25, 1400);
      });
    }
    // bass
    var bassHits = theme.drums === 'drive' ? [0,3,6,8,11,14] : [0,8,10];
    if(bassHits.indexOf(st) >= 0) tone('triangle', mtof(note(chord, -2)), t, sixteenth*2.6, .16, null, .01, 700);
    // arpeggio
    var tones = [chord, chord+2, chord+4, chord+7];
    var arpVol = .05, d;
    if(theme.arp === 'up' && st % 2 === 0) d = tones[(st/2) % 4];
    else if(theme.arp === 'updown') d = [0,1,2,3,2,1,0,1][(st % 8)] !== undefined ? tones[[0,1,2,3,2,1,0,1][st % 8]] : null;
    else if(theme.arp === 'pluck' && (st % 4 === 2 || st % 4 === 3)) d = tones[(st >> 1) % 4];
    else if(theme.arp === 'box' && st % 4 === 0) { d = tones[(st/4) % 4] + 7; arpVol = .07; }
    if(d !== undefined && d !== null){
      var g = tone(theme.arp === 'box' ? 'sine' : 'square', mtof(note(d, 0)), t, sixteenth * (theme.arp === 'box' ? 6 : 1.4), arpVol, null, .005, theme.arp === 'box' ? 0 : 2200);
      g.connect(delay);
    }
    // melody
    var m = melody[bar % 8][st];
    if(m !== null && m !== undefined){
      var len = 1; while(st + len < 16 && melody[bar % 8][st + len] === null && len < 4) len++;
      var lg = tone(theme.lead, mtof(note(m, 0)), t, sixteenth * len * 1.1, theme.lead === 'sawtooth' || theme.lead === 'square' ? .045 : .09, null, .01, theme.lead === 'sine' ? 0 : 3000);
      lg.connect(delay);
    }
    // drums
    var dr = theme.drums;
    if(dr === 'drive'){
      if(st % 4 === 0) kick(t, .5);
      if(st === 4 || st === 12) noise(t, .14, .22, 1500);
      if(st % 2 === 1) noise(t, .04, .07, 7000);
    }else if(dr === 'bounce'){
      if(st === 0 || st === 7 || st === 10) kick(t, .4);
      if(st === 4 || st === 12) noise(t, .1, .14, 2000);
      if(st % 2 === 0) noise(t, .03, .05, 8000);
    }else if(dr === 'soft'){
      if(st === 0 || st === 10) kick(t, .3);
      if(st === 4 || st === 12) noise(t, .08, .08, 3000);
      if(st % 4 === 2) noise(t, .03, .04, 8000);
    }else if(dr === 'tick'){
      if(st % 4 === 0) noise(t, .025, .05, 6000);
      if(st === 0) kick(t, .18);
    }
  }

  function schedule(){
    var sixteenth = 60 / theme.bpm / 4;
    while(nextTime < ctx.currentTime + .15){
      var swing = (step % 2 === 1) ? sixteenth * theme.swing : 0;
      playStep(step, nextTime + swing);
      nextTime += sixteenth; step++;
    }
  }
  function start(){
    if(!on || playing || document.hidden || !init()) return;
    if(ctx.state === 'suspended') ctx.resume();
    compose();
    playing = true; step = 0; nextTime = ctx.currentTime + .08;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 1.2);
    timer = setInterval(schedule, 40); schedule();
  }
  function stop(){
    if(!playing) return;
    playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .25);
  }

  /* ---------- button ---------- */
  var btn = document.createElement('button');
  btn.id = 'blizMusicBtn'; btn.type = 'button';
  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
