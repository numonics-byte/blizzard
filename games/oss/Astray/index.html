<html>

    <head>
<title>Astray</title>
<meta charset="utf-8">
    
        <script src='Box2dWeb.min.js'></script>
        <script src="Three.js"></script>
        <script src="keyboard.js"></script>
        <script src="jquery.js"></script>
        <script src="maze.js"></script>

        <script>

            var camera         = undefined, 
                scene          = undefined, 
                renderer       = undefined, 
                light          = undefined,
                mouseX         = undefined, 
                mouseY         = undefined,
                maze           = undefined, 
                mazeMesh       = undefined,
                mazeDimension  = 11,
                planeMesh      = undefined,
                ballMesh       = undefined,
                ballRadius     = 0.25,
                keyAxis        = [0, 0],
                ironTexture    = THREE.ImageUtils.loadTexture('/ball.png'),
                planeTexture   = THREE.ImageUtils.loadTexture('/concrete.png'),
                brickTexture   = THREE.ImageUtils.loadTexture('/brick.png'),
                gameState      = undefined,

            // Box2D shortcuts
                b2World        = Box2D.Dynamics.b2World,
                b2FixtureDef   = Box2D.Dynamics.b2FixtureDef,
                b2BodyDef      = Box2D.Dynamics.b2BodyDef,
                b2Body		   = Box2D.Dynamics.b2Body,
                b2CircleShape  = Box2D.Collision.Shapes.b2CircleShape,
                b2PolygonShape = Box2D.Collision.Shapes.b2PolygonShape,
                b2Settings     = Box2D.Common.b2Settings,
                b2Vec2         = Box2D.Common.Math.b2Vec2,

            // Box2D world variables 
                wWorld         = undefined,
                wBall          = undefined;

            
            function createPhysicsWorld() {
                // Create the world object.
                wWorld = new b2World(new b2Vec2(0, 0), true);

                // Create the ball.
                var bodyDef = new b2BodyDef();
                bodyDef.type = b2Body.b2_dynamicBody;
                bodyDef.position.Set(1, 1);
                wBall = wWorld.CreateBody(bodyDef);
                var fixDef = new b2FixtureDef();
                fixDef.density = 1.0;
                fixDef.friction = 0.0;
                fixDef.restitution = 0.25;
                fixDef.shape = new b2CircleShape(ballRadius);
                wBall.CreateFixture(fixDef);

                // Create the maze.
                bodyDef.type = b2Body.b2_staticBody;
                fixDef.shape = new b2PolygonShape();
                fixDef.shape.SetAsBox(0.5, 0.5);
                for (var i = 0; i < maze.dimension; i++) {
                    for (var j = 0; j < maze.dimension; j++) {
                        if (maze[i][j]) {
                            bodyDef.position.x = i;
                            bodyDef.position.y = j;
                            wWorld.CreateBody(bodyDef).CreateFixture(fixDef);
                        }
                    }
                }
            }
            
            
            function generate_maze_mesh(field) {
                var dummy = new THREE.Geometry();
                for (var i = 0; i < field.dimension; i++) {
                    for (var j = 0; j < field.dimension; j++) {
                        if (field[i][j]) {
                            var geometry = new THREE.CubeGeometry(1,1,1,1,1,1);
                            var mesh_ij = new THREE.Mesh(geometry);
                            mesh_ij.position.x = i;
                            mesh_ij.position.y = j;
                            mesh_ij.position.z = 0.5;
                            THREE.GeometryUtils.merge(dummy, mesh_ij);
                        }
                    }
                }
                var material = new THREE.MeshPhongMaterial({map: brickTexture});
                var mesh = new THREE.Mesh(dummy, material)
                return mesh;
            }


            function createRenderWorld() {

                // Create the scene object.
                scene = new THREE.Scene();

                // Add the light.
                light= new THREE.PointLight(0xffffff, 1);
                light.position.set(1, 1, 1.3);
                scene.add(light);
                
                // Add the ball.
                g = new THREE.SphereGeometry(ballRadius, 32, 16);
                m = new THREE.MeshPhongMaterial({map:ironTexture});
                ballMesh = new THREE.Mesh(g, m);
                ballMesh.position.set(1, 1, ballRadius);
                scene.add(ballMesh);

                // Add the camera.
                var aspect = window.innerWidth/window.innerHeight;
                camera = new THREE.PerspectiveCamera(60, aspect, 1, 1000);
                camera.position.set(1, 1, 5);
                scene.add(camera);

                // Add the maze.
                mazeMesh = generate_maze_mesh(maze);
                scene.add(mazeMesh);

                // Add the ground.
                g = new THREE.PlaneGeometry(mazeDimension*10, mazeDimension*10, mazeDimension, mazeDimension);
                planeTexture.wrapS = planeTexture.wrapT = THREE.RepeatWrapping;
                planeTexture.repeat.set(mazeDimension*5, mazeDimension*5);
                m = new THREE.MeshPhongMaterial({map:planeTexture});
                planeMesh = new THREE.Mesh(g, m);
                planeMesh.position.set((mazeDimension-1)/2, (mazeDimension-1)/2, 0);
                planeMesh.rotation.set(Math.PI/2, 0, 0);
                scene.add(planeMesh);                

            }


            function updatePhysicsWorld() {

                // Apply "friction". 
                var lv = wBall.GetLinearVelocity();
                lv.Multiply(0.95);
                wBall.SetLinearVelocity(lv);
                
                // Apply user-directed force.
                var f = new b2Vec2(keyAxis[0]*wBall.GetMass()*0.25, keyAxis[1]*wBall.GetMass()*0.25);
                wBall.ApplyImpulse(f, wBall.GetPosition());          
                keyAxis = [0,0];

                // Take a time step.
                wWorld.Step(1/60, 8, 3);
            }
            

            function updateRenderWorld() {

                // Update ball position.
                var stepX = wBall.GetPosition().x - ballMesh.position.x;
                var stepY = wBall.GetPosition().y - ballMesh.position.y;
                ballMesh.position.x += stepX;
                ballMesh.position.y += stepY;

                // Update ball rotation.
                var tempMat = new THREE.Matrix4();
                tempMat.makeRotationAxis(new THREE.Vector3(0,1,0), stepX/ballRadius);
                tempMat.multiplySelf(ballMesh.matrix);
                ballMesh.matrix = tempMat;
                tempMat = new THREE.Matrix4();
                tempMat.makeRotationAxis(new THREE.Vector3(1,0,0), -stepY/ballRadius);
                tempMat.multiplySelf(ballMesh.matrix);
                ballMesh.matrix = tempMat;
                ballMesh.rotation.getRotationFromMatrix(ballMesh.matrix);
                
                // Update camera and light positions.
                camera.position.x += (ballMesh.position.x - camera.position.x) * 0.1;
                camera.position.y += (ballMesh.position.y - camera.position.y) * 0.1;
                camera.position.z += (5 - camera.position.z) * 0.1;
                light.position.x = camera.position.x;
                light.position.y = camera.position.y;
                light.position.z = camera.position.z - 3.7;
            }


            function gameLoop() {
            
                switch(gameState) {
                
                    case 'initialize':
                        maze = generateSquareMaze(mazeDimension);
                        maze[mazeDimension-1][mazeDimension-2] = false;
                        createPhysicsWorld();
                        createRenderWorld();
                        camera.position.set(1, 1, 5);
                        light.position.set(1, 1, 1.3);
                        light.intensity = 0;
                        var level = Math.floor((mazeDimension-1)/2 - 4);
                        $('#level').html('Level ' + level);
                        gameState = 'fade in';
                        break;
                        
                    case 'fade in':
                        light.intensity += 0.1 * (1.0 - light.intensity);
                        renderer.render(scene, camera);
                        if (Math.abs(light.intensity - 1.0) < 0.05) {
                            light.intensity = 1.0;
                            gameState = 'play'
                        }
                        break;

                    case 'play':
                        updatePhysicsWorld();
                        updateRenderWorld();
                        renderer.render(scene, camera);

                        // Check for victory.
                        var mazeX = Math.floor(ballMesh.position.x + 0.5);
                        var mazeY = Math.floor(ballMesh.position.y + 0.5);
                        if (mazeX == mazeDimension && mazeY == mazeDimension - 2) { 
                            mazeDimension += 2;
                            gameState = 'fade out';
                        }
                        break;
                
                    case 'fade out':
                        updatePhysicsWorld();
                        updateRenderWorld();
                        light.intensity += 0.1 * (0.0 - light.intensity);
                        renderer.render(scene, camera);
                        if (Math.abs(light.intensity - 0.0) < 0.1) {
                            light.intensity = 0.0;
                            renderer.render(scene, camera);
                            gameState = 'initialize'
                        }
                        break;
                        
                }
            
                requestAnimationFrame(gameLoop);

            }


            function onResize() {
                renderer.setSize(window.innerWidth, window.innerHeight);
                camera.aspect = window.innerWidth/window.innerHeight;
                camera.updateProjectionMatrix();
            }
            

            function onMoveKey(axis) {
                keyAxis = axis.slice(0);
            }

            
            jQuery.fn.centerv = function () {
                wh = window.innerHeight;
                h = this.outerHeight();
                this.css("position", "absolute");
                this.css("top", Math.max(0, (wh - h)/2) + "px");
                return this;
            }            

            
            jQuery.fn.centerh = function () {
                ww = window.innerWidth;
                w = this.outerWidth();
                this.css("position", "absolute");
                this.css("left", Math.max(0, (ww - w)/2) + "px");
                return this;
            }            

            
            jQuery.fn.center = function () {
                this.centerv();
                this.centerh();
                return this;
            }            

            
            $(document).ready(function() {

                // Prepare the instructions.
                $('#instructions').center();
                $('#instructions').hide();
                KeyboardJS.bind.key('i', function(){$('#instructions').show()}, 
                                         function(){$('#instructions').hide()});
    
                // Create the renderer.
                renderer = new THREE.WebGLRenderer();
                renderer.setSize(window.innerWidth, window.innerHeight);
                document.body.appendChild(renderer.domElement);

                // Bind keyboard and resize events.
                KeyboardJS.bind.axis('left', 'right', 'down', 'up', onMoveKey);
                KeyboardJS.bind.axis('h', 'l', 'j', 'k', onMoveKey);
                $(window).resize(onResize);
                

                // Set the initial game state.
                gameState = 'initialize';
                
                // Start the game loop.
                requestAnimationFrame(gameLoop);

            })
            
            

        </script>
    
        <style>
        
            body {
                background: black;
                margin: 0;
                padding: 0;
                font-family: 'Helvetica';
            }
            
            #instructions {
                background-color: rgba(0,0,0,0.75);
                color: white;
                text-align: center;
                padding: 32px;
                margin: 0px;
                display: inline;
                border: 2px solid white;
            }

            #help {
                position: absolute;
                left: 0px;
                bottom: 0px;
                padding: 4px;
                color: white;   
            }

            #level {
                position: absolute;
                left: 0px;
                top: 0px;
                padding: 4px;
                color: yellow;   
                font-weight: bold;
            }

        </style>

    <script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../../../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>
<script id="blizMusicScript">
/* BlizMusic: original background music, generated live with Web Audio.
   Every song is composed in code (chords + melody + drums), so there is no copyrighted audio. */
(function(){
  if(window.BlizMusic) return;

  var SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10] };
  // prog = scale degrees (0-based) of each bar's chord; mel = melody contour seed
  var THEMES = {
    chill:   { name:'Snowfall Lounge', bpm:88,  root:60, scale:'major',  prog:[0,4,5,3], drums:'soft',   arp:'up',     lead:'triangle', pad:.5,  swing:.12 },
    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };
  function pickTheme(){
    var t = (document.title || '').toLowerCase();
    if(/sled/.test(t)) return 'snow';
    if(/frost|gem/.test(t)) return 'puzzle';
    if(/tunnel\s*2/.test(t)) return 'neon';
    if(/tunnel|road/.test(t)) return 'drive';
    if(/hollow/.test(t)) return 'mystery';
    return 'chill';
  }

  var store = {
    get:function(k,d){ try{ var v = localStorage.getItem('blizzard_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('blizzard_'+k, JSON.stringify(v)); }catch(e){} }
  };

  var ctx = null, master, comp, delay, delayGain, noiseBuf;
  var on = store.get('music', true), playing = false, timer = null;
  var theme = THEMES[pickTheme()], themeKey = pickTheme();
  var step = 0, nextTime = 0, melody = [], seed = 1;

  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function note(deg, oct){
    var sc = SCALES[theme.scale], n = sc.length;
    var o = Math.floor(deg / n); deg = ((deg % n) + n) % n;
    return theme.root + sc[deg] + 12 * (o + (oct || 0));
  }

  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0;
    delay = ctx.createDelay(1); delayGain = ctx.createGain(); delayGain.gain.value = .28;
    var fb = ctx.createGain(); fb.gain.value = .32;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delayGain); delayGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return true;
  }

  // Compose a 2-bar motif per chord so the tune repeats and is catchy, not random noise
  function compose(){
    seed = 0; for(var i=0;i<themeKey.length;i++) seed = (seed * 31 + themeKey.charCodeAt(i)) % 2147483647; seed = seed || 7;
    melody = [];
    var pos = 4;
    for(var bar=0; bar<8; bar++){
      var chord = theme.prog[bar % 4], row = [];
      for(var s=0; s<16; s++){
        var strong = s % 4 === 0;
        if(rand() < (strong ? .82 : .32)){
          var tones = [chord, chord+2, chord+4];
          if(strong) pos = tones[(rand()*3)|0] + 7;
          else pos += [-1,1,-2,2,0][(rand()*5)|0];
          pos = Math.max(4, Math.min(14, pos));
          row.push(pos);
        }else row.push(null);
      }
      melody.push(row);
    }
    for(var r=4;r<8;r++) melody[r] = melody[r-4].map(function(v, s){ return (s > 11 && v !== null) ? v + (r === 7 ? -1 : 1) : v; });
  }

  function tone(type, freq, t, dur, vol, dest, attack, cutoff){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    var a = attack || .008;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if(cutoff){ var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(dest || master);
    o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function noise(t, dur, vol, hp){
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }

  function playStep(s, t){
    var bar = Math.floor(s / 16), st = s % 16, chord = theme.prog[bar % 4];
    var sixteenth = 60 / theme.bpm / 4;
    // pad: soft chord at start of each bar
    if(st === 0 && theme.pad){
      [chord, chord+2, chord+4].forEach(function(d){
        tone('triangle', mtof(note(d, -1)), t, sixteenth*16, .045*theme.pad, null, .25, 1400);
      });
    }
    // bass
    var bassHits = theme.drums === 'drive' ? [0,3,6,8,11,14] : [0,8,10];
    if(bassHits.indexOf(st) >= 0) tone('triangle', mtof(note(chord, -2)), t, sixteenth*2.6, .16, null, .01, 700);
    // arpeggio
    var tones = [chord, chord+2, chord+4, chord+7];
    var arpVol = .05, d;
    if(theme.arp === 'up' && st % 2 === 0) d = tones[(st/2) % 4];
    else if(theme.arp === 'updown') d = [0,1,2,3,2,1,0,1][(st % 8)] !== undefined ? tones[[0,1,2,3,2,1,0,1][st % 8]] : null;
    else if(theme.arp === 'pluck' && (st % 4 === 2 || st % 4 === 3)) d = tones[(st >> 1) % 4];
    else if(theme.arp === 'box' && st % 4 === 0) { d = tones[(st/4) % 4] + 7; arpVol = .07; }
    if(d !== undefined && d !== null){
      var g = tone(theme.arp === 'box' ? 'sine' : 'square', mtof(note(d, 0)), t, sixteenth * (theme.arp === 'box' ? 6 : 1.4), arpVol, null, .005, theme.arp === 'box' ? 0 : 2200);
      g.connect(delay);
    }
    // melody
    var m = melody[bar % 8][st];
    if(m !== null && m !== undefined){
      var len = 1; while(st + len < 16 && melody[bar % 8][st + len] === null && len < 4) len++;
      var lg = tone(theme.lead, mtof(note(m, 0)), t, sixteenth * len * 1.1, theme.lead === 'sawtooth' || theme.lead === 'square' ? .045 : .09, null, .01, theme.lead === 'sine' ? 0 : 3000);
      lg.connect(delay);
    }
    // drums
    var dr = theme.drums;
    if(dr === 'drive'){
      if(st % 4 === 0) kick(t, .5);
      if(st === 4 || st === 12) noise(t, .14, .22, 1500);
      if(st % 2 === 1) noise(t, .04, .07, 7000);
    }else if(dr === 'bounce'){
      if(st === 0 || st === 7 || st === 10) kick(t, .4);
      if(st === 4 || st === 12) noise(t, .1, .14, 2000);
      if(st % 2 === 0) noise(t, .03, .05, 8000);
    }else if(dr === 'soft'){
      if(st === 0 || st === 10) kick(t, .3);
      if(st === 4 || st === 12) noise(t, .08, .08, 3000);
      if(st % 4 === 2) noise(t, .03, .04, 8000);
    }else if(dr === 'tick'){
      if(st % 4 === 0) noise(t, .025, .05, 6000);
      if(st === 0) kick(t, .18);
    }
  }

  function schedule(){
    var sixteenth = 60 / theme.bpm / 4;
    while(nextTime < ctx.currentTime + .15){
      var swing = (step % 2 === 1) ? sixteenth * theme.swing : 0;
      playStep(step, nextTime + swing);
      nextTime += sixteenth; step++;
    }
  }
  function start(){
    if(!on || playing || document.hidden || !init()) return;
    if(ctx.state === 'suspended') ctx.resume();
    compose();
    playing = true; step = 0; nextTime = ctx.currentTime + .08;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 1.2);
    timer = setInterval(schedule, 40); schedule();
  }
  function stop(){
    if(!playing) return;
    playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .25);
  }

  /* ---------- button ---------- */
  var btn = document.createElement('button');
  btn.id = 'blizMusicBtn'; btn.type = 'button';
  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
<script id="blizTouchScript">window.BLIZ_TOUCH={"dpad": "arrows", "vw": "device"};
/* Blizzard touch controls: on-screen buttons for keyboard-only games, shown only on touchscreens.
   Each game sets window.BLIZ_TOUCH = { dpad:'arrows'|'wasd', left:[...], right:[...], aim:true } before this runs.
   Buttons send the same key presses a keyboard would, so the game works unchanged. */
(function(){
  var cfg = window.BLIZ_TOUCH;
  if(!cfg) return;
  var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
  if(!touch) return;

  var K = {
    up:{key:'ArrowUp',code:'ArrowUp',keyCode:38}, down:{key:'ArrowDown',code:'ArrowDown',keyCode:40},
    left:{key:'ArrowLeft',code:'ArrowLeft',keyCode:37}, right:{key:'ArrowRight',code:'ArrowRight',keyCode:39},
    w:{key:'w',code:'KeyW',keyCode:87}, a:{key:'a',code:'KeyA',keyCode:65}, s:{key:'s',code:'KeyS',keyCode:83}, d:{key:'d',code:'KeyD',keyCode:68},
    q:{key:'q',code:'KeyQ',keyCode:81}, z:{key:'z',code:'KeyZ',keyCode:90}, x:{key:'x',code:'KeyX',keyCode:88}, c:{key:'c',code:'KeyC',keyCode:67},
    space:{key:' ',code:'Space',keyCode:32}, enter:{key:'Enter',code:'Enter',keyCode:13}, one:{key:'1',code:'Digit1',keyCode:49},
    p:{key:'p',code:'KeyP',keyCode:80}
  };
  function target(){ return document.querySelector('canvas') || document.body; }
  function key(type, k){
    var e = new KeyboardEvent(type, { key:k.key, code:k.code, bubbles:true, cancelable:true });
    try{
      Object.defineProperty(e, 'keyCode', { get:function(){ return k.keyCode; } });
      Object.defineProperty(e, 'which', { get:function(){ return k.keyCode; } });
    }catch(_){}
    target().dispatchEvent(e);
  }

  var css = document.createElement('style');
  css.textContent =
    '.bz-pad{position:fixed;bottom:18px;z-index:2147483640;display:flex;gap:10px;touch-action:none;user-select:none;-webkit-user-select:none}' +
    '.bz-pad.l{left:16px}.bz-pad.r{right:16px;flex-direction:column-reverse;align-items:flex-end}' +
    '.bz-pad.v{flex-direction:column}' +
    '.bz-b{width:64px;height:64px;border-radius:50%;border:2px solid rgba(255,255,255,.55);background:rgba(10,14,30,.45);color:#fff;' +
      'font:700 15px system-ui,sans-serif;display:grid;place-items:center;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);touch-action:none}' +
    '.bz-b.on{background:rgba(0,229,255,.55);border-color:#fff;transform:scale(.94)}' +
    '.bz-b.wide{width:auto;min-width:76px;padding:0 14px;border-radius:32px}' +
    '.bz-dpad{position:relative;width:184px;height:184px}' +
    '.bz-dpad .bz-b{position:absolute}' +
    '.bz-dpad .u{left:60px;top:0}.bz-dpad .dn{left:60px;bottom:0}.bz-dpad .lf{left:0;top:60px}.bz-dpad .rt{right:0;top:60px}' +
    '@media (max-height:500px){.bz-b{width:54px;height:54px}.bz-dpad{width:156px;height:156px}.bz-dpad .u,.bz-dpad .dn{left:51px}.bz-dpad .lf,.bz-dpad .rt{top:51px}}';
  document.head.appendChild(css);

  // one button = one key, held while your finger is down (works with several fingers at once)
  function button(k, label, extra){
    var b = document.createElement('div');
    b.className = 'bz-b' + (extra ? ' ' + extra : '');
    b.textContent = label;
    var held = 0;
    function down(e){ e.preventDefault(); e.stopPropagation(); held++; if(held === 1){ b.classList.add('on'); key('keydown', K[k]); } }
    function up(e){ if(e) { e.preventDefault(); e.stopPropagation(); } if(!held) return; held = 0; b.classList.remove('on'); key('keyup', K[k]); }
    b.addEventListener('touchstart', down, { passive:false });
    b.addEventListener('touchend', up, { passive:false });
    b.addEventListener('touchcancel', up, { passive:false });
    b.addEventListener('mousedown', down); b.addEventListener('mouseup', up); b.addEventListener('mouseleave', function(){ up(); });
    return b;
  }
  // Tell the phone how wide the game is so it shrinks the whole game to fit the screen
  if(cfg.vw){
    var vm = document.querySelector('meta[name=viewport]');
    if(!vm){ vm = document.createElement('meta'); vm.name = 'viewport'; document.head.appendChild(vm); }
    vm.content = cfg.vw === 'device' ? 'width=device-width,initial-scale=1,user-scalable=no' : 'width=' + cfg.vw + ',user-scalable=no';
  }
  if(cfg.hide || cfg.css){ var hs = document.createElement('style'); hs.textContent = (cfg.hide ? cfg.hide + '{display:none!important}' : '') + (cfg.css || ''); document.head.appendChild(hs); }
  // ...then scale the buttons (and the exit bar) back up so they stay a comfortable size for fingers
  function rescale(){
    var vv = window.visualViewport, real = vv ? vv.width * vv.scale : window.innerWidth;
    var k = Math.max(1, Math.min(3, document.documentElement.clientWidth / (real || 1)));
    document.querySelectorAll('.bz-pad.l').forEach(function(p){ p.style.transform = 'scale(' + k + ')'; p.style.transformOrigin = 'bottom left'; });
    document.querySelectorAll('.bz-pad.r').forEach(function(p){ p.style.transform = 'scale(' + k + ')'; p.style.transformOrigin = 'bottom right'; });
    var ex = document.getElementById('blizExit'); if(ex){ ex.style.transform = 'scale(' + k + ')'; ex.style.transformOrigin = 'top left'; }
  }
  addEventListener('resize', rescale);
  if(window.visualViewport) visualViewport.addEventListener('resize', rescale);

  function mount(){
    setTimeout(rescale, 50); setTimeout(rescale, 600);
    var dirs = cfg.dpad === 'wasd' ? ['w','s','a','d'] : ['up','down','left','right'];
    if(cfg.dpad){
      var pad = document.createElement('div'); pad.className = 'bz-pad l';
      var dp = document.createElement('div'); dp.className = 'bz-dpad';
      dp.appendChild(button(dirs[0], '▲', 'u')); dp.appendChild(button(dirs[1], '▼', 'dn'));
      dp.appendChild(button(dirs[2], '◀', 'lf')); dp.appendChild(button(dirs[3], '▶', 'rt'));
      pad.appendChild(dp); document.body.appendChild(pad);
    }else if(cfg.left){
      var l = document.createElement('div'); l.className = 'bz-pad l' + (cfg.leftVertical ? ' v' : '');
      cfg.left.forEach(function(x){ l.appendChild(button(x.k, x.l, x.l.length > 2 ? 'wide' : '')); });
      document.body.appendChild(l);
    }
    if(cfg.right && cfg.right.length){
      var r = document.createElement('div'); r.className = 'bz-pad r';
      cfg.right.forEach(function(x){ r.appendChild(button(x.k, x.l, x.l.length > 2 ? 'wide' : '')); });
      document.body.appendChild(r);
    }
    // touch the game itself to aim and shoot (turned into mouse movement + clicks)
    if(cfg.aim){
      var mouse = function(type, t){
        target().dispatchEvent(new MouseEvent(type, { clientX:t.clientX, clientY:t.clientY, screenX:t.screenX, screenY:t.screenY, button:0, buttons:type === 'mouseup' ? 0 : 1, bubbles:true, cancelable:true }));
      };
      var onPad = function(el){ return el && el.closest && el.closest('.bz-pad, #blizExit, #blizMusicBtn'); };
      var aimId = null;
      document.addEventListener('touchstart', function(e){
        for(var i = 0; i < e.changedTouches.length; i++){
          var t = e.changedTouches[i];
          if(aimId === null && !onPad(t.target)){ aimId = t.identifier; mouse('mousemove', t); mouse('mousedown', t); e.preventDefault(); }
        }
      }, { passive:false });
      document.addEventListener('touchmove', function(e){
        for(var i = 0; i < e.changedTouches.length; i++){ var t = e.changedTouches[i]; if(t.identifier === aimId){ mouse('mousemove', t); e.preventDefault(); } }
      }, { passive:false });
      var end = function(e){
        for(var i = 0; i < e.changedTouches.length; i++){ var t = e.changedTouches[i]; if(t.identifier === aimId){ mouse('mouseup', t); mouse('click', t); aimId = null; } }
      };
      document.addEventListener('touchend', end, { passive:false });
      document.addEventListener('touchcancel', end, { passive:false });
    }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);
})();
</script>
