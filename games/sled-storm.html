<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Sled Storm 3D</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050816;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(140,230,255,.55);background:rgba(10,20,45,.55);color:#c8f6ff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0;touch-action:none;
  box-shadow:0 0 14px rgba(80,200,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mute svg{width:22px;height:22px;pointer-events:none}
.hidden{display:none!important}
#shopBtn{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;height:46px;padding:0 22px;
  border-radius:999px;border:2px solid rgba(255,224,102,.9);background:rgba(40,16,70,.82);color:#fff6c8;font:800 16px system-ui,-apple-system,sans-serif;
  cursor:pointer;touch-action:manipulation;box-shadow:0 0 18px rgba(255,95,210,.45);white-space:nowrap}
#shopBtn:active{transform:translateX(-50%) scale(.96)}
#shop{position:fixed;inset:0;z-index:8;display:flex;align-items:center;justify-content:center;background:rgba(4,8,30,.82);padding:16px;touch-action:none}
#shop .box{width:100%;max-width:440px;background:rgba(10,16,48,.96);border:2px solid rgba(127,249,255,.55);border-radius:22px;padding:16px 16px 14px;
  color:#eaffff;font:600 15px system-ui,-apple-system,sans-serif;text-align:center;box-shadow:0 0 30px rgba(46,242,255,.3)}
#shop h2{margin:2px 0 4px;font-size:26px;letter-spacing:.04em;color:#fff;text-shadow:0 0 12px #2ef2ff}
#shop .bank{color:#ffe066;margin-bottom:10px}
#shop .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
#shop .sw{border-radius:14px;border:2px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);color:#fff;padding:8px 4px 7px;cursor:pointer;
  font:700 12px system-ui,-apple-system,sans-serif;touch-action:manipulation}
#shop .sw.on{border-color:#7ff9ff;background:rgba(127,249,255,.16);box-shadow:0 0 12px rgba(127,249,255,.45)}
#shop .sw.lock{opacity:.75}
#shop .sw.poor{opacity:.45}
#shop .chip{height:30px;border-radius:9px;margin:0 auto 6px;width:78%;position:relative;overflow:hidden}
#shop .price{display:block;color:#ffe066;margin-top:2px}
#shop .close{height:44px;padding:0 30px;border-radius:999px;border:0;background:linear-gradient(#7ff9ff,#2ec4ff);color:#04122a;font:800 16px system-ui,sans-serif;cursor:pointer;touch-action:manipulation}
#shop .note{font-size:12px;color:#bff6ff;opacity:.8;margin-top:8px}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<button id="mute" aria-label="Toggle sound"></button>
<button id="shopBtn" class="hidden" type="button">Sled Shop</button>
<div id="shop" class="hidden"><div class="box">
  <h2>SLED SHOP</h2>
  <div class="bank" id="shopBank"></div>
  <div class="grid" id="shopGrid"></div>
  <button class="close" id="shopClose" type="button">Done</button>
  <div class="note">Colors are just for looks. Spend gifts you collect on runs and from missions.</div>
</div></div>
<script>
(function(){
'use strict';

/* ---------- canvas & view ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let F = 600, HOR = 200, CAMH = 2, BASEF = 600;
const FAR = 70, PZ = 4, PHW = 0.38;

function setupView(){
  BASEF = Math.min(H * 0.72, W * 0.85);
  HOR = H * 0.36;
  applyFov(0);
}
// wider field of view at speed (and on near-miss / jump kicks) = a stronger sense of rushing downhill
function applyFov(k){
  F = BASEF * (1 - k);
  CAMH = (H * 0.84 - HOR) * PZ / F;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  setupView();
  initFlakes();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const smooth = x => x * x * (3 - 2 * x);
function hex(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function mix(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c, a){ return 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + (a === undefined ? 1 : a) + ')'; }
function project(x, y, z){ const s = F / z; return { x: W / 2 + (x - camX) * s, y: HOR + (CAMH - y) * s, s: s }; }
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

/* ---------- storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('blizzard_' + k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('blizzard_' + k, String(v)); } catch(e){} }
};
let best = parseInt(store.get('sledstorm_best', '0'), 10) || 0;
let muted = store.get('muted', '0') === '1';
let bank = parseInt(store.get('sledstorm_giftbank', '0'), 10) || 0;          // gifts saved up for sled colors
let owned = (store.get('sledstorm_colors', 'violet') || 'violet').split(',');
let sledId = store.get('sledstorm_color', 'violet');
let missionsDone = (store.get('sledstorm_missionsv2', '') || '').split(',').filter(id => /^[a-z0-9]+$/.test(id));

/* ---------- missions (shown on the title screen, rewards are gifts for the shop) ---------- */
const MISSIONS = [
  { id: 'surv60',  text: 'Survive 60 seconds',          goal: 60,   stat: 'time',    reward: 40 },
  { id: 'gift30',  text: 'Collect 30 gifts in one run', goal: 30,   stat: 'gifts',   reward: 50 },
  { id: 'jump3',   text: 'Hit 3 ramps in a row',        goal: 3,    stat: 'jumpRow', reward: 40 },
  { id: 'close10', text: '10 close shaves in one run',  goal: 10,   stat: 'closes',  reward: 40 },
  { id: 'bridge2', text: 'Cross 2 ice bridges',         goal: 2,    stat: 'bridges', reward: 50 },
  { id: 'aval1',   text: 'Outrun an avalanche',         goal: 1,    stat: 'avals',   reward: 60 },
  { id: 'combo15', text: 'Reach a x15 combo',           goal: 15,   stat: 'combo',   reward: 60 },
  { id: 'score5k', text: 'Score 5,000 in one run',      goal: 5000, stat: 'score',   reward: 70 },
  { id: 'surv120', text: 'Survive 2 minutes',           goal: 120,  stat: 'time',    reward: 80 },
  { id: 'gift60',  text: 'Collect 60 gifts in one run', goal: 60,   stat: 'gifts',   reward: 100 }
];
const activeMissions = () => MISSIONS.filter(m => missionsDone.indexOf(m.id) < 0).slice(0, 5);

/* ---------- sled colors (cosmetic only) ---------- */
const SLEDS = [
  { id: 'violet', name: 'Violet',     price: 0,   a: '#b06bff', b: '#5a2fd0', s: '#ff4fa3' },
  { id: 'cherry', name: 'Cherry',     price: 30,  a: '#ff8a9c', b: '#c2253f', s: '#ffe066' },
  { id: 'mint',   name: 'Mint',       price: 60,  a: '#8dffd2', b: '#12a47a', s: '#2ef2ff' },
  { id: 'sunny',  name: 'Sunny',      price: 100, a: '#ffe36b', b: '#e0900f', s: '#ff4fa3' },
  { id: 'ocean',  name: 'Ocean',      price: 150, a: '#6bd0ff', b: '#1560c9', s: '#ffffff' },
  { id: 'candy',  name: 'Candy Cane', price: 220, a: '#ffffff', b: '#ff3b5c', s: '#ff3b5c', stripes: true },
  { id: 'night',  name: 'Midnight',   price: 300, a: '#6a7bff', b: '#141a5e', s: '#7ff9ff' },
  { id: 'gold',   name: 'Golden',     price: 450, a: '#fff2a8', b: '#c8920f', s: '#ffffff' },
  { id: 'aurora', name: 'Aurora',     price: 650, a: '#7ff9ff', b: '#8a5cff', s: '#ffe066', rainbow: true }
];
function sledDef(){ return SLEDS.find(s => s.id === sledId && owned.indexOf(s.id) >= 0) || SLEDS[0]; }

/* ---------- audio (bright, soft: sine/triangle only) ---------- */
let AC = null, master = null;
function ensureAudio(){
  try {
    if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.45;
    master.connect(AC.destination);
  } catch(e){ AC = null; }
}
function tone(freq, dur, type, vol, slide, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function noise(dur, vol, freq){
  if (!AC || muted) return;
  try {
    const n = Math.floor(AC.sampleRate * dur);
    const b = AC.createBuffer(1, n, AC.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 800;
    const g = AC.createGain(); g.gain.value = vol || 0.15;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  } catch(e){}
}
// C-major pentatonic ladder for rising combo chimes
const LADDER = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.66, 1318.5, 1568];
const sfx = {
  start(){ [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, .18, 'triangle', .15, 0, i * .08)); },
  gift(n){ const f = LADDER[Math.min(n, LADDER.length - 1)]; tone(f, .12, 'triangle', .14); tone(f * 1.5, .2, 'sine', .1, 0, .07); },
  close(n){ const f = LADDER[Math.min(n, LADDER.length - 1)]; tone(f, .1, 'sine', .11); tone(f * 1.25, .12, 'sine', .06, 0, .04); },
  jump(){ tone(392, .28, 'triangle', .12, 784); tone(587.33, .2, 'sine', .06, 1174, .05); noise(.18, .05, 1800); },
  land(){ tone(220, .14, 'sine', .16, 165); noise(.16, .1, 600); },
  over(){ tone(659.25, .14, 'triangle', .1); tone(987.77, .18, 'triangle', .08, 0, .06); },
  crash(){ noise(.45, .2, 650); tone(523.25, .22, 'triangle', .13, 0, 0); tone(392, .24, 'triangle', .12, 0, .12); tone(261.63, .45, 'sine', .14, 0, .24); },
  mile(){ [783.99, 987.77, 1174.66].forEach((f, i) => tone(f, .16, 'triangle', .1, 0, i * .07)); },
  best(){ [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .18, 'triangle', .13, 0, i * .09)); },
  whoosh(){ noise(.16, .05, 2600); },
  mission(){ [659.25, 783.99, 987.77, 1318.5].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .09)); tone(1567.98, .4, 'sine', .07, 0, .36); },
  tier(){ [783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, .14, 'sine', .1, 0, i * .05)); },
  rumble(){ noise(1.4, .12, 220); tone(110, 1.2, 'sine', .08, 82); },
  outran(){ [523.25, 659.25, 783.99, 1046.5, 1318.5, 1567.98].forEach((f, i) => tone(f, .2, 'triangle', .12, 0, i * .08)); },
  bridge(){ tone(1046.5, .12, 'sine', .07); tone(1318.5, .16, 'sine', .05, 0, .06); },
  buy(){ [783.99, 987.77, 1174.66, 1567.98].forEach((f, i) => tone(f, .15, 'triangle', .11, 0, i * .06)); },
  nope(){ tone(392, .12, 'sine', .08); tone(349.23, .16, 'sine', .07, 0, .08); }
};

/* ---------- mute button ---------- */
const muteBtn = document.getElementById('mute');
const SVG_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SVG_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
function refreshMute(){ muteBtn.innerHTML = muted ? SVG_OFF : SVG_ON; }
function toggleMute(){
  ensureAudio();
  muted = !muted;
  store.set('muted', muted ? '1' : '0');
  try { if (master) master.gain.value = muted ? 0 : 0.45; } catch(e){}
  refreshMute();
  if (!muted) tone(660, .08, 'sine', .15);
}
muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleMute(); });
muteBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
refreshMute();

/* ---------- sled shop (DOM overlay) ---------- */
const shopEl = document.getElementById('shop'), shopBtn = document.getElementById('shopBtn');
const shopOpen = () => !shopEl.classList.contains('hidden');
function refreshShopBtn(){
  const show = (state === 'title' || state === 'over') && !shopOpen();
  shopBtn.classList.toggle('hidden', !show);
  shopBtn.textContent = 'Sled Shop  ·  ' + bank + ' gifts';
}
function chipStyle(sd){
  if (sd.rainbow) return 'background:linear-gradient(90deg,#ff5f9e,#ffd23f,#59ffb0,#2ef2ff,#8a5cff)';
  if (sd.stripes) return 'background:repeating-linear-gradient(115deg,#ffffff 0 9px,#ff3b5c 9px 18px)';
  return 'background:linear-gradient(' + sd.a + ',' + sd.b + ');box-shadow:inset 0 -5px 0 ' + sd.s;
}
function renderShop(){
  document.getElementById('shopBank').textContent = 'You have ' + bank + ' gifts';
  const grid = document.getElementById('shopGrid');
  grid.innerHTML = '';
  for (const sd of SLEDS){
    const have = owned.indexOf(sd.id) >= 0, on = sledDef().id === sd.id;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw' + (on ? ' on' : '') + (have ? '' : ' lock') + (!have && bank < sd.price ? ' poor' : '');
    b.innerHTML = '<div class="chip" style="' + chipStyle(sd) + '"></div>' + sd.name +
      '<span class="price">' + (on ? 'Riding' : have ? 'Tap to ride' : sd.price + ' gifts') + '</span>';
    b.addEventListener('click', () => {
      if (have){ sledId = sd.id; store.set('sledstorm_color', sledId); sfx.bridge(); }
      else if (bank >= sd.price){
        bank -= sd.price; owned.push(sd.id); sledId = sd.id;
        store.set('sledstorm_giftbank', bank); store.set('sledstorm_colors', owned.join(',')); store.set('sledstorm_color', sledId);
        sfx.buy();
      } else sfx.nope();
      renderShop();
    });
    grid.appendChild(b);
  }
}
function openShop(){ ensureAudio(); renderShop(); shopEl.classList.remove('hidden'); refreshShopBtn(); }
function closeShop(){ shopEl.classList.add('hidden'); refreshShopBtn(); }
shopBtn.addEventListener('click', e => { e.stopPropagation(); openShop(); });
shopBtn.addEventListener('pointerdown', e => e.stopPropagation());
document.getElementById('shopClose').addEventListener('click', e => { e.stopPropagation(); closeShop(); });
shopEl.addEventListener('pointerdown', e => { e.stopPropagation(); if (e.target === shopEl) closeShop(); });

/* ---------- input ---------- */
const keys = {};
const pointers = new Map();
window.addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(c) >= 0) e.preventDefault();
  ensureAudio();
  keys[c] = true;
  if (e.repeat) return;
  if (shopOpen()){ if (c === 'Escape' || c === 'Enter' || c === 'Space') closeShop(); return; }
  if (c === 'KeyS' && (state === 'title' || state === 'over')){ openShop(); return; }
  if (c === 'Space' || c === 'Enter') primaryAction();
  else if (c === 'KeyP' || c === 'Escape') togglePause();
  else if (c === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  // a tap that starts/restarts the run should not also steer
  const steer = state === 'play' && !paused;
  pointers.set(e.pointerId, { x: e.clientX, live: steer });
  primaryAction();
});
cv.addEventListener('pointermove', e => { const p = pointers.get(e.pointerId); if (p) p.x = e.clientX; });
const endPtr = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('lostpointercapture', endPtr);
document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

function steerInput(){
  let d = 0;
  if (keys.ArrowLeft || keys.KeyA) d -= 1;
  if (keys.ArrowRight || keys.KeyD) d += 1;
  let l = false, r = false;
  pointers.forEach(p => { if (!p.live) return; if (p.x < W / 2) l = true; else r = true; });
  if (l) d -= 1;
  if (r) d += 1;
  return clamp(d, -1, 1);
}

/* ---------- game state ---------- */
let state = 'title', paused = false, t = 0;
let px = 0, pvx = 0, py = 0, pvy = 0, camX = 0, speed = 14, dist = 0, score = 0, elapsed = 0, airTime = 0;
let objs = [], parts = [], pops = [], flakes = [], sparkles = [], streaks = [], chunks = [];
let shake = 0, flash = 0, overTimer = 0, dyingTimer = 0, spawnAcc = 0, newBest = false, gifts = 0, tilt = 0, roll = 0;
let combo = 0, comboT = 0, bestCombo = 0, closes = 0, nextMile = 1000, scorePulse = 0, camBob = 0;
let pathX = 0, pathV = 0, mode = 'scatter', modeRows = 0, landing = 0, zig = 1;
let env = null;
// set-piece / mission bookkeeping
let kick = 0, fovNow = 0, jumpRow = 0, jumpRowBest = 0, bridges = 0, avals = 0, onBridge = null, bridgeRun = 0;
let avalNext = 38, avalLeft = 0, avalK = 0, banner = null, runMissions = [], missionCheckT = 0, crashCause = '';
const COMBO_TIME = 2.4;
const AVAL_LEN = 12;

function primaryAction(){
  if (shopOpen()) return;
  if (paused){ paused = false; return; }
  if (state === 'title') startGame();
  else if (state === 'over' && overTimer > 0.7) startGame();
}
function togglePause(){ if (state === 'play' || state === 'dying') paused = !paused; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'dying')) paused = true;
  last = performance.now();
});
window.addEventListener('pagehide', () => { if (state === 'play') paused = true; });

function startGame(){
  state = 'play';
  pvx = 0; py = 0; pvy = 0;
  speed = 17; score = 0; elapsed = 0; airTime = 0; gifts = 0; newBest = false;
  combo = 0; comboT = 0; bestCombo = 0; closes = 0; nextMile = 1000;
  overTimer = 0; dyingTimer = 0;
  jumpRow = 0; jumpRowBest = 0; bridges = 0; avals = 0; onBridge = null; bridgeRun = 0;
  avalNext = 38; avalLeft = 0; avalK = 0; banner = null; runMissions = []; missionCheckT = 0; kick = 0; crashCause = '';
  objs = objs.filter(o => o.scenery);
  parts.length = 0; pops.length = 0; chunks.length = 0;
  pathX = px; pathV = 0; mode = 'gifts'; modeRows = 4; landing = 0;
  // first rows start a couple of seconds ahead, so nothing is ever on top of you at the start
  spawnAcc = 0;
  for (let z = 36; z < FAR; z += rowGap()) spawnRow(z);
  sfx.start();
  refreshShopBtn();
}
function showBanner(text, sub, color){ banner = { text: text, sub: sub || '', c: color || '#ffffff', life: 2.4 }; }

/* ---------- obstacles ---------- */
const diffNow = () => state === 'play' ? clamp(elapsed / 120, 0, 1) : 0.15;
const corridor = () => lerp(2.8, 1.55, diffNow());      // guaranteed clear half-width around the safe line
const rowGap = () => Math.max(5, speed * lerp(0.5, 0.3, diffNow()));
function hwOf(o){
  if (o.type === 'tree') return 0.66 * (0.9 + o.seed * 0.45);
  if (o.type === 'rock') return 0.72 * (0.85 + o.seed * 0.35);
  if (o.type === 'frost') return 0.7;
  return 0;
}
function heightOf(o){
  if (o.type === 'tree') return 3.3 * (0.9 + o.seed * 0.45);
  if (o.type === 'rock') return 0.95;
  return 1.35;
}
function add(type, x, z, ex){
  const o = { type: type, x: x, z: z, seed: Math.random() };
  if (ex) for (const k in ex) o[k] = ex[k];
  if (o.hw === undefined) o.hw = hwOf(o);
  objs.push(o);
  return o;
}
function pickObstacle(){
  const r = Math.random();
  return r < 0.45 ? 'tree' : r < 0.74 ? 'rock' : 'frost';
}
function pickMode(d){
  const e = state === 'play' ? elapsed : 0;
  const tbl = [['scatter', 3.4], ['gifts', 1.8], ['slalom', d < 0.12 ? 0 : 1.3 + d * 2], ['ramp', e < 8 ? 0 : 0.9 + d * 0.5],
    ['forest', d < 0.3 ? 0 : d * 2], ['tunnel', e < 10 ? 0 : 1.3], ['chain', e < 12 ? 0 : 1.1], ['bridge', e < 20 ? 0 : 1.0 + d * .6],
    ['ramps', e < 25 ? 0 : 0.7]];
  let tot = 0; for (const x of tbl) tot += x[1];
  let r = Math.random() * tot;
  for (const x of tbl){ r -= x[1]; if (r <= 0) return x[0]; }
  return 'scatter';
}
function spawnRow(z){
  const d = diffNow();
  const gap = rowGap();
  const lat = 7 + speed * 0.13;
  const maxStep = gap / Math.max(speed, 1) * lat * 0.5; // how far the safe line may drift per row
  const cw = corridor();
  const playing = state === 'play';

  if (modeRows <= 0){
    const prev = mode;
    mode = pickMode(d);
    if (mode === prev && (mode === 'bridge' || mode === 'tunnel' || mode === 'chain' || mode === 'ramps')) mode = 'scatter';
    if (avalLeft > 0 && (mode === 'gifts' || mode === 'scatter')) mode = Math.random() < .5 ? 'slalom' : 'forest';
    modeRows = mode === 'ramp' || mode === 'chain' ? 1 : mode === 'slalom' ? 6 + Math.floor(d * 4) : mode === 'forest' ? 5
      : mode === 'tunnel' ? 7 + Math.floor(Math.random() * 3) : mode === 'bridge' ? 6 + Math.floor(d * 3) : mode === 'ramps' ? 12
      : 4 + Math.floor(Math.random() * 3);
    zig = Math.random() < .5 ? -1 : 1;
    if (playing && mode === 'bridge') add('sign', pathX, z, { label: 'ICE BRIDGE', hw: 0 });
    if (playing && mode === 'tunnel') add('sign', pathX, z, { label: 'TREE TUNNEL', hw: 0 });
    if (mode === 'bridge'){ modeRows++; bridgeApproach = true; }   // one approach row first
  }
  modeRows--;

  // advance the safe line
  if (mode === 'slalom'){
    if (modeRows % 2 === 0) zig = -zig;
    pathV = zig * maxStep * 0.95;
  } else if (mode === 'tunnel'){
    pathV = zig * maxStep * 0.3 * Math.sin(modeRows * .9);
  } else if (mode === 'bridge'){
    pathV = 0;
  } else if (mode === 'ramp' || mode === 'chain' || mode === 'ramps' || landing > 0){
    pathV *= 0.3;
  } else {
    pathV = clamp(pathV + rand(-1, 1) * maxStep * 0.55 + (px - pathX) * 0.012, -maxStep, maxStep);
  }
  pathX += pathV;

  const lo = Math.min(px, pathX) - 13, hi = Math.max(px, pathX) + 13;
  const placed = [];
  const free = (x, hw, extra) => {
    if (Math.abs(x - pathX) < cw + hw + (extra || 0)) return false;
    for (const q of placed) if (Math.abs(q - x) < hw + 1.3) return false;
    return true;
  };
  const scatter = n => {
    for (let i = 0, tries = 0; i < n && tries < n * 6; tries++){
      const x = rand(lo, hi), type = pickObstacle();
      const probe = { type: type, seed: Math.random() };
      const hw = hwOf(probe);
      if (!free(x, hw, landing > 0 ? 3.5 : 0)) continue;
      add(type, x, z + rand(-0.6, 0.6), { seed: probe.seed });
      placed.push(x); i++;
    }
  };
  const rampWall = (rx, wz) => {
    for (let i = -3; i <= 3; i++){
      add(Math.random() < .5 ? 'rock' : 'frost', rx + i * 1.5 + rand(-.1, .1), wz + rand(-.2, .2));
      placed.push(rx + i * 1.5);
    }
  };
  let scenery = true;

  if (!playing && (mode === 'bridge' || mode === 'chain' || mode === 'ramps')) mode = 'scatter';

  if (mode === 'ramp' && playing){
    const rx = pathX;
    add('ramp', rx, z);
    const wz = z + 1.6 + speed * 0.32;
    rampWall(rx, wz);
    add('gift', rx, wz, { y: 2.2, big: true });
    landing = 3;
    scatter(Math.round(1 + d * 2));
  } else if (mode === 'chain'){
    // ramp launches you through an arc of gifts
    const rx = pathX;
    add('ramp', rx, z);
    const v = 10.5 + speed * 0.06, T = 2 * v / 26, n = 6;
    for (let i = 1; i <= n; i++){
      const tau = T * i / (n + 1);
      add('gift', rx, z + 0.9 + speed * tau, { y: Math.max(0.7, v * tau - 13 * tau * tau), chain: true });
    }
    landing = 4;
  } else if (mode === 'ramps'){
    // three ramps back to back (spaced so you land between them): chain the jumps
    if (modeRows % 4 === 3){
      add('ramp', pathX, z);
      add('gift', pathX, z + 0.9 + speed * 0.42, { y: 2.6 });
    } else add('gift', pathX, z);
    landing = 2;
  } else if (mode === 'bridge'){
    scenery = false;
    const hw = lerp(2.1, 1.4, d);
    if (bridgeApproach){ bridgeApproach = false; add('gift', pathX, z); }
    else {
      add('bridge', pathX, z, { hw: hw, len: gap + 1.1, first: !onBridgeSpawned, last: modeRows <= 0 });
      onBridgeSpawned = modeRows > 0;
      if (Math.random() < .55) add('gift', pathX + rand(-hw * .5, hw * .5), z + gap * .5);
    }
  } else if (mode === 'tunnel'){
    // trees packed tight on both sides of the safe line, gifts down the middle
    const tw = lerp(2.6, 2.1, d);
    for (const side of [-1, 1]){
      for (let k = 0; k < 2; k++){
        const seed = Math.random();
        const hw = hwOf({ type: 'tree', seed: seed });
        add('tree', pathX + side * (tw + hw + k * 2.1 + rand(0, .25)), z + rand(-.3, .3) + k * .5, { seed: seed, tunnel: true });
        placed.push(pathX + side * (tw + hw + k * 2.1));
      }
    }
    add('gift', pathX, z);
    scatter(Math.round(rand(0, 1.5)));
  } else if (mode === 'forest' || (mode === 'slalom' && modeRows % 2 === 0)){
    // a wall of trees with one opening on the safe line
    const step = mode === 'forest' ? 2.0 : 2.4;
    for (let x = Math.floor(lo / step) * step; x <= hi; x += step){
      const jx = x + rand(-.25, .25);
      const probe = { type: 'tree', seed: Math.random() };
      if (!free(jx, hwOf(probe), 0.15)) continue;
      add('tree', jx, z + rand(-.3, .3), { seed: probe.seed });
      placed.push(jx);
    }
    if (mode === 'slalom' && Math.random() < .55) add('gift', pathX, z);
  } else if (mode === 'gifts'){
    add('gift', pathX, z);
    scatter(Math.round(rand(1, 2 + d * 2)));
  } else {
    scatter(Math.round(rand(1.5, 3 + d * 3.5)));
    if (Math.random() < .12) add('gift', pathX, z);
  }
  if (mode !== 'bridge') onBridgeSpawned = false;
  if (landing > 0) landing--;

  // scenery trees off to the sides
  if (scenery){
    const side = Math.random() < .5 ? -1 : 1;
    add('tree', px + side * rand(15, 28), z + rand(0, 3), { scenery: true });
    if (Math.random() < .6) add('tree', px - side * rand(15, 28), z + rand(0, 3), { scenery: true });
  }
}
let onBridgeSpawned = false, bridgeApproach = false;

/* ---------- particles ---------- */
function burst(x, y, n, colors, spd, life, grav, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * .3, life: life * rand(.5, 1), max: life,
      r: size * rand(.5, 1.3), c: colors[(Math.random() * colors.length) | 0], g: grav });
  }
}
function pop(text, x, y, color, big){ pops.push({ text: text, x: x, y: y, life: big ? 1.6 : 1.0, c: color || '#fff', big: !!big }); }

function initFlakes(){

/* ---------- environment / sky ---------- */
const PH = [
  { top: hex('#2a74d0'), bot: hex('#c6e9ff'), snow: hex('#f6fbff'), shade: hex('#9fbde3'), mtn: hex('#7e9fd0'), night: 0 },
  { top: hex('#2b2268'), bot: hex('#ff9e85'), snow: hex('#ffe7ec'), shade: hex('#c395b8'), mtn: hex('#6c4f8f'), night: .25 },
  { top: hex('#02041a'), bot: hex('#1b2c66'), snow: hex('#8ea4d6'), shade: hex('#3d5290'), mtn: hex('#141f48'), night: 1 },
  { top: hex('#28398a'), bot: hex('#ffc0dc'), snow: hex('#f3e8f8'), shade: hex('#b1a1cf'), mtn: hex('#6d6aa8'), night: .3 }
];
function computeEnv(sc){
  const p = (sc / 1500) % 4, i = Math.floor(p), fr = p - i;
  const k = smooth(clamp((fr - .55) / .45, 0, 1));
  const A = PH[i], B = PH[(i + 1) % 4];
  const e = { top: mix(A.top, B.top, k), bot: mix(A.bot, B.bot, k), snow: mix(A.snow, B.snow, k),
    shade: mix(A.shade, B.shade, k), mtn: mix(A.mtn, B.mtn, k), night: A.night + (B.night - A.night) * k };
  const dark = hex('#16204a'), nk = e.night * .5;
  e.leaf1 = mix(hex('#0d3b44'), dark, nk); e.leaf2 = mix(hex('#1f6b62'), dark, nk);
  e.trunk = mix(hex('#5a3a2e'), dark, nk); e.cap = mix(hex('#ffffff'), e.snow, .5);
  e.rock = mix(hex('#3f4b68'), dark, nk); e.rockHi = mix(hex('#8a9bc0'), dark, nk);
  return e;
}
const stars = [];
for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random(), r: rand(.4, 1.6), ph: Math.random() * 6.28 });
const mtnSeed = [Math.random() * 10, Math.random() * 10, Math.random() * 10, Math.random() * 10];

/* ---------- update ---------- */
let last = performance.now();
function update(dt){
  t += dt;
  if (state === 'play'){
    elapsed += dt;
    updateAvalanche(dt);
    speed = (17 + 35 * (1 - Math.exp(-elapsed / 85))) * (1 + 0.22 * avalK);
  }
  else if (state === 'title') speed = 13;
  else speed = Math.max(0, speed - speed * 2.5 * dt - 3 * dt);
  // field-of-view kick: widens with speed, punches out on near misses / jumps / avalanches
  kick = Math.max(0, kick - kick * 2.2 * dt - .02 * dt);
  const fovTarget = (state === 'play' ? clamp((speed - 17) / 38, 0, 1) * 0.17 : 0) + Math.min(kick, .14) + avalK * .05;
  fovNow += (fovTarget - fovNow) * Math.min(1, (fovTarget > fovNow ? 9 : 3) * dt);
  applyFov(fovNow);
  if (banner){ banner.life -= dt; if (banner.life <= 0) banner = null; }
  if (state === 'play'){ missionCheckT -= dt; if (missionCheckT <= 0){ missionCheckT = .25; checkMissions(); } }

  const dz = speed * dt;
  dist += dz;
  if (state === 'play'){
    score += dz * 0.5;
    if (score >= nextMile){
      const p = project(px, 0, PZ);
      pop(nextMile.toLocaleString() + '!', W / 2, H * .3, '#ffe066', true);
      sfx.mile(); scorePulse = 1;
      burst(p.x, p.y - p.s, 20, ['#ffe066', '#ffffff', '#7ff3ff'], 260, .8, 150, 3);
      nextMile += 1000;
    }
  }

  // steering: snappy on the ground, a little looser in the air
  if (state === 'play'){
    const s = steerInput();
    const target = s * (7.5 + speed * 0.13);
    const resp = py > 0 ? 7 : (s !== 0 && Math.sign(s) !== Math.sign(pvx) ? 18 : 12);
    pvx += (target - pvx) * Math.min(1, resp * dt);
  } else if (state === 'title'){
    pvx = (Math.sin(t * .6) * 3.5 - px) * 1.2;
  } else pvx *= Math.pow(0.04, dt);
  px += pvx * dt;
  tilt += ((state === 'dying' || state === 'over' ? 0 : pvx * 0.035) - tilt) * Math.min(1, 10 * dt);
  roll += (clamp(-pvx * 0.004, -0.05, 0.05) - roll) * Math.min(1, 4 * dt);

  // vertical
  if (py > 0 || pvy > 0){
    pvy -= 26 * dt; py += pvy * dt; airTime += dt;
    if (py <= 0){ py = 0; pvy = 0; land(); }
  }
  camX += (px - camX) * Math.min(1, 7 * dt);
  camBob += (0 - camBob) * Math.min(1, 9 * dt);

  // combo timer
  if (combo > 0 && state === 'play'){
    comboT -= dt;
    if (comboT <= 0){ combo = 0; }
  }

  // objects
  for (let i = objs.length - 1; i >= 0; i--){
    const o = objs[i];
    const z0 = o.z;
    o.z -= dz;
    if (o.type === 'bridge'){
      if (state === 'play' && o.z <= PZ && o.z + o.len > PZ && !o.crossed){
        if (py <= 0.05 && Math.abs(px - o.x) > o.hw - PHW * .4){ crashCause = 'bridge'; crash(o); }
        if (onBridge !== o){ onBridge = o; if (o.first){ bridgeRun = 0; sfx.bridge(); } bridgeRun++; }
        if (o.last && o.z + o.len - PZ < dz * 1.5 && state === 'play'){
          o.crossed = true; bridges++;
          const p = project(px, py, PZ);
          const b = 150 + 25 * bridgeRun; score += b; scorePulse = 1;
          pop('BRIDGE +' + b, p.x, p.y - p.s * 1.6, '#bff6ff'); sfx.bridge(); kick += .05;
        }
      }
      if (o.z + o.len < 1.1) objs.splice(i, 1);
      continue;
    }
    if (state === 'play' && !o.done){
      const cz = o.type === 'ramp' ? o.z + 0.9 : o.z, cz0 = o.type === 'ramp' ? z0 + 0.9 : z0;
      if (cz0 >= PZ && cz < PZ) collide(o);
    }
    if (o.z < 1.1 || o.dead) objs.splice(i, 1);
  }
  spawnAcc += dz;
  const gap = rowGap();
  if (spawnAcc > gap){ spawnAcc -= gap; spawnRow(FAR + rand(0, 1)); }

  // sparkles on snow
  for (const s of sparkles){
    s.z -= dz;
    if (s.z < 1.5 || Math.abs(s.x - camX) > s.z * 1.2 + 4){ s.z = FAR * rand(.6, 1); s.x = camX + rand(-1, 1) * s.z * (W / F) * .6; }
  }

  // snow spray from runners
  if ((state === 'play' || state === 'title') && py <= 0){
    const p = project(px, 0, PZ);
    const amt = 0.6 + Math.abs(pvx) * 0.32 + speed * 0.035 + avalK;
    const n = Math.floor(amt) + (Math.random() < amt % 1 ? 1 : 0);
    for (let j = 0; j < n; j++){
      for (let k = -1; k <= 1; k += 2){
        parts.push({ x: p.x + k * .45 * p.s * .78, y: p.y - 2, vx: k * rand(20, 80) - pvx * 14, vy: rand(-120, -40) - speed * 2,
          life: rand(.3, .6), max: .6, r: rand(1.5, 3.5) * (p.s / 90), c: '#ffffff', g: 500 });
      }
    }
  }

  // speed streaks
  const sv = clamp((speed - 19) / 26, 0, 1) + kick * 4 + avalK * .6;
  if (state === 'play'){
    let n = sv * 60 * dt; // streaks per frame
    while (n > 0){
      if (Math.random() < n) streaks.push({ a: Math.random() * Math.PI * 2, r: rand(.2, .45), v: rand(1.8, 3), life: .5 });
      n -= 1;
    }
  }
  // avalanche: snow chunks blasting past from behind the camera
  if (state === 'play' && avalK > .05 && Math.random() < avalK * 0.9){
    chunks.push({ x: rand(-.2, 1.2) * W, y: H + 20, vx: rand(-60, 60), vy: -rand(500, 900), r: rand(4, 12) * (H / 800), life: 1.2 });
  }
  for (let i = chunks.length - 1; i >= 0; i--){
    const c = chunks[i]; c.life -= dt; c.x += (c.vx + (c.x - W / 2) * .8) * dt; c.y += c.vy * dt; c.vy *= Math.pow(.25, dt); c.r *= Math.pow(.45, dt);
    if (c.life <= 0 || c.y < HOR) chunks.splice(i, 1);
  }
  for (let i = streaks.length - 1; i >= 0; i--){
    const s = streaks[i]; s.r += s.v * s.r * dt * 2.2; s.life -= dt;
    if (s.life <= 0 || s.r > 1.4) streaks.splice(i, 1);
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.6, dt);
  }
  if (parts.length > 700) parts.splice(0, parts.length - 700);
  for (let i = pops.length - 1; i >= 0; i--){ const q = pops[i]; q.life -= dt; q.y -= (q.big ? 25 : 55) * dt; if (q.life <= 0) pops.splice(i, 1); }

  // falling snow
  const wind = -pvx * 6;
  for (const f of flakes){
    f.y += (25 + 70 * f.d + speed * 1.2 * f.d) * dt;
    f.x += (Math.sin(t * 1.3 + f.ph) * 12 * f.d + wind * f.d + (f.x - W / 2) * speed * 0.012 * f.d) * dt;
    if (f.y > H + 5 || f.x < -10 || f.x > W + 10){ f.y = rand(-20, H * .3); f.x = Math.random() * W; }
  }

  shake = Math.max(0, shake - 45 * dt);
  flash = Math.max(0, flash - 2.5 * dt);
  scorePulse = Math.max(0, scorePulse - 3 * dt);
  if (state === 'dying'){
    dyingTimer += dt;
    if (dyingTimer > 1.1) gameOver();
  }
  if (state === 'over') overTimer += dt;
}

const TIERS = { 5: 'NICE!', 10: 'SLICK!', 15: 'WILD!', 20: 'STORM MODE!', 30: 'LEGENDARY!' };
function bumpCombo(){
  combo++; comboT = COMBO_TIME;
  if (combo > bestCombo) bestCombo = combo;
  if (TIERS[combo]){
    pop(TIERS[combo] + '  x' + combo, W / 2, H * .38, '#ff9be3', true);
    sfx.tier(); kick += .07; scorePulse = 1;
  }
}
function collide(o){
  const dx = Math.abs(o.x - px);
  const p = project(px, py, PZ);
  if (o.type === 'sign') return;
  if (o.type === 'gift'){
    const gy = o.y || 0.7;
    if (dx < 1.1 && Math.abs(gy - py) < 1.3){
      o.dead = true; o.done = true;
      bumpCombo();
      const bonus = (o.big ? 150 : o.chain ? 70 : 50) + 25 * Math.min(combo, 10);
      score += bonus; gifts++; scorePulse = 1;
      sfx.gift(combo);
      burst(p.x, p.y - p.s * .6, 30, ['#ffe066', '#ff5fd2', '#7ff3ff', '#ffffff'], 280, .8, 200, 3.2);
      pop('+' + bonus, p.x, p.y - p.s * 1.5, '#ffe066');
    }
    return;
  }
  if (o.type === 'ramp'){
    o.done = true;
    if (dx < 1.6 && py < 0.4){
      pvy = 10.5 + speed * 0.06; py = 0.01; airTime = 0;
      sfx.jump();
      shake = Math.max(shake, 3); kick += .08;
      burst(p.x, p.y, 22, ['#bff6ff', '#ffffff'], 200, .5, 300, 2.5);
      jumpRow++; if (jumpRow > jumpRowBest) jumpRowBest = jumpRow;
      if (jumpRow >= 2) pop(jumpRow + ' JUMPS IN A ROW!', p.x, p.y - p.s * 2.2, '#ffe066');
    } else if (py < 0.4) jumpRow = 0;
    return;
  }
  o.done = true;
  if (o.scenery && dx > 3) return;
  const reach = o.hw + PHW, h = heightOf(o);
  if (dx < reach){
    if (py > h){
      bumpCombo();
      const b = 30 * Math.min(combo, 10); score += b;
      pop('OVER +' + b, p.x, p.y - p.s * 1.6, '#7ff3ff');
      sfx.over();
    } else crash(o);
  } else if (dx < reach + 0.85 && py < h){
    // near miss: reward skillful shaves
    bumpCombo(); closes++;
    const b = 15 * Math.min(combo, 10); score += b;
    const side = o.x < px ? -1 : 1;
    pop('CLOSE +' + b, p.x + side * p.s * .9, p.y - p.s * 1.2, '#ff9be3');
    sfx.close(combo); sfx.whoosh(); kick += .035;
    burst(p.x + side * p.s * .5, p.y - p.s * .3, 10, ['#ffffff', '#ff9be3', '#7ff3ff'], 160, .4, 200, 2.4);
  }
}
function land(){
  const p = project(px, 0, PZ);
  if (state === 'play'){
    if (airTime > 0.45){
      const b = Math.round(airTime * 80);
      score += b;
      pop('AIR +' + b, p.x, p.y - p.s * 1.7, '#7ff3ff');
    }
    sfx.land();
    shake = Math.max(shake, 5);
    camBob = 1;
  }

}
function crash(o){
  state = 'dying'; dyingTimer = 0;
  shake = 18; flash = 0.55;
  const p = project(px, py, PZ);

  burst(p.x, p.y - p.s * .4, 26, ['#8a5cff', '#2ef2ff', '#ff4fa3', '#ffe066'], 380, 1, 500, 3.5);
  if (o.type === 'frost') burst(p.x, p.y - p.s, 24, ['#9ff', '#e0ffff'], 300, .9, 300, 3);

function gameOver(){

}

/* ---------- avalanche set-piece: every so often the mountain lets go behind you ---------- */
function updateAvalanche(dt){
  if (avalLeft > 0){
    avalLeft -= dt;
    avalK = Math.min(1, avalK + dt * 1.5);
    shake = Math.max(shake, 1.2 + avalK * 1.2);
    if (avalLeft <= 0){
      avals++;
      const b = 500; score += b; scorePulse = 1; kick += .1;
      showBanner('YOU OUTRAN IT!', '+' + b, '#7ff9ff');
      sfx.outran();
      avalNext = rand(42, 55);
    }
  } else {
    avalK = Math.max(0, avalK - dt * .7);
    avalNext -= dt;
    if (avalNext <= 0 && state === 'play'){
      avalLeft = AVAL_LEN;
      showBanner('AVALANCHE!', 'Keep going and don\'t crash!', '#ffffff');
      sfx.rumble();
    }
  }
}

/* ---------- missions ---------- */
function statOf(m){
  switch (m.stat){
    case 'time': return elapsed;
    case 'gifts': return gifts;
    case 'jumpRow': return jumpRowBest;
    case 'closes': return closes;
    case 'bridges': return bridges;
    case 'avals': return avals;
    case 'combo': return bestCombo;
    case 'score': return Math.floor(score);
  }
  return 0;
}
function checkMissions(){
  if (state !== 'play' && state !== 'dying' && state !== 'over') return;
  for (const m of activeMissions()){
    if (statOf(m) >= m.goal){
      missionsDone.push(m.id); store.set('sledstorm_missionsv2', missionsDone.join(','));
      bank += m.reward; store.set('sledstorm_giftbank', bank);
      runMissions.push(m);
      if (state === 'play') showBanner('MISSION COMPLETE!', m.text + '  ·  +' + m.reward + ' gifts', '#ffe066');
      sfx.mission();
    }
  }
}

    ctx.restore();

// ice bridge: a glassy strip over a deep blue crevasse
function drawBridge(o){
  const z0 = Math.max(o.z, 1.2), z1 = Math.min(o.z + o.len, FAR);
  if (z1 <= z0) return;
  const a = fogAlpha(z0);
  const L0 = project(o.x - o.hw, 0, z0), R0 = project(o.x + o.hw, 0, z0);
  const L1 = project(o.x - o.hw, 0, z1), R1 = project(o.x + o.hw, 0, z1);
  const far0 = project(camX - 60, 0, z0), far1 = project(camX - 60, 0, z1);
  const farR0 = project(camX + 60, 0, z0), farR1 = project(camX + 60, 0, z1);
  ctx.globalAlpha = a;
  // crevasse on both sides
  const cg = ctx.createLinearGradient(0, L1.y, 0, L0.y);
  cg.addColorStop(0, 'rgba(20,40,110,.95)'); cg.addColorStop(1, 'rgba(8,16,60,.98)');
  ctx.fillStyle = cg;
  ctx.beginPath(); ctx.moveTo(far0.x, far0.y); ctx.lineTo(L0.x, L0.y); ctx.lineTo(L1.x, L1.y); ctx.lineTo(far1.x, far1.y); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(R0.x, R0.y); ctx.lineTo(farR0.x, farR0.y); ctx.lineTo(farR1.x, farR1.y); ctx.lineTo(R1.x, R1.y); ctx.closePath(); ctx.fill();
  // icy deck
  const dg = ctx.createLinearGradient(L0.x, 0, R0.x, 0);
  dg.addColorStop(0, '#9fe6ff'); dg.addColorStop(.5, '#e9fbff'); dg.addColorStop(1, '#9fe6ff');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.moveTo(L0.x, L0.y); ctx.lineTo(R0.x, R0.y); ctx.lineTo(R1.x, R1.y); ctx.lineTo(L1.x, L1.y); ctx.closePath(); ctx.fill();
  // cracks/planks across the deck
  ctx.strokeStyle = 'rgba(80,160,220,.45)'; ctx.lineWidth = Math.max(1, .03 * L0.s);
  ctx.beginPath(); ctx.moveTo(L0.x, L0.y); ctx.lineTo(R0.x, R0.y); ctx.stroke();
  // glowing rails
  ctx.save();
  ctx.shadowColor = '#2ef2ff'; ctx.shadowBlur = 10;
  ctx.strokeStyle = 'rgba(127,249,255,' + (.75 + .25 * Math.sin(t * 8 + o.z)).toFixed(2) + ')';
  ctx.lineWidth = Math.max(1.5, .09 * L0.s);
  ctx.beginPath(); ctx.moveTo(L0.x, L0.y); ctx.lineTo(L1.x, L1.y); ctx.moveTo(R0.x, R0.y); ctx.lineTo(R1.x, R1.y); ctx.stroke();
  ctx.restore();
  ctx.globalAlpha = 1;
}
// banner arch announcing a set-piece (purely decorative, you ride under it)
function drawSign(o){
  const hwid = 3.6;
  const lp = project(o.x - hwid, 0, o.z), rp = project(o.x + hwid, 0, o.z);
  const lt = project(o.x - hwid, 4.2, o.z), rt = project(o.x + hwid, 4.2, o.z);
  const s = lp.s;
  ctx.strokeStyle = '#5a3a2e'; ctx.lineWidth = Math.max(2, .16 * s);
  ctx.beginPath(); ctx.moveTo(lp.x, lp.y); ctx.lineTo(lt.x, lt.y); ctx.moveTo(rp.x, rp.y); ctx.lineTo(rt.x, rt.y); ctx.stroke();
  const bh = .9 * s;
  ctx.fillStyle = 'rgba(40,16,90,.92)';
  ctx.fillRect(lt.x, lt.y - bh * .2, rt.x - lt.x, bh);
  ctx.strokeStyle = '#7ff9ff'; ctx.lineWidth = Math.max(1, .05 * s);
  ctx.strokeRect(lt.x, lt.y - bh * .2, rt.x - lt.x, bh);
  if (bh > 6){
    ctx.font = '900 ' + Math.round(bh * .6) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillStyle = '#ffe066';
    ctx.fillText(o.label, (lt.x + rt.x) / 2, lt.y + bh * .3);
  }
}

function sledColors(sd){
  if (!sd.rainbow) return [sd.a, sd.b, sd.s];
  const h = (t * 60) % 360;
  return ['hsl(' + h + ',100%,75%)', 'hsl(' + ((h + 60) % 360) + ',90%,48%)', 'hsl(' + ((h + 180) % 360) + ',100%,70%)'];
}
// the sled deck (used by the rider and the shop preview)
function paintSled(g, s, sd){
  const c = sledColors(sd);
  const dg = g.createLinearGradient(0, -.4 * s, 0, 0);
  dg.addColorStop(0, c[0]); dg.addColorStop(1, sd.stripes ? '#dfeeff' : c[1]);
  g.fillStyle = dg;
  g.beginPath(); g.moveTo(-.56 * s, -.08 * s); g.lineTo(.56 * s, -.08 * s); g.lineTo(.4 * s, -.42 * s); g.lineTo(-.4 * s, -.42 * s); g.closePath(); g.fill();
  if (sd.stripes){
    g.save(); g.clip();
    g.fillStyle = c[1];
    for (let k = -4; k <= 4; k++){ g.beginPath(); g.moveTo(k * .2 * s, -.45 * s); g.lineTo(k * .2 * s + .09 * s, -.45 * s); g.lineTo(k * .2 * s - .06 * s, 0); g.lineTo(k * .2 * s - .15 * s, 0); g.closePath(); g.fill(); }
    g.restore();
  }
  g.fillStyle = c[2]; g.fillRect(-.56 * s, -.13 * s, 1.12 * s, .06 * s);
}

function drawWorld(){
  drawSky();
  drawGround();
  const bl = objs.filter(o => o.type === 'bridge' && o.z < FAR).sort((a, b) => b.z - a.z);
  for (const o of bl) drawBridge(o);
  const list = objs.filter(o => o.z < FAR + 2 && o.type !== 'bridge');
  list.push({ type: 'player', z: PZ });
  list.sort((a, b) => b.z - a.z);
  for (const o of list){
    if (o.type === 'player'){ drawPlayer(); continue; }
    const a = fogAlpha(o.z);
    if (a <= 0.01) continue;
    // obstacles between the camera and the rider fade so they never hide the sled
    ctx.globalAlpha = o.z < PZ ? a * clamp((o.z - 1.1) / (PZ - 1.1), .25, 1) : a;
    if (o.type === 'tree') drawTree(o);
    else if (o.type === 'rock') drawRock(o);
    else if (o.type === 'frost') drawFrost(o);
    else if (o.type === 'ramp') drawRamp(o);
    else if (o.type === 'gift') drawGift(o);
    else if (o.type === 'sign') drawSign(o);
    ctx.globalAlpha = 1;
  }
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
}
function drawOverlayFX(){
  // speed streaks radiating from the vanishing point
  if (streaks.length){
    const cx = W / 2, cy = HOR, R = Math.max(W, H);
    ctx.strokeStyle = 'rgba(255,255,255,.5)';
    ctx.lineCap = 'round';
    for (const s of streaks){
      const r0 = s.r * R, r1 = r0 * 1.25;
      ctx.globalAlpha = clamp(s.life * 2, 0, 1) * .6;
      ctx.lineWidth = 1 + s.r * 2;
      ctx.beginPath();
      ctx.moveTo(cx + Math.cos(s.a) * r0, cy + Math.sin(s.a) * r0 * .7);
      ctx.lineTo(cx + Math.cos(s.a) * r1, cy + Math.sin(s.a) * r1 * .7);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.fillStyle = env.night > .5 ? 'rgba(210,235,255,.85)' : 'rgba(255,255,255,.9)';
  for (const f of flakes){
    const r = .8 + f.d * 2.4;
    ctx.globalAlpha = .35 + f.d * .6;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
  }

    const k = avalK, base = H * (1.01 - .07 * k);

    ag.addColorStop(0, 'rgba(255,255,255,0)'); ag.addColorStop(.35, 'rgba(240,248,255,' + (.75 * k).toFixed(3) + ')'); ag.addColorStop(1, 'rgba(255,255,255,' + (.95 * k).toFixed(3) + ')');
    ctx.fillStyle = ag;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W + 20; x += 20){
      const y = base + Math.sin(x * .02 + t * 5) * 14 * k + Math.sin(x * .053 - t * 7) * 9 * k - Math.abs(Math.sin(x * .011 + t * 2)) * 30 * k;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.closePath(); ctx.fill();
    // puffs
    ctx.fillStyle = 'rgba(255,255,255,' + (.55 * k).toFixed(3) + ')';
    for (let i = 0; i < 9; i++){
      const x = ((i * 137 + t * 90) % (W + 120)) - 60, y = base + 18 + Math.sin(t * 3 + i) * 10;
      ctx.beginPath(); ctx.arc(x, y, (30 + 18 * Math.sin(t * 4 + i * 2)) * k * (H / 800), 0, 7); ctx.fill();
    }
    ctx.restore();
  }
  if (chunks.length){
    ctx.fillStyle = 'rgba(250,253,255,.95)';
    for (const c of chunks){ ctx.beginPath(); ctx.arc(c.x, c.y, Math.max(1, c.r), 0, 7); ctx.fill(); }
  }
  const sv = clamp((speed - 20) / 30, 0, 1);
  const vg = ctx.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(5,10,40,0)'); vg.addColorStop(1, 'rgba(5,10,40,' + (.22 + sv * .25 + env.night * .15).toFixed(3) + ')');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
}

/* ---------- drawing: UI ---------- */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function text(str, x, y, size, color, glow, align, weight){
  ctx.font = (weight || 800) + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = size * .5; }
  ctx.fillStyle = color;
  ctx.fillText(str, x, y);
  ctx.shadowBlur = 0;
}
function panel(x, y, w, h){
  ctx.fillStyle = 'rgba(6,12,36,.68)';
  ctx.strokeStyle = 'rgba(127,249,255,.5)';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, 18); else ctx.rect(x, y, w, h);
  ctx.fill(); ctx.stroke();
}
// HUD sits top-centre; on narrow screens it drops below the exit/music buttons (top-left, ~y 12-50)
function hudTop(){ return W / 2 - 110 < 350 ? 64 : 14; }
function drawHUD(){
  const m = Math.min(W, H);
  const sz = clamp(m * .085, 28, 50);
  const top = hudTop();
  const ps = 1 + scorePulse * .18;
  ctx.save(); ctx.translate(W / 2, top + sz * .55); ctx.scale(ps, ps);
  text(Math.floor(score).toLocaleString(), 0, 0, sz, '#ffffff', '#2ef2ff');
  ctx.restore();
  text('BEST ' + Math.max(best, Math.floor(score)).toLocaleString() + '   ·   ' + Math.round(speed * 4) + ' km/h',
    W / 2, top + sz * 1.3, clamp(sz * .34, 12, 16), 'rgba(225,250,255,.9)', 'rgba(0,30,80,.8)', 'center', 700);
  if (combo > 1){
    const cy = top + sz * 1.85, k = clamp(comboT / COMBO_TIME, 0, 1);
    text('COMBO x' + combo, W / 2, cy, clamp(sz * .42, 14, 20), '#ff9be3', '#ff3fb4', 'center', 900);
    const bw = 90;
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(W / 2 - bw / 2, cy + 12, bw, 4);
    ctx.fillStyle = '#ff9be3'; ctx.fillRect(W / 2 - bw / 2, cy + 12, bw * k, 4);
  }
  if (gifts){
    const gx = W - 18, gy = 74;
    text('x' + gifts, gx, gy + 1, 18, '#ffe066', '#ff3fb4', 'right');
    ctx.font = '800 18px ' + FONT;
    const tw = ctx.measureText('x' + gifts).width;
    const bx = gx - tw - 24;
    ctx.fillStyle = '#ff3fb4'; ctx.fillRect(bx, gy - 8, 16, 16);
    ctx.fillStyle = '#ffe066'; ctx.fillRect(bx + 6.5, gy - 8, 3, 16); ctx.fillRect(bx, gy - 1.5, 16, 3);
  }
  for (const q of pops){
    ctx.globalAlpha = clamp(q.life * 1.5, 0, 1);
    const sc = q.big ? 1 + Math.max(0, q.life - 1.2) * 1.5 : 1;
    text(q.text, q.x, q.y, (q.big ? clamp(m * .1, 30, 60) : clamp(m * .045, 15, 26)) * sc, q.c, q.c);
  }
  ctx.globalAlpha = 1;
  if (avalLeft > 0 && state === 'play'){
    const bw = Math.min(220, W * .5), by = top + sz * 2.45 + (combo > 1 ? 14 : 0);
    text('AVALANCHE  ' + Math.ceil(avalLeft) + 's', W / 2, by, clamp(sz * .36, 13, 17), '#ffffff', '#2e6cff', 'center', 900);
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(W / 2 - bw / 2, by + 11, bw, 5);
    ctx.fillStyle = '#ffffff'; ctx.fillRect(W / 2 - bw / 2, by + 11, bw * clamp(1 - avalLeft / AVAL_LEN, 0, 1), 5);
  }
  if (banner){
    const a = clamp(banner.life * 2, 0, 1), pz = 1 + Math.max(0, banner.life - 2.1) * 1.6;
    ctx.globalAlpha = a;
    ctx.save(); ctx.translate(W / 2, H * .47); ctx.scale(pz, pz);
    text(banner.text, 0, 0, clamp(m * .085, 26, 52), banner.c, '#ff3fb4');
    if (banner.sub) text(banner.sub, 0, clamp(m * .07, 26, 44), clamp(m * .04, 14, 20), '#ffffff', 'rgba(0,20,60,.9)', 'center', 700);
    ctx.restore();
    ctx.globalAlpha = 1;
  }
}
function drawTitle(){
  ctx.fillStyle = 'rgba(4,8,30,.45)'; ctx.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  const ts = clamp(Math.min(W * .13, H * .095), 34, 84);
  const cy = Math.max(H * .17, 78 + ts * .5);
  const wob = Math.sin(t * 2) * 3;
  text('SLED STORM', W / 2, cy + wob, ts, '#eaffff', '#2ef2ff');
  ctx.save();
  ctx.translate(W / 2 + ts * 2.55 > W - 10 ? W / 2 : W / 2 + ts * 2.2, cy + ts * .72 + wob);
  ctx.rotate(-.08);
  text('3D', 0, 0, ts * .55, '#ff5fd2', '#ff5fd2');
  ctx.restore();
  const fs = clamp(m * .036, 13, 18);
  let y = cy + ts * 1.25;
  text(isTouch ? 'Hold LEFT or RIGHT side to steer' : 'Steer with  ← →  or  A / D', W / 2, y, fs, '#ffffff', null, 'center', 700);
  y += fs * 1.5;
  text('Shave past things for COMBOS · grab gifts · hit ramps', W / 2, y, fs * .82, '#bff6ff', null, 'center', 500);

  // missions panel
  const act = activeMissions();
  const rowH = clamp(fs * 1.75, 24, 32);
  const pw = Math.min(W - 24, 470), ph = rowH * Math.max(1, act.length) + rowH * 1.35;
  const py0 = y + fs * 1.2;
  panel(W / 2 - pw / 2, py0, pw, ph);
  text('MISSIONS  ' + (MISSIONS.length - MISSIONS.filter(x => missionsDone.indexOf(x.id) < 0).length) + ' / ' + MISSIONS.length, W / 2, py0 + rowH * .62, fs * .95, '#ffe066', '#ff3fb4', 'center', 900);
  if (!act.length) text('All missions complete. You are a Sled Storm legend!', W / 2, py0 + rowH * 1.6, fs * .85, '#ffffff', null, 'center', 600);
  act.forEach((mi, i) => {
    const ry = py0 + rowH * (1.55 + i);
    const x0 = W / 2 - pw / 2 + 16;
    ctx.strokeStyle = 'rgba(127,249,255,.8)'; ctx.lineWidth = 2;
    ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x0, ry - 8, 16, 16, 4); else ctx.rect(x0, ry - 8, 16, 16); ctx.stroke();
    text(mi.text, x0 + 26, ry, fs * .86, '#ffffff', null, 'left', 600);
    text('+' + mi.reward, W / 2 + pw / 2 - 40, ry, fs * .86, '#ffe066', null, 'right', 800);
    drawMiniGift(W / 2 + pw / 2 - 26, ry, 12);
  });

  const blink = .55 + .45 * Math.sin(t * 4);
  ctx.globalAlpha = blink;
  const sy = Math.min(H - 110, py0 + ph + clamp(m * .07, 30, 50));
  text('Tap / press Space to start', W / 2, sy, clamp(m * .05, 18, 28), '#ffffff', '#2ef2ff');
  ctx.globalAlpha = 1;
  if (best > 0) text('BEST ' + best.toLocaleString(), W / 2, sy + clamp(m * .055, 24, 34), clamp(m * .035, 13, 18), '#bff6ff', null, 'center', 700);
}
function drawMiniGift(x, y, sz){
  ctx.fillStyle = '#ff3fb4'; ctx.fillRect(x - sz / 2, y - sz / 2, sz, sz);
  ctx.fillStyle = '#ffe066'; ctx.fillRect(x - sz * .1, y - sz / 2, sz * .2, sz); ctx.fillRect(x - sz / 2, y - sz * .1, sz, sz * .2);
}
function drawOver(){
  const a = clamp(overTimer * 3, 0, 1);
  ctx.fillStyle = 'rgba(4,8,30,' + (.55 * a).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = a;
  const m = Math.min(W, H);
  const extra = runMissions.length * 22;
  const pw = Math.min(W - 32, 420), ph = clamp(m * .66, 300, 380) + extra;
  const x0 = W / 2 - pw / 2, y0 = Math.max(64, Math.min(H / 2 - ph / 2, H - 80 - ph));
  panel(x0, y0, pw, ph);
  let y = y0 + 40;
  text(crashCause === 'bridge' ? 'OFF THE BRIDGE!' : 'WIPEOUT!', W / 2, y, clamp(m * .085, 28, 52), '#ffffff', '#ff4fa3');
  y += 44; text('SCORE', W / 2, y, 14, '#bff6ff', null, 'center', 700);
  y += 36; text(Math.floor(score).toLocaleString(), W / 2, y, clamp(m * .1, 34, 60), '#ffffff', '#2ef2ff');
  y += 42; text('BEST  ' + best.toLocaleString(), W / 2, y, clamp(m * .04, 15, 22), '#ffe066', null, 'center', 700);
  y += 30; text('Gifts ' + gifts + '  ·  Close shaves ' + closes + '  ·  Top combo x' + bestCombo, W / 2, y, clamp(m * .03, 12, 15), '#ff9be3', null, 'center', 600);
  y += 26; text('+' + gifts + ' gifts saved  ·  Bank: ' + bank, W / 2, y, clamp(m * .032, 12, 16), '#ffe066', null, 'center', 700);
  for (const mi of runMissions){ y += 22; text('✓ ' + mi.text + '  +' + mi.reward, W / 2, y, clamp(m * .03, 12, 15), '#7ff9ff', null, 'center', 700); }
  if (newBest){
    y += 28;
    const s = 1 + Math.sin(t * 6) * .05;
    ctx.save(); ctx.translate(W / 2, y); ctx.scale(s, s);
    text('NEW BEST!', 0, 0, clamp(m * .045, 16, 24), '#ffe066', '#ffd23f');
    ctx.restore();
  }
  if (overTimer > .7){
    ctx.globalAlpha = a * (.55 + .45 * Math.sin(t * 4));
    text('Tap / press Space to restart', W / 2, y0 + ph - 24, clamp(m * .04, 15, 22), '#ffffff', '#2ef2ff');
  }
  ctx.globalAlpha = 1;
}
function drawPaused(){
  ctx.fillStyle = 'rgba(4,8,30,.6)'; ctx.fillRect(0, 0, W, H);
  const m = Math.min(W, H);
  text('PAUSED', W / 2, H * .45, clamp(m * .1, 30, 64), '#ffffff', '#2ef2ff');
  text('Tap / press Space to resume', W / 2, H * .45 + clamp(m * .1, 40, 70), clamp(m * .04, 15, 22), '#bff6ff', null, 'center', 600);
}

function render(){
  env = computeEnv(state === 'title' ? t * 80 : score);
  const sx = shake > 0 ? (Math.random() * 2 - 1) * shake : 0;
  const sy = (shake > 0 ? (Math.random() * 2 - 1) * shake : 0) + camBob * 6;
  ctx.setTransform(DPR, 0, 0, DPR, sx * DPR, sy * DPR);
  // gentle camera roll into turns
  ctx.translate(W / 2, H * .8); ctx.rotate(roll); ctx.translate(-W / 2, -H * .8);
  drawWorld();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawOverlayFX();
  if (flash > 0){ ctx.fillStyle = 'rgba(255,255,255,' + (flash * .6).toFixed(3) + ')'; ctx.fillRect(0, 0, W, H); }
  if (state === 'play' || state === 'dying') drawHUD();
  if (state === 'title') drawTitle();
  if (state === 'over') drawOver();
  if (paused) drawPaused();
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;
  if (!(dt > 0)) dt = 0;
  if (dt > 0.05) dt = 0.05;
  if (!paused) update(dt);
  render();
}

resize();
refreshShopBtn();
// test hook for automated play-testing only (?test=1); not used in normal play
try { if (/[?&]test=1/.test(location.search)) window.__game = code => eval(code); } catch(e){}
// pre-populate slope for the title screen
for (let z = 14; z < FAR; z += rowGap()) spawnRow(z);
requestAnimationFrame(t0 => { last = t0; frame(t0); });
})();
</script>
<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>
<script id="blizMusicScript">
/* BlizMusic: original background music, generated live with Web Audio.
   Every song is composed in code (chords + melody + drums), so there is no copyrighted audio. */
(function(){
  if(window.BlizMusic) return;

  var SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10] };
  // prog = scale degrees (0-based) of each bar's chord; mel = melody contour seed
  var THEMES = {
    chill:   { name:'Snowfall Lounge', bpm:88,  root:60, scale:'major',  prog:[0,4,5,3], drums:'soft',   arp:'up',     lead:'triangle', pad:.5,  swing:.12 },
    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };
  function pickTheme(){
    var t = (document.title || '').toLowerCase();
    if(/sled/.test(t)) return 'snow';
    if(/frost|gem/.test(t)) return 'puzzle';
    if(/tunnel\s*2/.test(t)) return 'neon';
    if(/tunnel|road/.test(t)) return 'drive';
    if(/hollow/.test(t)) return 'mystery';
    return 'chill';
  }

  var store = {
    get:function(k,d){ try{ var v = localStorage.getItem('blizzard_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('blizzard_'+k, JSON.stringify(v)); }catch(e){} }
  };

  var ctx = null, master, comp, delay, delayGain, noiseBuf;
  var on = store.get('music', true), playing = false, timer = null;
  var theme = THEMES[pickTheme()], themeKey = pickTheme();
  var step = 0, nextTime = 0, melody = [], seed = 1;

  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function note(deg, oct){
    var sc = SCALES[theme.scale], n = sc.length;
    var o = Math.floor(deg / n); deg = ((deg % n) + n) % n;
    return theme.root + sc[deg] + 12 * (o + (oct || 0));
  }

  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0;
    delay = ctx.createDelay(1); delayGain = ctx.createGain(); delayGain.gain.value = .28;
    var fb = ctx.createGain(); fb.gain.value = .32;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delayGain); delayGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return true;
  }

  // Compose a 2-bar motif per chord so the tune repeats and is catchy, not random noise
  function compose(){
    seed = 0; for(var i=0;i<themeKey.length;i++) seed = (seed * 31 + themeKey.charCodeAt(i)) % 2147483647; seed = seed || 7;
    melody = [];
    var pos = 4;
    for(var bar=0; bar<8; bar++){
      var chord = theme.prog[bar % 4], row = [];
      for(var s=0; s<16; s++){
        var strong = s % 4 === 0;
        if(rand() < (strong ? .82 : .32)){
          var tones = [chord, chord+2, chord+4];
          if(strong) pos = tones[(rand()*3)|0] + 7;
          else pos += [-1,1,-2,2,0][(rand()*5)|0];
          pos = Math.max(4, Math.min(14, pos));
          row.push(pos);
        }else row.push(null);
      }
      melody.push(row);
    }
    for(var r=4;r<8;r++) melody[r] = melody[r-4].map(function(v, s){ return (s > 11 && v !== null) ? v + (r === 7 ? -1 : 1) : v; });
  }

  function tone(type, freq, t, dur, vol, dest, attack, cutoff){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    var a = attack || .008;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if(cutoff){ var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(dest || master);
    o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function noise(t, dur, vol, hp){
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }

  function playStep(s, t){
    var bar = Math.floor(s / 16), st = s % 16, chord = theme.prog[bar % 4];
    var sixteenth = 60 / theme.bpm / 4;
    // pad: soft chord at start of each bar
    if(st === 0 && theme.pad){
      [chord, chord+2, chord+4].forEach(function(d){
        tone('triangle', mtof(note(d, -1)), t, sixteenth*16, .045*theme.pad, null, .25, 1400);
      });
    }
    // bass
    var bassHits = theme.drums === 'drive' ? [0,3,6,8,11,14] : [0,8,10];
    if(bassHits.indexOf(st) >= 0) tone('triangle', mtof(note(chord, -2)), t, sixteenth*2.6, .16, null, .01, 700);
    // arpeggio
    var tones = [chord, chord+2, chord+4, chord+7];
    var arpVol = .05, d;
    if(theme.arp === 'up' && st % 2 === 0) d = tones[(st/2) % 4];
    else if(theme.arp === 'updown') d = [0,1,2,3,2,1,0,1][(st % 8)] !== undefined ? tones[[0,1,2,3,2,1,0,1][st % 8]] : null;
    else if(theme.arp === 'pluck' && (st % 4 === 2 || st % 4 === 3)) d = tones[(st >> 1) % 4];
    else if(theme.arp === 'box' && st % 4 === 0) { d = tones[(st/4) % 4] + 7; arpVol = .07; }
    if(d !== undefined && d !== null){
      var g = tone(theme.arp === 'box' ? 'sine' : 'square', mtof(note(d, 0)), t, sixteenth * (theme.arp === 'box' ? 6 : 1.4), arpVol, null, .005, theme.arp === 'box' ? 0 : 2200);
      g.connect(delay);
    }
    // melody
    var m = melody[bar % 8][st];
    if(m !== null && m !== undefined){
      var len = 1; while(st + len < 16 && melody[bar % 8][st + len] === null && len < 4) len++;
      var lg = tone(theme.lead, mtof(note(m, 0)), t, sixteenth * len * 1.1, theme.lead === 'sawtooth' || theme.lead === 'square' ? .045 : .09, null, .01, theme.lead === 'sine' ? 0 : 3000);
      lg.connect(delay);
    }
    // drums
    var dr = theme.drums;
    if(dr === 'drive'){
      if(st % 4 === 0) kick(t, .5);
      if(st === 4 || st === 12) noise(t, .14, .22, 1500);
      if(st % 2 === 1) noise(t, .04, .07, 7000);
    }else if(dr === 'bounce'){
      if(st === 0 || st === 7 || st === 10) kick(t, .4);
      if(st === 4 || st === 12) noise(t, .1, .14, 2000);
      if(st % 2 === 0) noise(t, .03, .05, 8000);
    }else if(dr === 'soft'){
      if(st === 0 || st === 10) kick(t, .3);
      if(st === 4 || st === 12) noise(t, .08, .08, 3000);
      if(st % 4 === 2) noise(t, .03, .04, 8000);
    }else if(dr === 'tick'){
      if(st % 4 === 0) noise(t, .025, .05, 6000);
      if(st === 0) kick(t, .18);
    }
  }

  function schedule(){
    var sixteenth = 60 / theme.bpm / 4;
    while(nextTime < ctx.currentTime + .15){
      var swing = (step % 2 === 1) ? sixteenth * theme.swing : 0;
      playStep(step, nextTime + swing);
      nextTime += sixteenth; step++;
    }
  }
  function start(){
    if(!on || playing || document.hidden || !init()) return;
    if(ctx.state === 'suspended') ctx.resume();
    compose();
    playing = true; step = 0; nextTime = ctx.currentTime + .08;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 1.2);
    timer = setInterval(schedule, 40); schedule();
  }
  function stop(){
    if(!playing) return;
    playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .25);
  }

  /* ---------- button ---------- */
  var btn = document.createElement('button');
  btn.id = 'blizMusicBtn'; btn.type = 'button';
  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
