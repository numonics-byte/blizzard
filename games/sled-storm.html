<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050816">
<title>Sled Storm 3D</title>
<style>
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#050816;touch-action:none;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
canvas{display:block;position:fixed;left:0;top:0;width:100%;height:100%;touch-action:none;outline:none}
#mute{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:44px;height:44px;
  border-radius:50%;border:1px solid rgba(140,230,255,.55);background:rgba(10,20,45,.55);color:#c8f6ff;display:flex;
  align-items:center;justify-content:center;cursor:pointer;z-index:5;padding:0;touch-action:none;
  box-shadow:0 0 14px rgba(80,200,255,.35);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px)}
#mute svg{width:22px;height:22px;pointer-events:none}
</style>
</head>
<body>
<canvas id="c" tabindex="0"></canvas>
<button id="mute" aria-label="Toggle sound"></button>
<script>
(function(){
'use strict';

/* ---------- canvas & view ---------- */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
let F = 600, HOR = 200, CAMH = 2;
const FAR = 70, PZ = 4;

function setupView(){
  F = Math.min(H * 0.95, W * 0.9);
  HOR = H * 0.36;
  CAMH = (H * 0.86 - HOR) * PZ / F;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2.5);
  W = Math.max(1, window.innerWidth);
  H = Math.max(1, window.innerHeight);
  cv.width = Math.round(W * DPR);
  cv.height = Math.round(H * DPR);
  setupView();
  initFlakes();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ---------- helpers ---------- */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const smooth = x => x * x * (3 - 2 * x);
function hex(h){ h = h.replace('#',''); return [parseInt(h.substr(0,2),16), parseInt(h.substr(2,2),16), parseInt(h.substr(4,2),16)]; }
function mix(a, b, t){ return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }
function rgb(c, a){ return 'rgba(' + (c[0]|0) + ',' + (c[1]|0) + ',' + (c[2]|0) + ',' + (a === undefined ? 1 : a) + ')'; }
function project(x, y, z){ const s = F / z; return { x: W / 2 + (x - camX) * s, y: HOR + (CAMH - y) * s, s: s }; }
const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

/* ---------- storage ---------- */
const store = {
  get(k, d){ try { const v = localStorage.getItem('blizzard_' + k); return v === null ? d : v; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('blizzard_' + k, String(v)); } catch(e){} }
};
let best = parseInt(store.get('sledstorm_best', '0'), 10) || 0;
let muted = store.get('muted', '0') === '1';

/* ---------- audio ---------- */
let AC = null, master = null;
function ensureAudio(){
  try {
    if (AC){ if (AC.state === 'suspended') AC.resume(); return; }
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return;
    AC = new C();
    master = AC.createGain();
    master.gain.value = muted ? 0 : 0.45;
    master.connect(AC.destination);
  } catch(e){ AC = null; }
}
function tone(freq, dur, type, vol, slide, delay){
  if (!AC || muted) return;
  try {
    const t0 = AC.currentTime + (delay || 0);
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, slide), t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol || 0.2, t0 + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.05);
  } catch(e){}
}
function noise(dur, vol, freq){
  if (!AC || muted) return;
  try {
    const n = Math.floor(AC.sampleRate * dur);
    const b = AC.createBuffer(1, n, AC.sampleRate);
    const d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 2);
    const s = AC.createBufferSource(); s.buffer = b;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq || 1200;
    const g = AC.createGain(); g.gain.value = vol || 0.3;
    s.connect(f); f.connect(g); g.connect(master);
    s.start();
  } catch(e){}
}
const sfx = {
  start(){ tone(392, .12, 'triangle', .18); tone(523, .12, 'triangle', .18, 0, .1); tone(784, .22, 'triangle', .18, 0, .2); },
  gift(){ tone(880, .09, 'square', .08); tone(1175, .09, 'square', .08, 0, .07); tone(1568, .18, 'square', .08, 0, .14); },
  jump(){ tone(300, .3, 'sawtooth', .09, 900); noise(.25, .12, 2500); },
  land(){ tone(140, .15, 'sine', .25, 60); noise(.18, .2, 900); },
  crash(){ noise(.7, .5, 1400); tone(220, .6, 'sawtooth', .18, 40); tone(90, .5, 'sine', .3, 30); },
  best(){ [523,659,784,1047].forEach((f,i) => tone(f, .16, 'triangle', .14, 0, i * .09)); }
};

/* ---------- mute button ---------- */
const muteBtn = document.getElementById('mute');
const SVG_ON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
const SVG_OFF = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5"/></svg>';
function refreshMute(){ muteBtn.innerHTML = muted ? SVG_OFF : SVG_ON; }
function toggleMute(){
  ensureAudio();
  muted = !muted;
  store.set('muted', muted ? '1' : '0');
  try { if (master) master.gain.value = muted ? 0 : 0.45; } catch(e){}
  refreshMute();
  if (!muted) tone(660, .08, 'sine', .15);
}
muteBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); toggleMute(); });
muteBtn.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); });
refreshMute();

/* ---------- input ---------- */
const keys = {};
const pointers = new Map();
window.addEventListener('keydown', e => {
  const c = e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].indexOf(c) >= 0) e.preventDefault();
  ensureAudio();
  keys[c] = true;
  if (e.repeat) return;
  if (c === 'Space' || c === 'Enter') primaryAction();
  else if (c === 'KeyP' || c === 'Escape') togglePause();
  else if (c === 'KeyM') toggleMute();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointers.clear(); });

cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  ensureAudio();
  try { cv.setPointerCapture(e.pointerId); } catch(_){}
  pointers.set(e.pointerId, { x: e.clientX });
  primaryAction();
});
cv.addEventListener('pointermove', e => { const p = pointers.get(e.pointerId); if (p) p.x = e.clientX; });
const endPtr = e => pointers.delete(e.pointerId);
cv.addEventListener('pointerup', endPtr);
cv.addEventListener('pointercancel', endPtr);
cv.addEventListener('lostpointercapture', endPtr);
document.addEventListener('touchstart', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('touchend', e => { if (e.target === cv) e.preventDefault(); }, { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('dblclick', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

function steerInput(){
  let d = 0;
  if (keys.ArrowLeft || keys.KeyA) d -= 1;
  if (keys.ArrowRight || keys.KeyD) d += 1;
  let l = false, r = false;
  pointers.forEach(p => { if (p.x < W / 2) l = true; else r = true; });
  if (l) d -= 1;
  if (r) d += 1;
  return clamp(d, -1, 1);
}

/* ---------- game state ---------- */
let state = 'title', paused = false, t = 0;
let px = 0, pvx = 0, py = 0, pvy = 0, camX = 0, speed = 14, dist = 0, score = 0, elapsed = 0, airTime = 0;
let objs = [], parts = [], pops = [], flakes = [], sparkles = [];
let shake = 0, flash = 0, overTimer = 0, dyingTimer = 0, spawnAcc = 0, newBest = false, gifts = 0, tilt = 0;
let env = null;

function primaryAction(){
  if (paused){ paused = false; return; }
  if (state === 'title') startGame();
  else if (state === 'over' && overTimer > 0.6) startGame();
}
function togglePause(){ if (state === 'play' || state === 'dying') paused = !paused; }
document.addEventListener('visibilitychange', () => {
  if (document.hidden && (state === 'play' || state === 'dying')) paused = true;
  last = performance.now();
});
window.addEventListener('pagehide', () => { if (state === 'play') paused = true; });

function startGame(){
  state = 'play';
  px = 0; pvx = 0; py = 0; pvy = 0; camX = 0;
  speed = 16; score = 0; elapsed = 0; airTime = 0; gifts = 0; newBest = false;
  spawnAcc = 0; overTimer = 0; dyingTimer = 0;
  objs = objs.filter(o => o.z > 32 && Math.abs(o.x) < 30);
  parts.length = 0; pops.length = 0;
  sfx.start();
}

/* ---------- spawning ---------- */
function pickObstacle(){
  const r = Math.random();
  return r < 0.45 ? 'tree' : r < 0.7 ? 'rock' : 'frost';
}
function spawnRow(z){
  const diff = clamp(elapsed / 90, 0, 1);
  const r = Math.random();
  const playing = state === 'play';
  if (r < 0.12 + diff * 0.05){
    // ramp + wall of obstacles with a gift in the air
    const x = px + rand(-5, 5);
    objs.push({ type: 'ramp', x: x, z: z, seed: Math.random() });
    const wz = z + 6 + speed * 0.12;
    for (let i = -2; i <= 2; i++){
      objs.push({ type: Math.random() < .5 ? 'rock' : 'frost', x: x + i * 1.55 + rand(-.15, .15), z: wz + rand(-.3, .3), seed: Math.random() });
    }
    objs.push({ type: 'gift', x: x, z: wz, y: 2.1, seed: Math.random() });
    spawnAcc = -9;
  } else if (r < 0.32){
    // gift trail
    const x = px + rand(-6, 6), dx = rand(-.8, .8);
    for (let i = 0; i < 3; i++) objs.push({ type: 'gift', x: x + dx * i, z: z + i * 3, seed: Math.random() });
    objs.push({ type: pickObstacle(), x: x + (Math.random() < .5 ? -1 : 1) * rand(2.5, 6), z: z + rand(0, 6), seed: Math.random() });
  } else {
    const n = 1 + Math.floor(rand(0, 2 + diff * 2.5));
    for (let i = 0; i < n; i++) objs.push({ type: pickObstacle(), x: px + rand(-11, 11), z: z + rand(-1, 1), seed: Math.random() });
    if (playing && Math.random() < 0.35 + diff * 0.3) objs.push({ type: pickObstacle(), x: px + rand(-1.4, 1.4), z: z, seed: Math.random() });
  }
  // scenery trees off to the sides
  const side = Math.random() < .5 ? -1 : 1;
  objs.push({ type: 'tree', x: px + side * rand(12, 26), z: z + rand(0, 3), seed: Math.random() });
  if (Math.random() < .6) objs.push({ type: 'tree', x: px - side * rand(13, 26), z: z + rand(0, 3), seed: Math.random() });
}

/* ---------- particles ---------- */
function burst(x, y, n, colors, spd, life, grav, size){
  for (let i = 0; i < n; i++){
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd;
    parts.push({ x: x, y: y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * .3, life: life * rand(.5, 1), max: life,
      r: size * rand(.5, 1.3), c: colors[(Math.random() * colors.length) | 0], g: grav });
  }
}
function pop(text, x, y, color){ pops.push({ text: text, x: x, y: y, life: 1.1, c: color || '#fff' }); }

function initFlakes(){
  flakes = [];
  const n = Math.round(clamp(W * H / 9000, 60, 220));
  for (let i = 0; i < n; i++) flakes.push({ x: Math.random() * W, y: Math.random() * H, d: rand(.15, 1), ph: Math.random() * 6.28 });
}
function initSparkles(){
  sparkles = [];
  for (let i = 0; i < 110; i++) sparkles.push({ x: rand(-40, 40), z: rand(2, FAR), ph: Math.random() * 6.28 });
}
initSparkles();

/* ---------- environment / sky ---------- */
const PH = [
  { top: hex('#2a74d0'), bot: hex('#c6e9ff'), snow: hex('#f6fbff'), shade: hex('#9fbde3'), mtn: hex('#7e9fd0'), night: 0 },
  { top: hex('#2b2268'), bot: hex('#ff9e85'), snow: hex('#ffe7ec'), shade: hex('#c395b8'), mtn: hex('#6c4f8f'), night: .25 },
  { top: hex('#02041a'), bot: hex('#1b2c66'), snow: hex('#7b93c8'), shade: hex('#34477e'), mtn: hex('#141f48'), night: 1 },
  { top: hex('#28398a'), bot: hex('#ffc0dc'), snow: hex('#f3e8f8'), shade: hex('#b1a1cf'), mtn: hex('#6d6aa8'), night: .3 }
];
function computeEnv(sc){
  const p = (sc / 450) % 4, i = Math.floor(p), fr = p - i;
  const k = smooth(clamp((fr - .55) / .45, 0, 1));
  const A = PH[i], B = PH[(i + 1) % 4];
  const e = { top: mix(A.top, B.top, k), bot: mix(A.bot, B.bot, k), snow: mix(A.snow, B.snow, k),
    shade: mix(A.shade, B.shade, k), mtn: mix(A.mtn, B.mtn, k), night: A.night + (B.night - A.night) * k };
  const dark = hex('#16204a'), nk = e.night * .6;
  e.leaf1 = mix(hex('#0d3b44'), dark, nk); e.leaf2 = mix(hex('#1f6b62'), dark, nk);
  e.trunk = mix(hex('#5a3a2e'), dark, nk); e.cap = mix(hex('#ffffff'), e.snow, .5);
  e.rock = mix(hex('#4c5a7a'), dark, nk); e.rockHi = mix(hex('#8a9bc0'), dark, nk);
  return e;
}
const stars = [];
for (let i = 0; i < 120; i++) stars.push({ x: Math.random(), y: Math.random(), r: rand(.4, 1.6), ph: Math.random() * 6.28 });
const mtnSeed = [Math.random() * 10, Math.random() * 10, Math.random() * 10, Math.random() * 10];

/* ---------- update ---------- */
let last = performance.now();
function update(dt){
  t += dt;
  if (state === 'play'){ elapsed += dt; speed = Math.min(48, 16 + elapsed * 0.38); }
  else if (state === 'title') speed = 13;
  else speed = Math.max(0, speed - speed * 2.5 * dt - 3 * dt);

  const dz = speed * dt;
  dist += dz;
  if (state === 'play') score += dz * 0.5;

  // steering
  if (state === 'play'){
    const s = steerInput();
    const target = s * (7 + speed * 0.13);
    pvx += (target - pvx) * Math.min(1, (py > 0 ? 3.5 : 10) * dt);
  } else if (state === 'title'){
    pvx = (Math.sin(t * .6) * 3.5 - px) * 1.2;
  } else pvx *= Math.pow(0.04, dt);
  px += pvx * dt;
  tilt += ((state === 'dying' || state === 'over' ? 0 : pvx * 0.035) - tilt) * Math.min(1, 10 * dt);

  // vertical
  if (py > 0 || pvy > 0){
    pvy -= 22 * dt; py += pvy * dt; airTime += dt;
    if (py <= 0){ py = 0; pvy = 0; land(); }
  }
  camX += (px - camX) * Math.min(1, 6 * dt);

  // objects
  for (let i = objs.length - 1; i >= 0; i--){
    const o = objs[i];
    const z0 = o.z;
    o.z -= dz;
    if (state === 'play' && !o.done){
      const cz = o.type === 'ramp' ? o.z + 0.9 : o.z, cz0 = o.type === 'ramp' ? z0 + 0.9 : z0;
      if (cz0 >= PZ && cz < PZ) collide(o);
    }
    if (o.z < 1.1 || o.dead) objs.splice(i, 1);
  }
  spawnAcc += dz;
  const gap = Math.max(4.2, 8 - elapsed * 0.045);
  if (spawnAcc > gap){ spawnAcc = 0; spawnRow(FAR + rand(0, 2)); }

  // sparkles on snow
  for (const s of sparkles){
    s.z -= dz;
    if (s.z < 1.5 || Math.abs(s.x - camX) > s.z * 1.2 + 4){ s.z = FAR * rand(.6, 1); s.x = camX + rand(-1, 1) * s.z * (W / F) * .6; }
  }

  // snow spray from runners
  if ((state === 'play' || state === 'title') && py <= 0){
    const p = project(px, 0, PZ);
    const amt = 0.4 + Math.abs(pvx) * 0.25 + speed * 0.02;
    if (Math.random() < amt){
      for (let k = -1; k <= 1; k += 2){
        parts.push({ x: p.x + k * .5 * p.s, y: p.y - 2, vx: k * rand(20, 80) - pvx * 12, vy: rand(-120, -40) - speed * 2,
          life: rand(.3, .6), max: .6, r: rand(1.5, 3.5) * (p.s / 90), c: '#ffffff', g: 500 });
      }
    }
  }

  // particles
  for (let i = parts.length - 1; i >= 0; i--){
    const p = parts[i];
    p.life -= dt; if (p.life <= 0){ parts.splice(i, 1); continue; }
    p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= Math.pow(.6, dt);
  }
  for (let i = pops.length - 1; i >= 0; i--){ const q = pops[i]; q.life -= dt; q.y -= 50 * dt; if (q.life <= 0) pops.splice(i, 1); }

  // falling snow
  const wind = -pvx * 6;
  for (const f of flakes){
    f.y += (25 + 70 * f.d + speed * 1.2 * f.d) * dt;
    f.x += (Math.sin(t * 1.3 + f.ph) * 12 * f.d + wind * f.d + (f.x - W / 2) * speed * 0.012 * f.d) * dt;
    if (f.y > H + 5 || f.x < -10 || f.x > W + 10){ f.y = rand(-20, H * .3); f.x = Math.random() * W; }
  }

  shake = Math.max(0, shake - 40 * dt);
  flash = Math.max(0, flash - 2.5 * dt);
  if (state === 'dying'){
    dyingTimer += dt;
    if (dyingTimer > 1.1) gameOver();
  }
  if (state === 'over') overTimer += dt;
}

function collide(o){
  const dx = Math.abs(o.x - px);
  const p = project(px, py, PZ);
  if (o.type === 'gift'){
    const gy = o.y || 0.7;
    if (dx < 1.05 && Math.abs(gy - py) < 1.5){
      o.dead = true; o.done = true;
      const bonus = 100 + (py > 0.5 ? 50 : 0);
      score += bonus; gifts++;
      sfx.gift();
      burst(p.x, p.y - p.s * .6, 26, ['#ffe066', '#ff5fd2', '#7ff3ff', '#ffffff'], 260, .8, 200, 3);
      pop('+' + bonus, p.x, p.y - p.s * 1.4, '#ffe066');
    }
    return;
  }
  if (o.type === 'ramp'){
    o.done = true;
    if (dx < 1.45 && py < 0.4){
      pvy = 9.5 + speed * 0.06; py = 0.01; airTime = 0;
      sfx.jump();
      burst(p.x, p.y, 18, ['#bff6ff', '#ffffff'], 180, .5, 300, 2.5);
    }
    return;
  }
  const lim = o.type === 'tree' ? [0.75, 1.7] : o.type === 'rock' ? [0.95, 0.8] : [0.85, 1.2];
  o.done = true;
  if (dx < lim[0] && py < lim[1]) crash(o);
}
function land(){
  const p = project(px, 0, PZ);
  if (state === 'play'){
    if (airTime > 0.45){
      const b = Math.round(airTime * 60) * 1;
      score += b;
      pop('AIR +' + b, p.x, p.y - p.s * 1.5, '#7ff3ff');
    }
    sfx.land();
    shake = Math.max(shake, 4);
  }
  burst(p.x, p.y, 22, ['#ffffff', '#dff6ff'], 200, .6, 400, 3);
  airTime = 0;
}
function crash(o){
  state = 'dying'; dyingTimer = 0;
  shake = 22; flash = 0.8;
  const p = project(px, py, PZ);
  burst(p.x, p.y - p.s * .4, 60, ['#ffffff', '#e6f6ff', '#bfe9ff'], 420, 1.2, 600, 4);
  burst(p.x, p.y - p.s * .4, 24, ['#8a5cff', '#2ef2ff', '#ff4fa3'], 360, 1, 500, 3.5);
  if (o.type === 'frost') burst(p.x, p.y - p.s, 20, ['#9ff', '#e0ffff'], 300, .9, 300, 3);
  sfx.crash();
  pvy = Math.max(pvy, 4); if (py <= 0) py = 0.01;
}
function gameOver(){
  state = 'over'; overTimer = 0;
  const s = Math.floor(score);
  if (s > best){ best = s; newBest = true; store.set('sledstorm_best', best); sfx.best(); }
}

/* ---------- drawing: world ---------- */
function drawSky(){
  const e = env;
  const g = ctx.createLinearGradient(0, 0, 0, HOR);
  g.addColorStop(0, rgb(e.top)); g.addColorStop(1, rgb(e.bot));
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, HOR + 22);

  if (e.night > 0.05){
    for (const s of stars){
      const a = e.night * (0.5 + 0.5 * Math.sin(t * 2 + s.ph));
      ctx.fillStyle = 'rgba(230,240,255,' + a.toFixed(3) + ')';
      ctx.fillRect(s.x * W, s.y * HOR * .85, s.r, s.r);
    }
    // aurora ribbons
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    const cols = [[60, 255, 190], [80, 180, 255], [200, 90, 255]];
    for (let k = 0; k < 3; k++){
      const base = HOR * (0.22 + k * 0.1);
      const gr = ctx.createLinearGradient(0, base - HOR * .2, 0, base + HOR * .12);
      gr.addColorStop(0, rgb(cols[k], 0)); gr.addColorStop(.7, rgb(cols[k], .22 * e.night)); gr.addColorStop(1, rgb(cols[k], 0));
      ctx.fillStyle = gr;
      ctx.beginPath();
      ctx.moveTo(0, base + HOR * .12);
      for (let x = 0; x <= W + 20; x += 20){
        const y = base + Math.sin(x * .006 + t * .35 + k * 1.7) * HOR * .07 + Math.sin(x * .017 - t * .5 + k) * HOR * .02;
        ctx.lineTo(x, y - HOR * .2);
      }
      ctx.lineTo(W + 20, base + HOR * .12);
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  }
  // sun / moon
  const dayA = 1 - e.night;
  if (dayA > 0.02){
    const sx = W * .78 - camX * 1.5, sy = HOR * (0.35 + 0.45 * clamp(e.night * 2.5, 0, 1));
    const rg = ctx.createRadialGradient(sx, sy, 0, sx, sy, H * .12);
    const sc = mix(hex('#fff6d0'), hex('#ffb070'), clamp(e.night * 3, 0, 1));
    rg.addColorStop(0, rgb(sc, dayA)); rg.addColorStop(.18, rgb(sc, dayA * .9)); rg.addColorStop(.2, rgb(sc, dayA * .35)); rg.addColorStop(1, rgb(sc, 0));
    ctx.fillStyle = rg; ctx.fillRect(sx - H * .12, sy - H * .12, H * .24, H * .24);
  }
  if (e.night > 0.3){
    const mx = W * .22 - camX * 1.5, my = HOR * .3, mr = Math.max(10, H * .025);
    ctx.save();
    ctx.globalAlpha = clamp((e.night - .3) / .5, 0, 1);
    const mg = ctx.createRadialGradient(mx, my, mr * .5, mx, my, mr * 4);
    mg.addColorStop(0, 'rgba(190,220,255,.35)'); mg.addColorStop(1, 'rgba(190,220,255,0)');
    ctx.fillStyle = mg; ctx.fillRect(mx - mr * 4, my - mr * 4, mr * 8, mr * 8);
    ctx.fillStyle = '#eaf3ff'; ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(160,180,220,.5)'; ctx.beginPath(); ctx.arc(mx - mr * .3, my - mr * .2, mr * .22, 0, 7); ctx.arc(mx + mr * .35, my + mr * .3, mr * .15, 0, 7); ctx.fill();
    ctx.restore();
  }
  // mountains
  for (let layer = 0; layer < 2; layer++){
    const par = layer === 0 ? 2 : 5;
    const hgt = layer === 0 ? HOR * .32 : HOR * .2;
    const col = layer === 0 ? mix(e.mtn, e.bot, .45) : mix(e.mtn, e.bot, .15);
    const off = camX * par + (layer ? 300 : 0);
    ctx.beginPath(); ctx.moveTo(-10, HOR + 1);
    for (let x = -10; x <= W + 10; x += 6){
      const u = (x + off) * (layer ? .006 : .004);
      const h = (Math.sin(u + mtnSeed[layer]) * .5 + Math.sin(u * 2.3 + mtnSeed[layer + 2]) * .3 + Math.abs(Math.sin(u * 5.1)) * .2 + .7) * hgt * .62;
      ctx.lineTo(x, HOR - h);
    }
    ctx.lineTo(W + 10, HOR + 1); ctx.closePath();
    const mg = ctx.createLinearGradient(0, HOR - hgt, 0, HOR);
    mg.addColorStop(0, rgb(mix(col, e.snow, layer ? .35 : .5))); mg.addColorStop(.45, rgb(col)); mg.addColorStop(1, rgb(e.bot));
    ctx.fillStyle = mg; ctx.fill();
  }
}

function drawGround(){
  const e = env;
  const g = ctx.createLinearGradient(0, HOR, 0, H);
  g.addColorStop(0, rgb(e.bot)); g.addColorStop(.18, rgb(mix(e.bot, e.snow, .6))); g.addColorStop(1, rgb(e.snow));
  ctx.fillStyle = g; ctx.fillRect(-20, HOR, W + 40, H - HOR + 20);
  // mogul bands
  const sp = 3.2, off = dist % sp;
  for (let k = 1; k < 30; k++){
    const z = k * sp - off; if (z < 1 || z > FAR) continue;
    const y = HOR + CAMH * F / z;
    const a = 0.16 * (1 - z / FAR);
    ctx.fillStyle = rgb(e.shade, a);
    ctx.fillRect(-20, y, W + 40, Math.max(1, 0.25 * F / z));
  }
  // converging grooves
  ctx.lineWidth = 1;
  const gs = 4, base = Math.floor(camX / gs);
  for (let k = -14; k <= 14; k++){
    const x = (base + k) * gs;
    const a = project(x, 0, FAR), b = project(x, 0, 1.5);
    const lg = ctx.createLinearGradient(0, a.y, 0, b.y);
    lg.addColorStop(0, rgb(e.shade, 0)); lg.addColorStop(1, rgb(e.shade, .22));
    ctx.strokeStyle = lg;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
  }
  // sparkles
  for (const s of sparkles){
    const p = project(s.x, 0, s.z);
    const tw = 0.5 + 0.5 * Math.sin(t * 6 + s.ph);
    const a = tw * (1 - s.z / FAR) * 0.9;
    if (a < .05) continue;
    const r = Math.max(.8, .05 * p.s);
    ctx.fillStyle = e.night > .5 ? 'rgba(150,230,255,' + a.toFixed(2) + ')' : 'rgba(255,255,255,' + a.toFixed(2) + ')';
    ctx.fillRect(p.x - r / 2, p.y - r / 2, r, r);
  }
}

function fogAlpha(z){ const s = FAR * .45; return z < s ? 1 : clamp(1 - (z - s) / (FAR - s), 0, 1); }

function shadow(x, z, w){
  const p = project(x, 0, z);
  ctx.fillStyle = 'rgba(30,45,95,.22)';
  ctx.beginPath(); ctx.ellipse(p.x, p.y, w * p.s, w * p.s * .22, 0, 0, 7); ctx.fill();
}

function drawTree(o){
  const p = project(o.x, 0, o.z), s = p.s, x = p.x, y = p.y, e = env;
  const sc = 0.9 + o.seed * 0.45;
  shadow(o.x, o.z, 1.1 * sc);
  ctx.fillStyle = rgb(e.trunk);
  ctx.fillRect(x - .13 * s * sc, y - .7 * s * sc, .26 * s * sc, .72 * s * sc);
  const L = [[2.4, .45, 1.55], [1.9, 1.25, 1.45], [1.35, 2.05, 1.45]];
  for (const l of L){
    const w = l[0] * s * sc / 2, by = y - l[1] * s * sc, ty = y - (l[1] + l[2]) * s * sc;
    const g = ctx.createLinearGradient(x - w, 0, x + w, 0);
    g.addColorStop(0, rgb(e.leaf2)); g.addColorStop(1, rgb(e.leaf1));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.moveTo(x, ty); ctx.lineTo(x + w, by); ctx.lineTo(x - w, by); ctx.closePath(); ctx.fill();
    // snow on the layer
    const k = .45;
    ctx.fillStyle = rgb(e.cap, .95);
    ctx.beginPath();
    ctx.moveTo(x, ty);
    ctx.lineTo(x + w * k, ty + (by - ty) * k);
    ctx.quadraticCurveTo(x + w * k * .4, ty + (by - ty) * k * .8, x, ty + (by - ty) * k * 1.05);
    ctx.quadraticCurveTo(x - w * k * .4, ty + (by - ty) * k * .8, x - w * k, ty + (by - ty) * k);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = rgb(e.cap, .7);
    ctx.fillRect(x - w * .9, by - Math.max(1, .07 * s), w * 1.8, Math.max(1, .09 * s));
  }
}

function drawRock(o){
  const p = project(o.x, 0, o.z), s = p.s, x = p.x, y = p.y, e = env;
  const sx = s * (0.85 + o.seed * .35);
  shadow(o.x, o.z, 1.0);
  const pts = [[-.85, 0], [-.75, -.45], [-.35, -.85], [.15, -.92], [.6, -.6], [.88, -.1], [.8, 0]];
  const g = ctx.createLinearGradient(x, y - .9 * s, x, y);
  g.addColorStop(0, rgb(e.rockHi)); g.addColorStop(1, rgb(e.rock));
  ctx.fillStyle = g;
  ctx.beginPath(); pts.forEach((q, i) => { const X = x + q[0] * sx, Y = y + q[1] * s; i ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(10,20,50,.25)';
  ctx.beginPath(); ctx.moveTo(x + .15 * sx, y - .92 * s); ctx.lineTo(x + .6 * sx, y - .6 * s); ctx.lineTo(x + .88 * sx, y - .1 * s); ctx.lineTo(x + .8 * sx, y); ctx.lineTo(x + .25 * sx, y); ctx.closePath(); ctx.fill();
  ctx.fillStyle = rgb(e.cap);
  ctx.beginPath();
  ctx.moveTo(x - .62 * sx, y - .58 * s); ctx.lineTo(x - .35 * sx, y - .85 * s); ctx.lineTo(x + .15 * sx, y - .92 * s); ctx.lineTo(x + .52 * sx, y - .66 * s);
  ctx.quadraticCurveTo(x + .2 * sx, y - .62 * s, x - .05 * sx, y - .7 * s); ctx.quadraticCurveTo(x - .35 * sx, y - .55 * s, x - .62 * sx, y - .58 * s);
  ctx.fill();
}

// "Frostling": an original icy dome creature with crystal spikes and glowing eyes
function drawFrost(o){
  const bob = Math.sin(t * 3 + o.seed * 10) * .05;
  const p = project(o.x, 0, o.z), s = p.s, x = p.x, y = p.y - bob * s;
  shadow(o.x, o.z, .95);
  // crystal spikes
  const spikes = [[-.45, -.95, .22, .7], [0, -1.15, .28, .95], [.42, -.98, .22, .65]];
  for (const k of spikes){
    const g = ctx.createLinearGradient(0, y + k[1] * s - k[3] * s, 0, y + k[1] * s);
    g.addColorStop(0, 'rgba(220,255,255,.95)'); g.addColorStop(1, 'rgba(70,200,255,.9)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x + k[0] * s, y + k[1] * s - k[3] * s);
    ctx.lineTo(x + (k[0] + k[2]) * s, y + k[1] * s + .1 * s);
    ctx.lineTo(x + (k[0] - k[2]) * s, y + k[1] * s + .1 * s);
    ctx.closePath(); ctx.fill();
  }
  // body
  const g = ctx.createRadialGradient(x - .25 * s, y - .95 * s, .1 * s, x, y - .6 * s, .95 * s);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.6, '#cfeeff'); g.addColorStop(1, '#7fb4e6');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.ellipse(x, y - .62 * s, .82 * s, .66 * s, 0, Math.PI, 0); ctx.lineTo(x + .82 * s, y); ctx.lineTo(x - .82 * s, y); ctx.closePath(); ctx.fill();
  // shard arms
  ctx.fillStyle = 'rgba(120,220,255,.9)';
  const wave = Math.sin(t * 5 + o.seed * 7) * .12;
  ctx.beginPath(); ctx.moveTo(x - .75 * s, y - .5 * s); ctx.lineTo(x - 1.2 * s, y - (.85 + wave) * s); ctx.lineTo(x - .7 * s, y - .32 * s); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + .75 * s, y - .5 * s); ctx.lineTo(x + 1.2 * s, y - (.85 - wave) * s); ctx.lineTo(x + .7 * s, y - .32 * s); ctx.fill();
  // glowing eyes
  const blink = (Math.sin(t * 1.7 + o.seed * 20) > .97) ? .15 : 1;
  for (const ex of [-.27, .27]){
    const cx = x + ex * s, cy = y - .72 * s;
    const eg = ctx.createRadialGradient(cx, cy, 0, cx, cy, .28 * s);
    eg.addColorStop(0, 'rgba(255,90,220,.9)'); eg.addColorStop(1, 'rgba(255,90,220,0)');
    ctx.fillStyle = eg; ctx.fillRect(cx - .28 * s, cy - .28 * s, .56 * s, .56 * s);
    ctx.fillStyle = '#ffe9ff';
    ctx.beginPath(); ctx.ellipse(cx, cy, .09 * s, .11 * s * blink, 0, 0, 7); ctx.fill();
  }
  // zigzag mouth
  ctx.strokeStyle = 'rgba(40,70,140,.8)'; ctx.lineWidth = Math.max(1, .04 * s);
  ctx.beginPath();
  for (let i = 0; i <= 6; i++){ const mx = x + (-.25 + i * .5 / 6) * s, my = y - (.42 + (i % 2 ? .05 : 0)) * s; i ? ctx.lineTo(mx, my) : ctx.moveTo(mx, my); }
  ctx.stroke();
}

function drawRamp(o){
  const L = 1.6, Hh = .9, Wd = 1.35;
  const fl = project(o.x - Wd, 0, o.z), fr = project(o.x + Wd, 0, o.z);
  const bl = project(o.x - Wd, Hh, o.z + L), br = project(o.x + Wd, Hh, o.z + L);
  const blg = project(o.x - Wd, 0, o.z + L), brg = project(o.x + Wd, 0, o.z + L);
  // sides
  ctx.fillStyle = 'rgba(60,110,190,.85)';
  ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(blg.x, blg.y); ctx.lineTo(bl.x, bl.y); ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(fr.x, fr.y); ctx.lineTo(brg.x, brg.y); ctx.lineTo(br.x, br.y); ctx.closePath(); ctx.fill();
  // surface
  const g = ctx.createLinearGradient(0, bl.y, 0, fl.y);
  g.addColorStop(0, '#e9fbff'); g.addColorStop(1, '#8fd0ff');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(fr.x, fr.y); ctx.lineTo(br.x, br.y); ctx.lineTo(bl.x, bl.y); ctx.closePath(); ctx.fill();
  // chevrons
  ctx.strokeStyle = 'rgba(255,80,200,.75)'; ctx.lineWidth = Math.max(1, .05 * fl.s);
  for (let k = 1; k <= 3; k++){
    const f = k / 4;
    const lx = fl.x + (bl.x - fl.x) * f, ly = fl.y + (bl.y - fl.y) * f;
    const rx = fr.x + (br.x - fr.x) * f, ry = fr.y + (br.y - fr.y) * f;
    const mx = (lx + rx) / 2, my = (ly + ry) / 2 - (fl.y - bl.y) * .12;
    ctx.beginPath(); ctx.moveTo(lx + (rx - lx) * .2, ly + (ry - ly) * .2); ctx.lineTo(mx, my); ctx.lineTo(lx + (rx - lx) * .8, ly + (ry - ly) * .8); ctx.stroke();
  }
  // neon edges
  ctx.save();
  ctx.shadowColor = '#2ef2ff'; ctx.shadowBlur = 12;
  ctx.strokeStyle = '#7ff9ff'; ctx.lineWidth = Math.max(1.5, .07 * fl.s);
  ctx.beginPath(); ctx.moveTo(fl.x, fl.y); ctx.lineTo(bl.x, bl.y); ctx.lineTo(br.x, br.y); ctx.lineTo(fr.x, fr.y); ctx.stroke();
  ctx.restore();
}

const GIFT_COLS = [['#ff3fb4', '#ffe066'], ['#2ef2ff', '#ff5fd2'], ['#ffd23f', '#7a5cff'], ['#8a5cff', '#7ff3ff']];
function drawGift(o){
  const gy = (o.y || .7) + Math.sin(t * 3 + o.seed * 6) * .15;
  const p = project(o.x, gy, o.z), s = p.s, x = p.x, y = p.y;
  const col = GIFT_COLS[Math.floor(o.seed * 4) % 4];
  shadow(o.x, o.z, .5);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const rg = ctx.createRadialGradient(x, y, 0, x, y, 1.3 * s);
  rg.addColorStop(0, col[0] + 'aa'); rg.addColorStop(1, col[0] + '00');
  ctx.fillStyle = rg; ctx.fillRect(x - 1.3 * s, y - 1.3 * s, 2.6 * s, 2.6 * s);
  ctx.restore();
  ctx.save();
  ctx.translate(x, y); ctx.rotate(Math.sin(t * 2.2 + o.seed * 9) * .18);
  const b = .34 * s;
  const g = ctx.createLinearGradient(-b, -b, b, b);
  g.addColorStop(0, '#ffffff'); g.addColorStop(.25, col[0]); g.addColorStop(1, col[0]);
  ctx.fillStyle = g; ctx.fillRect(-b, -b, b * 2, b * 2);
  ctx.fillStyle = col[1];
  ctx.fillRect(-b * .18, -b, b * .36, b * 2); ctx.fillRect(-b, -b * .18, b * 2, b * .36);
  ctx.beginPath(); ctx.ellipse(-b * .35, -b * 1.12, b * .35, b * .2, -.5, 0, 7); ctx.ellipse(b * .35, -b * 1.12, b * .35, b * .2, .5, 0, 7); ctx.fill();
  ctx.restore();
}

function drawPlayer(){
  const p = project(px, py, PZ), s = p.s * 0.78;
  // shadow
  const sp = project(px, 0, PZ);
  const sh = 1 / (1 + py * .6);
  ctx.fillStyle = 'rgba(25,40,90,' + (.3 * sh).toFixed(3) + ')';
  ctx.beginPath(); ctx.ellipse(sp.x, sp.y, .7 * s * sh, .16 * s * sh, 0, 0, 7); ctx.fill();

  const crashed = state === 'dying' || state === 'over';
  ctx.save();
  ctx.translate(p.x, p.y);
  let rot = tilt;
  if (crashed) rot += Math.min(dyingTimer + overTimer, 1.2) * 2.4;
  if (py > 0 && !crashed) rot += Math.sin(airTime * 9) * .06;
  ctx.rotate(rot);
  // underglow
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  const ug = ctx.createRadialGradient(0, -.05 * s, 0, 0, -.05 * s, .9 * s);
  ug.addColorStop(0, 'rgba(46,242,255,.45)'); ug.addColorStop(1, 'rgba(46,242,255,0)');
  ctx.fillStyle = ug; ctx.fillRect(-.9 * s, -.95 * s, 1.8 * s, 1.8 * s);
  ctx.restore();
  // runners
  ctx.strokeStyle = '#7ff9ff'; ctx.lineWidth = Math.max(2, .07 * s); ctx.lineCap = 'round';
  for (const k of [-1, 1]){
    ctx.beginPath();
    ctx.moveTo(k * .55 * s, -.02 * s);
    ctx.lineTo(k * .42 * s, -.36 * s);
    ctx.quadraticCurveTo(k * .38 * s, -.62 * s, k * .3 * s, -.5 * s);
    ctx.stroke();
  }
  // deck
  const dg = ctx.createLinearGradient(0, -.4 * s, 0, 0);
  dg.addColorStop(0, '#b06bff'); dg.addColorStop(1, '#5a2fd0');
  ctx.fillStyle = dg;
  ctx.beginPath(); ctx.moveTo(-.56 * s, -.08 * s); ctx.lineTo(.56 * s, -.08 * s); ctx.lineTo(.4 * s, -.42 * s); ctx.lineTo(-.4 * s, -.42 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#ff4fa3'; ctx.fillRect(-.56 * s, -.13 * s, 1.12 * s, .06 * s);
  if (!crashed || (dyingTimer + overTimer) < .25){
    // rider body
    const bg = ctx.createLinearGradient(-.35 * s, 0, .35 * s, 0);
    bg.addColorStop(0, '#1fd2e8'); bg.addColorStop(1, '#0f7fb8');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, -.5 * s, .34 * s, .36 * s, 0, 0, 7); ctx.fill();
    // arms
    ctx.strokeStyle = '#11a6cc'; ctx.lineWidth = .13 * s;
    ctx.beginPath(); ctx.moveTo(-.28 * s, -.58 * s); ctx.lineTo(-.4 * s - tilt * 4, -.3 * s); ctx.moveTo(.28 * s, -.58 * s); ctx.lineTo(.4 * s - tilt * 4, -.3 * s); ctx.stroke();
    // scarf tail
    const fl = Math.sin(t * 14) * .08 * s;
    ctx.strokeStyle = '#ff4fa3'; ctx.lineWidth = .1 * s;
    ctx.beginPath(); ctx.moveTo(.08 * s, -.82 * s); ctx.quadraticCurveTo(.3 * s - tilt * 6, -.75 * s + fl, .42 * s - tilt * 8, -.62 * s - fl); ctx.stroke();
    ctx.fillStyle = '#ff4fa3'; ctx.fillRect(-.2 * s, -.88 * s, .4 * s, .1 * s);
    // head + beanie
    ctx.fillStyle = '#3a2a3a'; ctx.beginPath(); ctx.arc(0, -1.0 * s, .2 * s, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(0, -1.05 * s, .2 * s, Math.PI, 0); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a5cff'; ctx.fillRect(-.2 * s, -1.08 * s, .4 * s, .06 * s);
    ctx.fillStyle = '#ffe066'; ctx.beginPath(); ctx.arc(0, -1.27 * s, .07 * s, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawWorld(){
  drawSky();
  drawGround();
  const list = objs.filter(o => o.z < FAR + 2);
  list.push({ type: 'player', z: PZ });
  list.sort((a, b) => b.z - a.z);
  for (const o of list){
    if (o.type === 'player'){ if (state !== 'title' || true) drawPlayer(); continue; }
    const a = fogAlpha(o.z);
    if (a <= 0.01) continue;
    ctx.globalAlpha = a;
    if (o.type === 'tree') drawTree(o);
    else if (o.type === 'rock') drawRock(o);
    else if (o.type === 'frost') drawFrost(o);
    else if (o.type === 'ramp') drawRamp(o);
    else if (o.type === 'gift') drawGift(o);
    ctx.globalAlpha = 1;
  }
  // particles
  for (const p of parts){
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r);
  }
  ctx.globalAlpha = 1;
  // falling snow
  ctx.fillStyle = env.night > .5 ? 'rgba(210,235,255,.85)' : 'rgba(255,255,255,.9)';
  for (const f of flakes){
    const r = .8 + f.d * 2.4;
    ctx.globalAlpha = .35 + f.d * .6;
    ctx.beginPath(); ctx.arc(f.x, f.y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;
  // speed vignette
  const sv = clamp((speed - 20) / 30, 0, 1);
  const vg = ctx.createRadialGradient(W / 2, H * .55, Math.min(W, H) * .35, W / 2, H * .55, Math.max(W, H) * .8);
  vg.addColorStop(0, 'rgba(5,10,40,0)'); vg.addColorStop(1, 'rgba(5,10,40,' + (.25 + sv * .25 + env.night * .15).toFixed(3) + ')');
  ctx.fillStyle = vg; ctx.fillRect(-20, -20, W + 40, H + 40);
}

/* ---------- drawing: UI ---------- */
const FONT = 'system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function text(str, x, y, size, color, glow, align, weight){
  ctx.font = (weight || 800) + ' ' + size + 'px ' + FONT;
  ctx.textAlign = align || 'center';
  ctx.textBaseline = 'middle';
  if (glow){ ctx.shadowColor = glow; ctx.shadowBlur = size * .5; }
  ctx.fillStyle = color;

  requestAnimationFrame(frame);
  let dt = (now - last) / 1000; last = now;

<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>

    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };

    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
