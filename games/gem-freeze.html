<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060a1f">
<title>Gem Freeze</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;overflow:hidden;background:#060a1f;color:#e8f7ff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;touch-action:none;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit}
#hud{position:absolute;left:0;right:0;top:0;z-index:6;padding:calc(env(safe-area-inset-top) + 8px) 12px 0;max-width:640px;margin:0 auto;pointer-events:none}
body:not(.ingame) #hud .game-only{visibility:hidden}
.hrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
#lvlName{font-weight:900;letter-spacing:.2em;font-size:16px;color:#cdf3ff;text-shadow:0 0 12px rgba(120,210,255,.7)}
.ibtn{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:1px solid rgba(150,220,255,.35);background:rgba(15,30,70,.6);color:#cdf3ff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 14px rgba(90,170,255,.2) inset}
.ibtn:active{transform:scale(.93)}
.ibtn svg{width:21px;height:21px}
.hrow2{display:flex;align-items:stretch;gap:8px;margin-top:8px}
.box{background:linear-gradient(180deg,rgba(40,70,140,.55),rgba(12,22,55,.7));border:1px solid rgba(150,220,255,.3);border-radius:14px;padding:6px 10px;display:flex;flex-direction:column;justify-content:center;line-height:1}
.lbl{font-size:10px;letter-spacing:.2em;font-weight:800;color:#8fd3ff}
.movesBox{align-items:center;min-width:66px}
#moves{font-size:28px;font-weight:900;color:#fff;text-shadow:0 0 12px rgba(120,220,255,.8);font-variant-numeric:tabular-nums}
#moves.low{color:#ff8fa8;text-shadow:0 0 12px rgba(255,90,130,.9);animation:pulse .8s infinite}
.scoreBox{flex:1;min-width:0}
.srow{display:flex;align-items:baseline;gap:6px}
#score{font-size:22px;font-weight:900;color:#fff;font-variant-numeric:tabular-nums}
.tgt{font-size:12px;color:#9fd6ff;font-weight:700}
.bar{position:relative;height:10px;border-radius:6px;background:rgba(0,0,0,.4);margin-top:6px;overflow:visible;box-shadow:0 0 0 1px rgba(150,220,255,.2) inset}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:6px;background:linear-gradient(90deg,#3ad7ff,#9b7bff,#ff6fcf);box-shadow:0 0 10px rgba(120,200,255,.8);transition:width .3s}
.st{position:absolute;top:50%;width:16px;height:16px;transform:translate(-50%,-50%);color:rgba(255,255,255,.25);font-style:normal;font-size:15px;line-height:16px;text-align:center;text-shadow:0 0 4px #000}
.st.on{color:#ffe066;text-shadow:0 0 8px #ffcc33}
.iceBox{align-items:center;min-width:56px}
#iceLeft{font-size:22px;font-weight:900;color:#c9f3ff}
.iceBox.done #iceLeft{color:#7dffb8}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:radial-gradient(ellipse at 50% 40%,rgba(30,40,110,.6),rgba(4,6,22,.92));z-index:5;transition:opacity .3s ease;text-align:center;padding:calc(env(safe-area-inset-top) + 60px) 18px 24px}
.overlay.hidden{opacity:0;pointer-events:none}
.logo{font-size:clamp(46px,13vw,100px);font-weight:900;line-height:.92;letter-spacing:.03em;background:linear-gradient(180deg,#fff 0%,#c4e9ff 35%,#8f7bff 70%,#ff74d4 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px rgba(140,140,255,.55));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
@keyframes pulse{50%{transform:scale(1.1)}}
.sub{color:#a9d8ff;font-size:15px;max-width:340px;line-height:1.45}
.big-btn{pointer-events:auto;font-size:21px;font-weight:900;letter-spacing:.12em;color:#140a33;padding:15px 44px;border-radius:999px;border:none;cursor:pointer;background:linear-gradient(180deg,#ffffff,#a7e6ff 50%,#8c7bff);box-shadow:0 0 0 2px rgba(255,255,255,.35) inset,0 0 30px rgba(130,150,255,.7),0 8px 22px rgba(0,0,0,.45);transition:transform .12s}
.big-btn:active{transform:scale(.95)}
.ghost-btn{pointer-events:auto;font-size:15px;font-weight:800;letter-spacing:.1em;color:#cde8ff;padding:10px 24px;border-radius:999px;border:1px solid rgba(160,200,255,.45);background:rgba(20,30,70,.55);cursor:pointer}
.btnrow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:center}
.panel{background:linear-gradient(180deg,rgba(45,60,140,.6),rgba(12,16,50,.8));border:1px solid rgba(160,200,255,.35);border-radius:24px;padding:22px 30px;box-shadow:0 0 40px rgba(110,120,255,.3);min-width:260px;max-width:92vw}
.panel h2{font-size:30px;font-weight:900;letter-spacing:.06em;color:#e6f3ff;text-shadow:0 0 16px rgba(130,160,255,.9);margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:30px;font-size:16px;color:#a9d0ff;margin:6px 0}
.row b{color:#fff;font-size:21px;font-variant-numeric:tabular-nums}
.goal{font-size:17px;color:#dff2ff;margin:8px 0;line-height:1.5}
.goal b{color:#fff}
.bigstars{font-size:46px;letter-spacing:6px;margin:4px 0 8px}
.bigstars span{color:rgba(255,255,255,.18);display:inline-block}
.bigstars span.on{color:#ffe066;text-shadow:0 0 16px #ffc933;animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1)}}
.newbest{display:inline-block;margin-top:8px;padding:5px 14px;border-radius:999px;background:linear-gradient(90deg,#ff7ad9,#7fe9ff);color:#160a30;font-weight:900;font-size:13px;letter-spacing:.15em;animation:pulse 1s ease-in-out infinite}
#map{justify-content:flex-start}
.maphead{display:flex;align-items:center;justify-content:space-between;width:100%;max-width:520px}
.maphead h2{font-size:22px;letter-spacing:.18em;font-weight:900;color:#dbeeff;text-shadow:0 0 14px rgba(140,160,255,.8)}
.totstars{color:#ffe066;font-weight:900;font-size:16px}
#levels{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(8px,2.4vw,14px);width:100%;max-width:520px;flex:1;align-content:center;min-height:0}
@media (orientation:landscape){#levels{grid-template-columns:repeat(8,1fr);max-width:900px}.maphead{max-width:900px}}
.lv{pointer-events:auto;position:relative;aspect-ratio:1/1;max-height:12vh;justify-self:center;width:100%;max-width:96px;border-radius:22%;border:1px solid rgba(170,220,255,.45);background:radial-gradient(circle at 35% 30%,rgba(190,235,255,.55),rgba(60,110,220,.55) 45%,rgba(25,35,95,.85));color:#fff;font-weight:900;font-size:clamp(17px,5vw,24px);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;box-shadow:0 0 16px rgba(110,170,255,.35),0 0 0 2px rgba(255,255,255,.08) inset;text-shadow:0 2px 4px rgba(0,0,0,.5);padding:0}
@media (orientation:landscape){.lv{max-height:18vh}}
.lv:active{transform:scale(.94)}
.lv .s{font-size:clamp(9px,2.6vw,12px);letter-spacing:1px;color:rgba(255,255,255,.25);margin-top:2px}
.lv .s .on{color:#ffe066}
.lv.locked{background:rgba(30,40,80,.6);color:rgba(200,220,255,.35);box-shadow:none;cursor:default}
.lv.locked svg{width:40%;height:40%;opacity:.5}
.lv.current{animation:glow 1.4s ease-in-out infinite;border-color:#fff}
@keyframes glow{50%{box-shadow:0 0 28px rgba(150,220,255,.9),0 0 0 2px rgba(255,255,255,.3) inset}}
.lv .ice{position:absolute;top:-5px;right:-5px;font-size:13px;width:20px;height:20px;border-radius:50%;background:#bdeeff;color:#1b3f7a;display:grid;place-items:center;font-weight:900;text-shadow:none}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div class="hrow">
    <button class="ibtn game-only" id="menuBtn" aria-label="Level map"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></button>
    <div id="lvlName" class="game-only">LEVEL 1</div>
    <button class="ibtn" id="mute" aria-label="Toggle sound"></button>
  </div>
  <div class="hrow2 game-only">
    <div class="box movesBox"><span class="lbl">MOVES</span><span id="moves">0</span></div>
    <div class="box scoreBox">
      <div class="srow"><span id="score">0</span><span class="tgt" id="target">/ 0</span></div>
      <div class="bar"><div class="fill" id="fill"></div><i class="st" id="st1">&#9733;</i><i class="st" id="st2">&#9733;</i><i class="st" id="st3">&#9733;</i></div>
    </div>
    <div class="box iceBox" id="iceBox"><span class="lbl">ICE</span><span id="iceLeft">0</span></div>
  </div>
</div>

<div class="overlay" id="title">
  <div class="logo">GEM<br>FREEZE</div>
  <div class="sub">Swap frozen gems to line up three or more. Make big matches for power gems and thaw the ice!</div>
  <button class="big-btn" id="playBtn">PLAY</button>
</div>

<div class="overlay hidden" id="map">
  <div class="maphead">
    <button class="ghost-btn" id="mapBack">&#8249; BACK</button>
    <h2>LEVELS</h2>
    <span class="totstars" id="totStars">&#9733; 0</span>
  </div>
  <div id="levels"></div>
</div>

<div class="overlay hidden" id="intro">
  <div class="panel">
    <h2 id="introTitle">LEVEL 1</h2>
    <div class="goal" id="introGoal"></div>
    <div class="row"><span>Best</span><b id="introBest">-</b></div>
  </div>
  <div class="btnrow">
    <button class="ghost-btn" id="introBack">MAP</button>
    <button class="big-btn" id="introGo">START</button>
  </div>
</div>

<div class="overlay hidden" id="win">
  <div class="panel">
    <h2>LEVEL CLEAR!</h2>
    <div class="bigstars" id="winStars"></div>
    <div class="row"><span>Score</span><b id="winScore">0</b></div>
    <div class="row"><span>Best</span><b id="winBest">0</b></div>
    <div id="winNew"></div>
  </div>
  <div class="btnrow">
    <button class="ghost-btn" id="winMap">MAP</button>
    <button class="ghost-btn" id="winRetry">REPLAY</button>
    <button class="big-btn" id="winNext">NEXT</button>
  </div>
</div>

<div class="overlay hidden" id="fail">
  <div class="panel">
    <h2>OUT OF MOVES</h2>
    <div class="goal" id="failWhy"></div>
    <div class="row"><span>Score</span><b id="failScore">0</b></div>
    <div class="row"><span>Best</span><b id="failBest">0</b></div>
  </div>
  <div class="btnrow">
    <button class="ghost-btn" id="failMap">MAP</button>
    <button class="big-btn" id="failRetry">RETRY</button>
  </div>
</div>

<script>
(() => {
'use strict';
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);

/* ================= LOGIC (DOM-free) ================= */
/*LOGIC-START*/
const R = 8, C = 8, NT = 6;
const SP_H = 1, SP_V = 2, SP_BOMB = 3, SP_COLOR = 4;
const PTS_GEM = 20, PTS_ICE = 40;
let gemId = 1;
function newGem(t, sp) { return { t, sp: sp || 0, id: gemId++, x: 0, y: 0, vy: 0, tw: null, land: -9, born: -9 }; }
function rndType() { return (Math.random() * NT) | 0; }
function key(r, c) { return r * C + c; }
function same(a, b) { return !!(a && b && a.sp !== SP_COLOR && b.sp !== SP_COLOR && a.t === b.t); }
function inB(r, c) { return r >= 0 && c >= 0 && r < R && c < C; }

function makeBoard() {
  for (let tries = 0; tries < 500; tries++) {
    const g = [];
    for (let r = 0; r < R; r++) {
      const row = [];
      for (let c = 0; c < C; c++) {
        let t;
        do { t = rndType(); } while ((c >= 2 && row[c - 1].t === t && row[c - 2].t === t) || (r >= 2 && g[r - 1][c].t === t && g[r - 2][c].t === t));
        const gm = newGem(t); gm.x = c; gm.y = r; row.push(gm);
      }
      g.push(row);
    }
    if (findMove(g)) return g;
  }
  return null;
}
function findRuns(g) {
  const runs = [];
  for (let r = 0; r < R; r++) {
    let c = 0;
    while (c < C) {
      let e = c + 1;
      while (e < C && same(g[r][c], g[r][e])) e++;
      if (e - c >= 3) { const cells = []; for (let k = c; k < e; k++) cells.push([r, k]); runs.push({ cells, dir: 'h' }); }
      c = e;
    }
  }
  for (let c = 0; c < C; c++) {
    let r = 0;
    while (r < R) {
      let e = r + 1;
      while (e < R && same(g[r][c], g[e][c])) e++;
      if (e - r >= 3) { const cells = []; for (let k = r; k < e; k++) cells.push([k, c]); runs.push({ cells, dir: 'v' }); }
      r = e;
    }
  }
  return runs;
}
function findGroups(g) {
  const runs = findRuns(g);
  const parent = runs.map((_, i) => i);
  const find = i => parent[i] === i ? i : (parent[i] = find(parent[i]));
  const owner = new Map();
  runs.forEach((run, i) => run.cells.forEach(([r, c]) => {
    const k = key(r, c);
    if (owner.has(k)) parent[find(i)] = find(owner.get(k)); else owner.set(k, i);
  }));
  const groups = new Map();
  runs.forEach((run, i) => {
    const root = find(i);
    if (!groups.has(root)) groups.set(root, { runs: [], cells: new Map() });
    const gp = groups.get(root);
    gp.runs.push(run);
    run.cells.forEach(([r, c]) => gp.cells.set(key(r, c), [r, c]));
  });
  return [...groups.values()];
}
function hasMatchAt(g, r, c) {
  const gm = g[r][c]; if (!gm || gm.sp === SP_COLOR) return false;
  let n = 1, k = c - 1; while (k >= 0 && same(gm, g[r][k])) { n++; k--; }
  k = c + 1; while (k < C && same(gm, g[r][k])) { n++; k++; }
  if (n >= 3) return true;
  n = 1; k = r - 1; while (k >= 0 && same(gm, g[k][c])) { n++; k--; }
  k = r + 1; while (k < R && same(gm, g[k][c])) { n++; k++; }
  return n >= 3;
}
function isComboPair(A, B) { return !!(A && B && (A.sp === SP_COLOR || B.sp === SP_COLOR || (A.sp && B.sp))); }
function swapCells(g, a, b) { const t = g[a[0]][a[1]]; g[a[0]][a[1]] = g[b[0]][b[1]]; g[b[0]][b[1]] = t; }
function findMove(g) {
  const dirs = [[0, 1], [1, 0]];
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) for (const [dr, dc] of dirs) {
    const r2 = r + dr, c2 = c + dc;
    if (!inB(r2, c2) || !g[r][c] || !g[r2][c2]) continue;
    if (isComboPair(g[r][c], g[r2][c2])) return [[r, c], [r2, c2]];
    swapCells(g, [r, c], [r2, c2]);
    const ok = hasMatchAt(g, r, c) || hasMatchAt(g, r2, c2);
    swapCells(g, [r, c], [r2, c2]);
    if (ok) return [[r, c], [r2, c2]];
  }
  return null;
}
function mostCommonType(g) {
  const cnt = new Array(NT).fill(0);
  for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const gm = g[r][c]; if (gm && gm.sp !== SP_COLOR) cnt[gm.t]++; }
  let best = 0; for (let i = 1; i < NT; i++) if (cnt[i] > cnt[best]) best = i;
  return best;
}
// expand special-gem detonations inside a clear set
function expand(g, clear, effects, triggered) {
  const queue = [...clear.values()];
  const add = (r, c) => { if (!inB(r, c)) return; const k = key(r, c); if (!clear.has(k)) { clear.set(k, [r, c]); queue.push([r, c]); } };
  while (queue.length) {
    const [r, c] = queue.pop();
    const gm = g[r][c];
    if (!gm || !gm.sp || triggered.has(gm.id)) continue;
    triggered.add(gm.id);
    if (gm.sp === SP_H) { effects.push({ k: 'row', r, c }); for (let x = 0; x < C; x++) add(r, x); }
    else if (gm.sp === SP_V) { effects.push({ k: 'col', r, c }); for (let y = 0; y < R; y++) add(y, c); }
    else if (gm.sp === SP_BOMB) { effects.push({ k: 'blast', r, c, rad: 1 }); for (let dr = -1; dr <= 1; dr++) for (let dc = -1; dc <= 1; dc++) add(r + dr, c + dc); }
    else if (gm.sp === SP_COLOR) {
      const t = mostCommonType(g), targets = [];
      for (let y = 0; y < R; y++) for (let x = 0; x < C; x++) { const o = g[y][x]; if (o && o.sp !== SP_COLOR && o.t === t) { targets.push([y, x]); } }
      effects.push({ k: 'color', r, c, targets });
      targets.forEach(([y, x]) => add(y, x));
    }
  }
}
function planMatches(g, prefer) {
  const groups = findGroups(g);
  if (!groups.length) return null;
  const clear = new Map(), creations = [];
  for (const gp of groups) {
    let longest = gp.runs[0], hasH = false, hasV = false;
    gp.runs.forEach(rn => { if (rn.cells.length > longest.cells.length) longest = rn; if (rn.dir === 'h') hasH = true; else hasV = true; });
    const maxLen = longest.cells.length;
    let pos = null;
    if (prefer) for (const p of prefer) if (gp.cells.has(key(p[0], p[1]))) pos = p;
    if (!pos && hasH && hasV) {
      const hs = new Set(), vs = new Set();
      gp.runs.forEach(rn => rn.cells.forEach(([r, c]) => (rn.dir === 'h' ? hs : vs).add(key(r, c))));
      for (const k of hs) if (vs.has(k)) { pos = gp.cells.get(k); break; }
    }
    if (!pos) pos = longest.cells[Math.floor(longest.cells.length / 2)];
    const t = g[pos[0]][pos[1]].t;
    let sp = 0;
    if (maxLen >= 5) sp = SP_COLOR;
    else if (hasH && hasV) sp = SP_BOMB;
    else if (maxLen === 4) sp = longest.dir === 'h' ? SP_H : SP_V;
    gp.cells.forEach((v, k) => clear.set(k, v));
    if (sp) creations.push({ r: pos[0], c: pos[1], t: sp === SP_COLOR ? -1 : t, sp });
  }
  const effects = [];
  expand(g, clear, effects, new Set());
  return { clear, creations, effects };
}
// swap combos: pa = where the moved gem now sits (centre), pb = the other cell
function planCombo(g, pa, pb) {
  const A = g[pa[0]][pa[1]], B = g[pb[0]][pb[1]];
  if (!isComboPair(A, B)) return null;
  const clear = new Map(), effects = [], triggered = new Set([A.id, B.id]);
  const add = (r, c) => { if (inB(r, c)) clear.set(key(r, c), [r, c]); };
  add(pa[0], pa[1]); add(pb[0], pb[1]);
  const ca = A.sp === SP_COLOR, cb = B.sp === SP_COLOR;
  let convert = false;
  if (ca && cb) {
    effects.push({ k: 'nova', r: pa[0], c: pa[1] });
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) add(r, c);
  } else if (ca || cb) {
    const other = ca ? B : A, cpos = ca ? pa : pb, t = other.t, targets = [];
    for (let r = 0; r < R; r++) for (let c = 0; c < C; c++) { const o = g[r][c]; if (o && o !== other && o.sp !== SP_COLOR && o.t === t) targets.push([r, c]); }
    effects.push({ k: 'color', r: cpos[0], c: cpos[1], targets });
    if (other.sp) {
      convert = true;
      targets.forEach(([r, c]) => { const o = g[r][c]; if (!o.sp) o.sp = other.sp === SP_BOMB ? SP_BOMB : (Math.random() < 0.5 ? SP_H : SP_V); });
      triggered.delete(other.id);
    }
    targets.forEach(([r, c]) => add(r, c));
  } else {
    const bombs = (A.sp === SP_BOMB) + (B.sp === SP_BOMB);
    const [r0, c0] = pa;
    if (bombs === 2) {
      effects.push({ k: 'blast', r: r0, c: c0, rad: 2 });
      for (let dr = -2; dr <= 2; dr++) for (let dc = -2; dc <= 2; dc++) add(r0 + dr, c0 + dc);
    } else if (bombs === 1) {
      for (let d = -1; d <= 1; d++) {
        if (inB(r0 + d, 0)) { effects.push({ k: 'row', r: r0 + d, c: c0 }); for (let x = 0; x < C; x++) add(r0 + d, x); }
        if (inB(0, c0 + d)) { effects.push({ k: 'col', r: r0, c: c0 + d }); for (let y = 0; y < R; y++) add(y, c0 + d); }
      }
    } else {
      effects.push({ k: 'row', r: r0, c: c0 }, { k: 'col', r: r0, c: c0 });
      for (let x = 0; x < C; x++) add(r0, x);
      for (let y = 0; y < R; y++) add(y, c0);
    }
  }
  expand(g, clear, effects, triggered);
  return { clear, creations: [], effects, convert };
}
function applyClear(g, ice, plan, mult) {
  const removed = [], iceBroken = [];

document.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('contextmenu', e => e.preventDefault());

layout();
show('title');
requestAnimationFrame(frame);
})();

<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>

    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };

  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
</body>
</html>
