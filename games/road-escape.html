<style>

.stars{font-size:46px;letter-spacing:.12em;margin:2px 0 4px;color:#3a4458;text-shadow:0 3px 0 rgba(0,0,0,.4)}
.stars span{display:inline-block;transition:transform .3s}
.stars span.got{color:#ffd84a;text-shadow:0 0 18px rgba(255,210,70,.6),0 3px 0 #8a5a00;animation:starIn .5s cubic-bezier(.2,1.6,.4,1) both}

.earn{font-weight:900;color:#ffd84a;font-size:18px;margin:4px 0 10px}

.gname{font-weight:900;font-size:22px;font-style:italic;color:#fff;margin:8px 0 2px;text-transform:uppercase}
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin:10px 0}
.carb{font-family:inherit;background:rgba(255,255,255,.05);border:2px solid rgba(255,255,255,.12);border-radius:12px;color:#dfe8f5;padding:8px;cursor:pointer;touch-action:manipulation;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:12px}

.carb.on{border-color:#5fd8ff;background:rgba(95,216,255,.12)}
.carb .pr{color:#ffd84a}
.carb .eq{color:#7dffa0}
.ups{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.up{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.05);border-radius:12px;padding:8px 10px;text-align:left}

.pips i.f{background:linear-gradient(#9ff0ff,#3ab7e8)}
.ubuy{font-family:inherit;font-weight:800;font-size:13px;border:0;border-radius:10px;padding:8px 10px;min-width:74px;cursor:pointer;background:linear-gradient(#ffe08a,#ff9a3c);color:#1b0c02;touch-action:manipulation}
.ubuy[disabled]{background:#2a3348;color:#7d8aa3;cursor:default}
.gmsg{min-height:20px;font-weight:700;color:#9ff0ff;font-size:13px}
</style>

<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const cv=$('c'),ctx=cv.getContext('2d');
const dk=document.createElement('canvas'),dctx=dk.getContext('2d');
let VW=1,VH=1,DPR=1,Z=1,baseZ=1;
const TS=96,PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const angDiff=(a,b)=>{let d=(a-b)%TAU;if(d>PI)d-=TAU;if(d<-PI)d+=TAU;return d;};
const hash=(x,y,s)=>{let h=(x*374761393+y*668265263+(s||0)*974634251)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296;};
const rnd=(a,b)=>a+Math.random()*(b-a);
function rr(g,x,y,w,h,r){r=Math.min(r,w/2,h/2);g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function seeded(seed){let s=seed>>>0;return()=>{s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}
const SHC=new Map();
function shade(hex,f){const k=hex+f;let v=SHC.get(k);if(v)return v;const n=parseInt(hex.slice(1),16);let r=n>>16,g=n>>8&255,b=n&255;
 if(f<0){r*=1+f;g*=1+f;b*=1+f;}else{r+=(255-r)*f;g+=(255-g)*f;b+=(255-b)*f;}v='rgb('+(r|0)+','+(g|0)+','+(b|0)+')';SHC.set(k,v);return v;}
const AUTO=/[?&]auto=1/.test(location.search);

// ---------- save ----------
const SKEY='blizzard_roadescape';
function defSave(){return{v:2,done:{},stars:{},bestTime:{},best:{},coins:0,owned:['comet'],car:'comet',up:{hand:0,tough:0,tank:0},muted:false,ctl:'buttons'};}
let save=defSave();
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&typeof s==='object'){for(const k in save)if(s[k]!==undefined&&s[k]!==null)save[k]=s[k];}}catch(e){}
(function sanitize(){const d=defSave();
 for(const k of['done','stars','bestTime','best'])if(typeof save[k]!=='object'||Array.isArray(save[k]))save[k]={};
 if(!Array.isArray(save.owned))save.owned=['comet'];if(save.owned.indexOf('comet')<0)save.owned.push('comet');
 if(typeof save.up!=='object')save.up=d.up;for(const k of['hand','tough','tank'])save.up[k]=clamp(parseInt(save.up[k],10)||0,0,3);
 save.coins=Math.max(0,Math.floor(+save.coins||0));if(save.ctl!=='stick')save.ctl='buttons';
 if(save.owned.indexOf(save.car)<0)save.car='comet';})();
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(save));}catch(e){}}
let chN=1,linkedCh=0;
try{const n=parseInt(new URLSearchParams(location.search).get('ch'),10);if(n>=1&&n<=3){chN=n;linkedCh=n;}}catch(e){}
const unlocked=n=>n===1||!!save.done[n-1]||!!save.done[n]||n===linkedCh;

// ---------- audio ----------
const AU={c:null,m:null,muted:!!save.muted,L:null};
function audioInit(){
 if(AU.c){if(AU.c.state==='suspended'&&!document.hidden){try{AU.c.resume();}catch(e){}}return;}
 try{
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  const c=new A();AU.c=c;AU.m=c.createGain();AU.m.gain.value=AU.muted?0:.9;
  const comp=c.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=4;AU.m.connect(comp);comp.connect(c.destination);
  const L={};
  const mk=(type,f)=>{const o=c.createOscillator();o.type=type;o.frequency.value=f;o.start();return o;};
  const gn=v=>{const g=c.createGain();g.gain.value=v;return g;};
  // engine: soft triangle + sine through a lowpass, no buzz
  L.e1=mk('triangle',50);L.e2=mk('sine',100);L.ef=c.createBiquadFilter();L.ef.type='lowpass';L.ef.frequency.value=360;L.ef.Q.value=.2;L.eg=gn(0);
  L.e1.connect(L.ef);L.e2.connect(L.ef);L.ef.connect(L.eg);L.eg.connect(AU.m);
  // nitro hum
  L.n1=mk('sine',330);L.ng=gn(0);L.n1.connect(L.ng);L.ng.connect(AU.m);
  // drift: gentle sine with vibrato
  L.s1=mk('sine',720);const sv=mk('sine',7),svg=gn(30);sv.connect(svg);svg.connect(L.s1.frequency);L.sg=gn(0);L.s1.connect(L.sg);L.sg.connect(AU.m);
  // siren (two-tone set from code)
  L.si=mk('sine',700);L.sig=gn(0);L.si.connect(L.sig);L.sig.connect(AU.m);
  // helicopter: low sine, amplitude wobble
  L.h1=mk('sine',62);const ham=gn(.5),hl=mk('sine',11),hlg=gn(.5);hl.connect(hlg);hlg.connect(ham.gain);L.h1.connect(ham);L.hg=gn(0);ham.connect(L.hg);L.hg.connect(AU.m);
  AU.L=L;
 }catch(e){AU.c=null;}
}
function setMute(m){AU.muted=m;save.muted=m;persist();try{if(AU.m)AU.m.gain.setTargetAtTime(m?0:.9,AU.c.currentTime,.05);}catch(e){}
 $('sndW').style.display=m?'none':'';$('sndX').style.display=m?'':'none';}
function setG(g,v,tc){if(!AU.c||!g)return;try{g.gain.setTargetAtTime(v,AU.c.currentTime,tc||.08);}catch(e){}}
function setF(p,v,tc){if(!AU.c||!p)return;try{p.setTargetAtTime(v,AU.c.currentTime,tc||.06);}catch(e){}}
function tone(type,f0,f1,dur,vol,delay,att){if(!AU.c||AU.muted)return;try{const c=AU.c,t=c.currentTime+(delay||0);
 const o=c.createOscillator(),g=c.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
 const a=att||Math.min(.018,dur/4);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(AU.m);o.start(t);o.stop(t+dur+.05);}catch(e){}}
const T=(f0,f1,d,v,dl)=>tone('triangle',f0,f1,d,v,dl),S=(f0,f1,d,v,dl)=>tone('sine',f0,f1,d,v,dl);
let lastCoinT=0,coinStep=0;
const sfx={
 coin(){const n=performance.now();coinStep=n-lastCoinT<400?Math.min(coinStep+1,6):0;lastCoinT=n;const f=1175*Math.pow(1.06,coinStep);T(f,null,.07,.045);T(f*1.5,null,.12,.04,.05);},
 nitroPick(){T(523,1047,.2,.06);T(784,1568,.22,.045,.06);},
 repair(){[523,659,784,1047].forEach((f,i)=>T(f,null,.15,.055,i*.06));},
 crash(v){v=clamp(v,.03,.12);S(190,80,.25,v);T(300,200,.12,v*.4);T(1400,1100,.05,v*.12,.01);},
 thump(v){S(210,150,.09,clamp(v,.015,.05));},
 scrape(){T(1600,1400,.05,.01);},
 boost(){S(260,880,.32,.07);T(520,1400,.28,.03,.04);},
 pop(){T(880,330,.2,.06);S(440,220,.25,.05,.05);},
 splash(){for(let i=0;i<6;i++)S(1100-i*90,700-i*60,.09,.045,i*.06);},
 jump(){T(392,880,.35,.06);S(784,1568,.3,.03,.05);},
 land(){S(250,170,.16,.08);},
 gate(){T(660,990,.1,.06);T(1320,null,.14,.045,.07);},
 wreck(){S(320,110,.32,.07);[1047,1319,1568,2093].forEach((f,i)=>T(f,null,.12,.04,.08+i*.06));},
 heat(){S(880,null,.12,.055);S(660,null,.18,.055,.15);S(880,null,.12,.04,.3);},
 beep(){S(880,null,.09,.055);},
 go(){T(1319,null,.3,.065);S(1760,null,.25,.03,.04);},
 check(){[784,988,1175,1568].forEach((f,i)=>T(f,null,.16,.055,i*.07));},
 buy(){[1047,1319,1568,2093].forEach((f,i)=>T(f,null,.12,.05,i*.05));},
 nope(){S(330,262,.18,.05);},
 click(){T(1200,null,.04,.025);},
 tock(){S(640,460,.06,.025);},

 hidden(){S(1319,784,.3,.04);},
 drift(){T(988,1480,.16,.03);},
 roadblock(){S(587,null,.1,.04);S(587,null,.1,.04,.18);},

 lose(){[784,659,523,392].forEach((f,i)=>T(f,f*.98,.3,.055,i*.15));},

};

// ---------- chapters, cars, upgrades ----------
const CH={
 1:{name:'Garage Break-Out',goal:'Reach the docks',par:85,hounds:[2,3,4],hspd:[430,455,480],heatRate:.016,heli:0,night:0,dusk:0,

const CARS=[

function genMap(n){
 const R=seeded(4242+n*131);
 const M={n,W:0,H:0,g:null,lots:[],props:[],knock:[],lamps:[],stages:[],start:[0,0],startA:0,hounds:[],elev:[],tunnels:[],over:[]};
 M.lotAt=(x,y)=>{for(const L of M.lots)if(x>=L.x&&y>=L.y&&x<L.x+L.w&&y<L.y+L.h)return L;return null;};
 if(n===2)genHighway(M,R);else genCity(M,R,n);
 M.base=M.g.map(r=>r.slice());
 M.lotGrid=new Uint8Array(M.W*M.H);for(const L of M.lots)for(let j=L.y;j<L.y+L.h;j++)for(let i=L.x;i<L.x+L.w;i++)if(i>=0&&j>=0&&i<M.W&&j<M.H)M.lotGrid[j*M.W+i]=1;
 M.pg=new Array(M.W*M.H);
 for(const p of M.props){if(p.solid===false)continue;const ex=(p.r||Math.max(p.hw,p.hh))+2;
  for(let y=Math.floor((p.y-ex)/TS);y<=Math.floor((p.y+ex)/TS);y++)for(let x=Math.floor((p.x-ex)/TS);x<=Math.floor((p.x+ex)/TS);x++){
   if(x<0||y<0||x>=M.W||y>=M.H)continue;const k=y*M.W+x;(M.pg[k]||(M.pg[k]=[])).push(p);}}
 M.pcost=new Float32Array(M.W*M.H);for(let k=0;k<M.pg.length;k++){const l=M.pg[k];if(!l)continue;let c=0;for(const p of l)c+=(p.t==='tree'||p.t==='lamp'||p.small)?.4:6;M.pcost[k]=Math.min(12,c);}
 return M;
}

// ---------- state ----------
let C=null,M=null,G=null,player=null;
let mode='title';
const cam={x:0,y:0,lx:0,ly:0};
const keys={};let isTouch=false;
const DX8=[1,-1,0,0,1,1,-1,-1],DY8=[0,0,1,-1,1,-1,1,-1];
function tile(x,y){return(x>=0&&y>=0&&x<M.W&&y<M.H)?M.g[y][x]:'#';}
function tileAt(px,py){return tile(Math.floor(px/TS),Math.floor(py/TS));}
function flowOK(c){if(SOLID.has(c)||c==='w'||c==='W'||c==='M')return false;if(c==='g'&&M.hw)return false;return true;}
function isCover(x,y){return tileAt(x,y)==='u';}
function propHit(px,py,r,cb){const tx=Math.floor(px/TS),ty=Math.floor(py/TS);if(tx<0||ty<0||tx>=M.W||ty>=M.H)return;const L=M.pg[ty*M.W+tx];if(!L)return;
 for(const p of L){if(p.down)continue;if(p.r){const dx=px-p.x,dy=py-p.y,d=Math.hypot(dx,dy);if(d<r+p.r)cb(p,d>.01?dx/d:1,d>.01?dy/d:0,r+p.r-d);}
  else{const qx=clamp(px,p.x-p.hw,p.x+p.hw),qy=clamp(py,p.y-p.hh,p.y+p.hh);let dx=px-qx,dy=py-qy,d=Math.hypot(dx,dy);
   if(d<r){if(d<.01){const ox=px-p.x,oy=py-p.y;if(Math.abs(ox)/p.hw>Math.abs(oy)/p.hh)cb(p,Math.sign(ox)||1,0,p.hw-Math.abs(ox)+r);else cb(p,0,Math.sign(oy)||1,p.hh-Math.abs(oy)+r);}
    else cb(p,dx/d,dy/d,r-d);}}}}
function solidAt(x,y){const c=tileAt(x,y);if(SOLID.has(c)||c==='w'||c==='W'||c==='M')return true;let hit=false;propHit(x,y,4,()=>{hit=true;});return hit;}
function losClear(x0,y0,x1,y1,rad){const d=Math.hypot(x1-x0,y1-y0),n=Math.ceil(d/32);const px=rad?-(y1-y0)/(d||1)*rad:0,py=rad?(x1-x0)/(d||1)*rad:0;
 for(let i=1;i<n;i++){const x=lerp(x0,x1,i/n),y=lerp(y0,y1,i/n);if(solidAt(x,y))return false;if(rad&&(solidAt(x+px,y+py)||solidAt(x-px,y-py)))return false;}return true;}
function onScreen(x,y,m){m=m||80;return Math.abs((x-cam.x)*Z)<VW/2+m&&Math.abs((y-cam.y)*Z)<VH/2+m;}

// ---------- routing ----------
function routePass(x,y){const c=tile(x,y);if(c==='G')return true;if(SOLID.has(c)||c==='w'||c==='M')return false;if(c==='W')return!!M.rampOpen;if(c==='g'&&M.hw)return false;return true;}
function routeCost(x,y){const c=M.g[y][x];return M.pcost[y*M.W+x]+(c==='x'?8:c==='.'?1.7:c==='g'?2.5:c==='p'||c==='q'?1.2:1);}
function dijkstra(seeds){const W=M.W,N=W*M.H,D=new Float64Array(N).fill(1e9),hk=[],hd=[];
 const push=(k,d)=>{hk.push(k);hd.push(d);let i=hk.length-1;while(i>0){const p=(i-1)>>1;if(hd[p]<=hd[i])break;let t=hk[p];hk[p]=hk[i];hk[i]=t;t=hd[p];hd[p]=hd[i];hd[i]=t;i=p;}};
 const pop=()=>{const k=hk[0],d=hd[0],lk=hk.pop(),ld=hd.pop();if(hk.length){hk[0]=lk;hd[0]=ld;let i=0;for(;;){const l=2*i+1,r=l+1;let m=i;if(l<hk.length&&hd[l]<hd[m])m=l;if(r<hk.length&&hd[r]<hd[m])m=r;if(m===i)break;let t=hk[m];hk[m]=hk[i];hk[i]=t;t=hd[m];hd[m]=hd[i];hd[i]=t;i=m;}}popK=k;return d;};
 let popK=0;
 for(const k of seeds){D[k]=0;push(k,0);}
 while(hk.length){const d=pop(),c=popK;if(d>D[c])continue;const cx=c%W,cy=(c/W)|0;
  for(let k=0;k<4;k++){const nx=cx+DX8[k],ny=cy+DY8[k];if(nx<0||ny<0||nx>=W||ny>=M.H||!routePass(nx,ny))continue;const n=ny*W+nx,nd=d+routeCost(nx,ny);if(nd<D[n]){D[n]=nd;push(n,nd);}}}
 return D;}
function stageSeeds(st){const W=M.W,out=[];
 if(st.kind==='exit'){for(let y=0;y<M.H;y++)for(let x=0;x<W;x++)if(M.g[y][x]==='E')out.push(y*W+x);}
 else if(st.kind==='gate'){out.push(st.y*W+st.x,st.y*W+st.x-1);}
 else if(st.kind==='pt'){const r=st.r;for(let y=Math.floor(st.y-r);y<=Math.ceil(st.y+r);y++)for(let x=Math.floor(st.x-r);x<=Math.ceil(st.x+r);x++)if(Math.hypot(x+.5-st.x,y+.5-st.y)<=r-.4&&routePass(x,y))out.push(y*W+x);}
 else if(st.kind==='row'){for(let x=0;x<W;x++)if(routePass(x,st.y))out.push(st.y*W+x);}
 else if(st.kind==='cross'){const bx=G&&G.bridgeUp?M.ramp.x:M.draw.x;out.push(40*W+bx,40*W+bx+1);}
 return out;}
function stagePos(st){if(st.kind==='pt')return[st.x*TS,st.y*TS];if(st.kind==='gate')return[st.x*TS,(st.y+.5)*TS];
 if(st.kind==='cross'){const bx=G.bridgeUp?M.ramp.x:M.draw.x;return[(bx+1)*TS,42.5*TS];}
 if(st.kind==='row')return[11*TS,(st.y+.5)*TS];let sx=0,sy=0,n=0;for(let y=0;y<M.H;y++)for(let x=0;x<M.W;x++)if(M.g[y][x]==='E'){sx+=x+.5;sy+=y+.5;n++;}return[sx/n*TS,sy/n*TS];}
function rebuildRoute(){const st=M.stages[Math.min(G.stage,M.stages.length-1)];G.route=dijkstra(stageSeeds(st));G.stagePos=stagePos(st);G.routeT=0;}
function descend(D,x,y,max){const path=[[x,y]];const W=M.W;for(let i=0;i<max;i++){let v=D[y*W+x],bx=x,by=y;
  for(let k=0;k<8;k++){const nx=x+DX8[k],ny=y+DY8[k];if(nx<0||ny<0||nx>=W||ny>=M.H)continue;const vv=D[ny*W+nx];if(vv>=v)continue;
   if(k>=4&&(!routePass(x+DX8[k],y)||!routePass(x,y+DY8[k])))continue;v=vv;bx=nx;by=ny;}
  if(bx===x&&by===y)break;x=bx;y=by;path.push([x,y]);if(v===0)break;}return path;}
function updateRoute(){
 let x=Math.floor(player.x/TS),y=Math.floor(player.y/TS);const W=M.W;
 if(!(x>=0&&y>=0&&x<W&&y<M.H)||G.route[y*W+x]>=1e8){let best=null,bd=1e9;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=M.H)continue;if(G.route[ny*W+nx]<1e8&&Math.abs(dx)+Math.abs(dy)<bd){bd=Math.abs(dx)+Math.abs(dy);best=[nx,ny];}}
  if(!best){G.routePath=null;return;}x=best[0];y=best[1];}
 const path=descend(G.route,x,y,70);G.routePath=path;G.routeDist=G.route[y*W+x];
 let aim=path[Math.min(1,path.length-1)];
 for(let i=1;i<Math.min(8,path.length);i++){const p=path[i];if(losClear(player.x,player.y,(p[0]+.5)*TS,(p[1]+.5)*TS,15))aim=p;else break;}
 G.routeAim=[(aim[0]+.5)*TS,(aim[1]+.5)*TS];
}
// ---------- hound flow fields ----------
function bfsFlow(F,sx,sy){F.fill(65535);const W=M.W,H=M.H;if(sx<0||sy<0||sx>=W||sy>=H)return;const q=G.fq;let h=0,t=0;const k0=sy*W+sx;F[k0]=0;q[t++]=k0;
 while(h<t){const c=q[h++],cx=c%W,cy=(c/W)|0,d=F[c]+1;
  for(let k=0;k<8;k++){const nx=cx+DX8[k],ny=cy+DY8[k];if(nx<0||ny<0||nx>=W||ny>=H)continue;const n=ny*W+nx;if(F[n]!==65535)continue;
   if(!flowOK(M.g[ny][nx]))continue;if(k>=4&&(!flowOK(M.g[cy][nx])||!flowOK(M.g[ny][cx])))continue;F[n]=d;q[t++]=n;}}}
function nearestFlowTile(x,y){let tx=Math.floor(x/TS),ty=Math.floor(y/TS);if(flowOK(tile(tx,ty)))return[tx,ty];
 for(let r=1;r<4;r++)for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++)if(flowOK(tile(tx+dx,ty+dy)))return[tx+dx,ty+dy];return[tx,ty];}
function updateFlows(dt){
 G.flowT-=dt;if(G.flowT>0)return;G.flowT=.3;
 const src=(M.hw||G.unseenT<2.5)?[player.x,player.y]:[G.lkx,G.lky];
 const s=nearestFlowTile(src[0],src[1]);const key=s[1]*M.W+s[0];
 if(key!==G.flowKey){G.flowKey=key;bfsFlow(G.flow,s[0],s[1]);}
 G.flowIT=(G.flowIT||0)-1;if(G.flowIT<=0){G.flowIT=2;const p=nearestFlowTile(player.x+player.vx*1.1,player.y+player.vy*1.1);bfsFlow(G.flowI,p[0],p[1]);}
}
function flowAim(c,F){
 let cx=Math.floor(c.x/TS),cy=Math.floor(c.y/TS);const W=M.W;
 if(cx<0||cy<0||cx>=W||cy>=M.H)return null;
 if(F[cy*W+cx]===65535){let bv=65535,bx=cx,by=cy;for(let k=0;k<8;k++){const nx=cx+DX8[k],ny=cy+DY8[k];if(nx<0||ny<0||nx>=W||ny>=M.H)continue;const v=F[ny*W+nx];if(v<bv){bv=v;bx=nx;by=ny;}}
  if(bv===65535)return null;return[(bx+.5)*TS,(by+.5)*TS];}
 if(F[cy*W+cx]===0)return[player.x,player.y];
 let best=null;
 for(let step=0;step<6;step++){let bv=F[cy*W+cx],bx=cx,by=cy;
  for(let k=0;k<8;k++){const nx=cx+DX8[k],ny=cy+DY8[k];if(nx<0||ny<0||nx>=W||ny>=M.H)continue;const v=F[ny*W+nx];if(v<bv){bv=v;bx=nx;by=ny;}}
  if(bx===cx&&by===cy)break;cx=bx;cy=by;const px=(cx+.5)*TS,py=(cy+.5)*TS;
  if(step===0||losClear(c.x,c.y,px,py,13))best=[px,py];else break;if(bv===0)break;}
 return best;}

// ---------- effects helpers ----------
function addShake(v){G.shake=Math.min(1,G.shake+v);}
function toast(msg,d,col){G.toast={msg,t:0,d:d||2.4,col:col||'#fff'};}
function popup(x,y,txt,col,big){G.pops.push({x,y,txt,col:col||'#fff',t:0,d:1.3,big:!!big});}
function sparks(x,y,n,col){if(!onScreen(x,y,60))return;for(let i=0;i<n;i++)G.parts.push({x,y,vx:rnd(-280,280),vy:rnd(-280,280),t:0,d:rnd(.2,.5),s:2,type:'spark',col});}
function smoke(x,y,n,dark,s){for(let i=0;i<n;i++)G.parts.push({x:x+rnd(-8,8),y:y+rnd(-8,8),vx:rnd(-40,40),vy:rnd(-40,40),t:0,d:rnd(.8,1.6),s:(s||10)*rnd(.7,1.3),type:'smoke',dark});}
function addSkid(c){const fx=Math.cos(c.a),fy=Math.sin(c.a),rx=-fy,ry=fx,B=BODY[c.body]||BODY.sedan,bo=B.L*.58,w=B.W-2.5;
 const pts=[[c.x-fx*bo+rx*w,c.y-fy*bo+ry*w],[c.x-fx*bo-rx*w,c.y-fy*bo-ry*w]];
 if(c.lastSkid){const ddx=pts[0][0]-c.lastSkid[0][0],ddy=pts[0][1]-c.lastSkid[0][1];if(ddx*ddx+ddy*ddy<16)return;
  for(let i=0;i<2;i++)G.skids.push([c.lastSkid[i][0],c.lastSkid[i][1],pts[i][0],pts[i][1],G.time]);if(G.skids.length>800)G.skids.splice(0,G.skids.length-800);}
 c.lastSkid=pts;
 if(onScreen(c.x,c.y,40)&&Math.random()<(c===player?.75:.3))for(const p of pts)if(Math.random()<.55)G.parts.push({x:p[0],y:p[1],vx:rnd(-25,25)-c.vx*.06,vy:rnd(-25,25)-c.vy*.06,t:0,d:rnd(.6,1.2),s:rnd(5,9),type:'smoke'});
}
function damage(d,src){if(mode!=='play'||d<=0||player.inv>0)return;d*=player.dmgMul;G.dmgBy[src||'?']=(G.dmgBy[src||'?']||0)+d;player.hp=Math.max(0,player.hp-d);G.hurt=Math.min(1,G.hurt+d/22);if(player.hp<=0)lose('wreck');}
function hurtHound(c,d){if(c.dead||d<=0)return;c.hp-=d;c.hurtT=.25;if(c.hp<=0)wreckHound(c);}
function wreckHound(c){c.dead=true;c.deadT=7;c.spin=rnd(-7,7);c.hp=0;c.nitro=false;c.drift=false;G.wrecks++;G.heat=Math.min(3.99,G.heat+.12);
 const on=onScreen(c.x,c.y,150);
 if(on){sfx.wreck();addShake(.3);}
 smoke(c.x,c.y,14,1,14);sparks(c.x,c.y,22,'#ffd36b');
 for(let i=0;i<10;i++)G.parts.push({x:c.x,y:c.y,vx:rnd(-260,260),vy:rnd(-260,260),t:0,d:rnd(.6,1.1),s:rnd(4,8),type:'debris',col:i%3?'#2a2c31':'#ff8a1a',a:rnd(0,TAU),va:rnd(-12,12)});
 G.parts.push({x:c.x,y:c.y,vx:0,vy:0,t:0,d:.45,s:70,type:'ring'});
 popup(c.x,c.y-20,'WRECKED!','#ffb84a',true);
 for(let i=0;i<3;i++){const a=rnd(0,TAU);G.pk.push({t:'d',x:c.x,y:c.y,vx:Math.cos(a)*rnd(90,170),vy:Math.sin(a)*rnd(90,170),taken:false,ph:rnd(0,TAU),life:12});}
 if(G.wrecks===5){toast('Side goal: 5 Hounds wrecked! ✔',2.4,'#7dffa0');sfx.check();}
 else if(G.wrecks<5&&on)toast('Hound wrecked! '+G.wrecks+'/5',1.4,'#ffb84a');
}

// ---------- collisions ----------
function circleWorld(c,px,py,r,o){
 const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
 for(let y=ty-1;y<=ty+1;y++)for(let x=tx-1;x<=tx+1;x++){const ch=tile(x,y);if(!SOLID.has(ch))continue;
  const x0=x*TS,y0=y*TS,qx=clamp(px,x0,x0+TS),qy=clamp(py,y0,y0+TS);let dx=px-qx,dy=py-qy,d=Math.hypot(dx,dy);if(d>=r)continue;
  let nx,ny,pen;
  if(d<.001){const l=px-x0,rt=x0+TS-px,t=py-y0,b=y0+TS-py,m=Math.min(l,rt,t,b);
   if(m===l){nx=-1;ny=0;pen=l+r;}else if(m===rt){nx=1;ny=0;pen=rt+r;}else if(m===t){nx=0;ny=-1;pen=t+r;}else{nx=0;ny=1;pen=b+r;}}
  else{nx=dx/d;ny=dy/d;pen=r-d;}
  if(ch==='G'&&-(c.vx*nx+c.vy*ny)>100){smashGate(c,x,y);continue;}
  if(ch==='b'&&M.base[y][x]!=='b'&&-(c.vx*nx+c.vy*ny)>250&&!c.dead){smashBarrier(c,x,y);continue;}
  px+=nx*pen;py+=ny*pen;o.x+=nx*pen;o.y+=ny*pen;o.nx+=nx;o.ny+=ny;o.hit=true;o.ch=ch;}
 propHit(px,py,r,(p,nx,ny,pen)=>{if(p.t==='lamp'&&Math.hypot(c.vx,c.vy)>110&&!c.dead){p.down=1;p.da=Math.atan2(c.vy,c.vx)+rnd(-.4,.4);if(p.li!=null)M.lamps[p.li]=null;if(onScreen(p.x,p.y)){sfx.tock();sparks(p.x,p.y,6);}c.vx*=.93;c.vy*=.93;if(c===player)G.knocked++;return;}px+=nx*pen;py+=ny*pen;o.x+=nx*pen;o.y+=ny*pen;o.nx+=nx;o.ny+=ny;o.hit=true;o.ch=p.t;});
}
function collideWorld(c){
 const B=BODY[c.body]||BODY.sedan,fx=Math.cos(c.a),fy=Math.sin(c.a),off=B.L>30?B.L*.6:B.L*.45,r=Math.min(c.r,B.W+1.5);
 let nxs=0,nys=0,hit=false,hch=null;
 for(const s of[1,-1]){const o={x:0,y:0,nx:0,ny:0,hit:false,ch:null};const ox=fx*off*s,oy=fy*off*s;
  circleWorld(c,c.x+ox,c.y+oy,r,o);
  if(o.hit){c.x+=o.x;c.y+=o.y;const l=Math.hypot(o.nx,o.ny)||1,nx=o.nx/l,ny=o.ny/l;nxs+=nx;nys+=ny;hit=true;hch=o.ch;
   const vn=c.vx*nx+c.vy*ny;if(vn<0&&!c.dead)c.yaw+=clamp((ox*ny-oy*nx)*(-vn)*.00022,-1.2,1.2);}}
 if(hit){const l=Math.hypot(nxs,nys)||1;impactWall(c,nxs/l,nys/l,hch);}
 // never stay embedded in a solid tile
 const ch=tileAt(c.x,c.y);if(SOLID.has(ch)){const tx=Math.floor(c.x/TS),ty=Math.floor(c.y/TS);let best=null,bd=1e9;
  for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){if(!flowOK(tile(tx+dx,ty+dy)))continue;const px=(tx+dx+.5)*TS,py=(ty+dy+.5)*TS,d=Math.hypot(px-c.x,py-c.y);if(d<bd){bd=d;best=[px,py];}}
  if(best){c.x+=(best[0]-c.x)*.35;c.y+=(best[1]-c.y)*.35;}}
}
function impactWall(c,nx,ny,ch){

const TB={};const ptr=new Map();
function layoutTouch(){const r=clamp(Math.min(VW*.1,VH*.13),34,58),pad=14,by=VH-pad-r-6;
 for(const k in TB)delete TB[k];
 if(save.ctl==='buttons'){TB.L={x:pad+r,y:by,r,lbl:'◀'};TB.R={x:pad+r*3.25,y:by,r,lbl:'▶'};TB.gas={x:VW-pad-r*1.1,y:by-r*.1,r:r*1.1,lbl:'GAS'};}
 const gx=VW-pad-r*1.1,gy=by-r*.1;
 TB.brake={x:gx-r*2.3,y:by+r*.1,r:r*.85,lbl:'BRAKE'};TB.nitro={x:gx,y:gy-r*2.35,r:r*.85,lbl:'NITRO'};TB.drift={x:gx-r*2.3,y:gy-r*2.2,r:r*.8,lbl:'DRIFT'};
}
function btnAt(x,y){let best=null,bd=1e9;for(const k in TB){const b=TB[k],d=Math.hypot(x-b.x,y-b.y);if(d<b.r*1.3&&d<bd){bd=d;best=k;}}return best;}
function touchInput(){const s={thr:0,st:0,drift:false,nit:false};
 for(const p of ptr.values()){
  if(p.joy){const R=Math.min(70,Math.min(VW,VH)*.13);let dx=p.x-p.ox,dy=p.y-p.oy,l=Math.hypot(dx,dy);if(l>R){p.ox=p.x-dx/l*R;p.oy=p.y-dy/l*R;l=R;dx=p.x-p.ox;dy=p.y-p.oy;}
   if(l>R*.2){const mag=l/R,diff=angDiff(Math.atan2(dy,dx),player.a),vf=player.vx*Math.cos(player.a)+player.vy*Math.sin(player.a);
    if(Math.abs(diff)>2.4&&vf<60){s.thr-=mag;s.st+=-Math.sign(diff);}else{s.st+=clamp(diff*2.2,-1,1);s.thr+=Math.abs(diff)>1.6?.3:Math.max(.5,mag);}}}
  else switch(p.btn){case 'L':s.st-=1;break;case 'R':s.st+=1;break;case 'gas':s.thr+=1;break;case 'brake':s.thr-=1;break;case 'nitro':s.nit=true;break;case 'drift':s.drift=true;break;}}
 if(s.thr<0&&(s.nit||s.drift))s.thr=0;

function drawTouch(){
 const down={};for(const p of ptr.values())if(p.btn)down[p.btn]=1;
 const hint=G.stuckT>.5||G.boxT>.6;

  if(k==='nitro'){fill=on?'rgba(80,200,255,.6)':G.nitro>1?'rgba(40,150,255,.35)':'rgba(255,255,255,.08)';edge='rgba(180,230,255,.7)';}
  else if(k==='drift'){fill=on?'rgba(255,170,60,.6)':'rgba(255,170,60,.25)';edge='rgba(255,210,150,.6)';}

 let dt=Math.min(.05,(now-last)/1000);last=now;
 if(innerWidth!==VW||innerHeight!==VH||Math.min(window.devicePixelRatio||1,2.5)!==DPR)resize();
 try{
  if(G){
   if(mode==='play'){const n=Math.ceil(dt/(1/60));const h=dt/n;for(let i=0;i<n&&mode==='play';i++)update(h);}
   else if(mode==='title'||mode==='garage')G.time+=dt;
   else if(mode==='won'||mode==='lost'){G.time+=dt;updateParts(dt);for(const c of G.cars){c.vx*=.95;c.vy*=.95;c.x+=c.vx*dt;c.y+=c.vy*dt;}G.shake=Math.max(0,G.shake-dt*1.8);}
   render(dt);if(mode==='garage')drawGaragePreview();}
 }catch(err){console.error(err);}
 requestAnimationFrame(frame);
}
resize();setMute(AU.muted);newGame();showTitle();requestAnimationFrame(frame);
if(AUTO){window.__re={get G(){return G;},get mode(){return mode;},get player(){return player;},get M(){return M;},start:startGame,load:loadChapter,dbg:{dijkstra,descend,stageSeeds,routePass},step(s){let i=0;for(;i<s*60&&mode==="play";i++)update(1/60);cam.x=player.x+cam.lx;cam.y=player.y+cam.ly;render(1/60);return i;}};setTimeout(startGame,400);}
})();

<script id="blizExitScript">
/* Blizzard exit bar: shown inside every game so there is always a way out. */
(function(){
  // Inside the Blizzard about:blank tab or the in-site player, the parent page already shows exit buttons.
  try{ if(window.top !== window) return; }catch(e){ return; }

  var LOCAL_SITE = 'http://localhost:8642/index.html';
  function back(view){
    try{
      if(window.opener && !window.opener.closed && window.opener.BLIZ){
        window.opener.BLIZ.go(view); window.opener.focus(); window.close(); return;
      }
    }catch(e){}
    if(/^(https?|file):$/.test(location.protocol)){
      location.href = new URL('../index.html#' + view, location.href).href;
      return;
    }
    // Page has no real address (e.g. a preview snapshot), so it can't move to another page: close it instead.
    try{ location.href = LOCAL_SITE + '#' + view; }catch(e){}
    setTimeout(function(){
      try{ window.close(); }catch(e){}
      setTimeout(showClosed, 300);
    }, 250);
  }
  // Last resort if the tab can't be closed either: cover and silence the game.
  function showClosed(){
    try{ document.querySelectorAll('audio,video').forEach(function(m){ m.pause(); }); }catch(e){}
    var c = document.createElement('div');
    c.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:#04060f;color:#e8f3ff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;font:600 18px system-ui,sans-serif;text-align:center;padding:20px';
    c.innerHTML = '<div style="font-size:48px">❄️</div><div>Game closed</div><div style="font-size:14px;opacity:.7">Close this tab, or open Blizzard at localhost:8642</div>';
    ['pointerdown','touchstart','keydown','click'].forEach(function(ev){ c.addEventListener(ev, function(e){ e.stopPropagation(); }, true); });
    addEventListener('keydown', function(e){ e.stopImmediatePropagation(); e.preventDefault(); }, true);
    document.body.appendChild(c);
  }

  var bar = document.createElement('div');
  bar.id = 'blizExit';
  bar.innerHTML = '<button class="bx-x" data-v="games" title="Exit game" aria-label="Exit game">✕</button>'
    + '<button class="bx-m" data-v="home" title="Back to Blizzard main menu">⌂ Main Menu</button>';
  var css = document.createElement('style');
  css.textContent = '#blizExit{position:fixed;top:12px;left:12px;z-index:2147483647;display:flex;align-items:center;gap:8px;font:700 14px system-ui,-apple-system,sans-serif;touch-action:manipulation}'
    + '#blizExit button{cursor:pointer;font:inherit;color:#fff;border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45)}'
    + '#blizExit .bx-x{width:44px;height:44px;border-radius:50%;background:#ff3b5c;font-size:22px;line-height:1;padding:0;display:grid;place-items:center}'
    + '#blizExit .bx-x:hover{background:#ff1f45;transform:scale(1.08)}'
    + '#blizExit .bx-m{height:36px;padding:0 14px;border-radius:999px;background:rgba(4,6,15,.8)}'
    + '#blizExit .bx-m:hover{background:#7fdbff;color:#001018}';
  document.head.appendChild(css);

  // Keep taps on the bar from also starting or steering the game underneath.
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    bar.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  bar.addEventListener('pointerup', function(e){
    var b = e.target.closest('button'); if(!b) return;
    e.stopPropagation(); back(b.dataset.v);
  });
  bar.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ var b = e.target.closest('button'); if(b){ e.preventDefault(); back(b.dataset.v); } }
  });

  function add(){ document.body.appendChild(bar); }
  if(document.body) add(); else addEventListener('DOMContentLoaded', add);
})();
</script>
<script id="blizMusicScript">
/* BlizMusic: original background music, generated live with Web Audio.
   Every song is composed in code (chords + melody + drums), so there is no copyrighted audio. */
(function(){
  if(window.BlizMusic) return;

  var SCALES = { major:[0,2,4,5,7,9,11], minor:[0,2,3,5,7,8,10], dorian:[0,2,3,5,7,9,10] };
  // prog = scale degrees (0-based) of each bar's chord; mel = melody contour seed
  var THEMES = {
    chill:   { name:'Snowfall Lounge', bpm:88,  root:60, scale:'major',  prog:[0,4,5,3], drums:'soft',   arp:'up',     lead:'triangle', pad:.5,  swing:.12 },
    snow:    { name:'Powder Run',      bpm:128, root:62, scale:'major',  prog:[0,3,5,4], drums:'drive',  arp:'updown', lead:'square',   pad:.35, swing:0 },
    puzzle:  { name:'Crystal Garden',  bpm:104, root:65, scale:'major',  prog:[0,2,3,4], drums:'bounce', arp:'pluck',  lead:'triangle', pad:.4,  swing:.18 },
    drive:   { name:'Neon Getaway',    bpm:138, root:64, scale:'minor',  prog:[0,5,2,6], drums:'drive',  arp:'updown', lead:'sawtooth', pad:.3,  swing:0 },
    neon:    { name:'Prism Rush',      bpm:150, root:57, scale:'minor',  prog:[0,5,6,4], drums:'drive',  arp:'up',     lead:'square',   pad:.3,  swing:0 },
    mystery: { name:'Lantern Steps',   bpm:84,  root:62, scale:'dorian', prog:[0,3,0,6], drums:'tick',   arp:'box',    lead:'sine',     pad:.45, swing:.1 }
  };
  function pickTheme(){
    var t = (document.title || '').toLowerCase();
    if(/sled/.test(t)) return 'snow';
    if(/frost|gem/.test(t)) return 'puzzle';
    if(/tunnel\s*2/.test(t)) return 'neon';
    if(/tunnel|road/.test(t)) return 'drive';
    if(/hollow/.test(t)) return 'mystery';
    return 'chill';
  }

  var store = {
    get:function(k,d){ try{ var v = localStorage.getItem('blizzard_'+k); return v === null ? d : JSON.parse(v); }catch(e){ return d; } },
    set:function(k,v){ try{ localStorage.setItem('blizzard_'+k, JSON.stringify(v)); }catch(e){} }
  };

  var ctx = null, master, comp, delay, delayGain, noiseBuf;
  var on = store.get('music', true), playing = false, timer = null;
  var theme = THEMES[pickTheme()], themeKey = pickTheme();
  var step = 0, nextTime = 0, melody = [], seed = 1;

  function rand(){ seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; }
  function mtof(m){ return 440 * Math.pow(2, (m - 69) / 12); }
  function note(deg, oct){
    var sc = SCALES[theme.scale], n = sc.length;
    var o = Math.floor(deg / n); deg = ((deg % n) + n) % n;
    return theme.root + sc[deg] + 12 * (o + (oct || 0));
  }

  function init(){
    if(ctx) return true;
    try{ ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return false; }
    comp = ctx.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 4;
    master = ctx.createGain(); master.gain.value = 0;
    delay = ctx.createDelay(1); delayGain = ctx.createGain(); delayGain.gain.value = .28;
    var fb = ctx.createGain(); fb.gain.value = .32;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2400;
    delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(delayGain); delayGain.connect(master);
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * .5, ctx.sampleRate);
    var d = noiseBuf.getChannelData(0); for(var i=0;i<d.length;i++) d[i] = Math.random()*2-1;
    return true;
  }

  // Compose a 2-bar motif per chord so the tune repeats and is catchy, not random noise
  function compose(){
    seed = 0; for(var i=0;i<themeKey.length;i++) seed = (seed * 31 + themeKey.charCodeAt(i)) % 2147483647; seed = seed || 7;
    melody = [];
    var pos = 4;
    for(var bar=0; bar<8; bar++){
      var chord = theme.prog[bar % 4], row = [];
      for(var s=0; s<16; s++){
        var strong = s % 4 === 0;
        if(rand() < (strong ? .82 : .32)){
          var tones = [chord, chord+2, chord+4];
          if(strong) pos = tones[(rand()*3)|0] + 7;
          else pos += [-1,1,-2,2,0][(rand()*5)|0];
          pos = Math.max(4, Math.min(14, pos));
          row.push(pos);
        }else row.push(null);
      }
      melody.push(row);
    }
    for(var r=4;r<8;r++) melody[r] = melody[r-4].map(function(v, s){ return (s > 11 && v !== null) ? v + (r === 7 ? -1 : 1) : v; });
  }

  function tone(type, freq, t, dur, vol, dest, attack, cutoff){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    var a = attack || .008;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + a);
    g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    if(cutoff){ var f = ctx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = cutoff; o.connect(f); f.connect(g); }
    else o.connect(g);
    g.connect(dest || master);
    o.start(t); o.stop(t + dur + .05);
    return g;
  }
  function noise(t, dur, vol, hp){
    var s = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .02);
  }
  function kick(t, vol){
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(42, t + .14);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + .25);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + .3);
  }

  function playStep(s, t){
    var bar = Math.floor(s / 16), st = s % 16, chord = theme.prog[bar % 4];
    var sixteenth = 60 / theme.bpm / 4;
    // pad: soft chord at start of each bar
    if(st === 0 && theme.pad){
      [chord, chord+2, chord+4].forEach(function(d){
        tone('triangle', mtof(note(d, -1)), t, sixteenth*16, .045*theme.pad, null, .25, 1400);
      });
    }
    // bass
    var bassHits = theme.drums === 'drive' ? [0,3,6,8,11,14] : [0,8,10];
    if(bassHits.indexOf(st) >= 0) tone('triangle', mtof(note(chord, -2)), t, sixteenth*2.6, .16, null, .01, 700);
    // arpeggio
    var tones = [chord, chord+2, chord+4, chord+7];
    var arpVol = .05, d;
    if(theme.arp === 'up' && st % 2 === 0) d = tones[(st/2) % 4];
    else if(theme.arp === 'updown') d = [0,1,2,3,2,1,0,1][(st % 8)] !== undefined ? tones[[0,1,2,3,2,1,0,1][st % 8]] : null;
    else if(theme.arp === 'pluck' && (st % 4 === 2 || st % 4 === 3)) d = tones[(st >> 1) % 4];
    else if(theme.arp === 'box' && st % 4 === 0) { d = tones[(st/4) % 4] + 7; arpVol = .07; }
    if(d !== undefined && d !== null){
      var g = tone(theme.arp === 'box' ? 'sine' : 'square', mtof(note(d, 0)), t, sixteenth * (theme.arp === 'box' ? 6 : 1.4), arpVol, null, .005, theme.arp === 'box' ? 0 : 2200);
      g.connect(delay);
    }
    // melody
    var m = melody[bar % 8][st];
    if(m !== null && m !== undefined){
      var len = 1; while(st + len < 16 && melody[bar % 8][st + len] === null && len < 4) len++;
      var lg = tone(theme.lead, mtof(note(m, 0)), t, sixteenth * len * 1.1, theme.lead === 'sawtooth' || theme.lead === 'square' ? .045 : .09, null, .01, theme.lead === 'sine' ? 0 : 3000);
      lg.connect(delay);
    }
    // drums
    var dr = theme.drums;
    if(dr === 'drive'){
      if(st % 4 === 0) kick(t, .5);
      if(st === 4 || st === 12) noise(t, .14, .22, 1500);
      if(st % 2 === 1) noise(t, .04, .07, 7000);
    }else if(dr === 'bounce'){
      if(st === 0 || st === 7 || st === 10) kick(t, .4);
      if(st === 4 || st === 12) noise(t, .1, .14, 2000);
      if(st % 2 === 0) noise(t, .03, .05, 8000);
    }else if(dr === 'soft'){
      if(st === 0 || st === 10) kick(t, .3);
      if(st === 4 || st === 12) noise(t, .08, .08, 3000);
      if(st % 4 === 2) noise(t, .03, .04, 8000);
    }else if(dr === 'tick'){
      if(st % 4 === 0) noise(t, .025, .05, 6000);
      if(st === 0) kick(t, .18);
    }
  }

  function schedule(){
    var sixteenth = 60 / theme.bpm / 4;
    while(nextTime < ctx.currentTime + .15){
      var swing = (step % 2 === 1) ? sixteenth * theme.swing : 0;
      playStep(step, nextTime + swing);
      nextTime += sixteenth; step++;
    }
  }
  function start(){
    if(!on || playing || document.hidden || !init()) return;
    if(ctx.state === 'suspended') ctx.resume();
    compose();
    playing = true; step = 0; nextTime = ctx.currentTime + .08;
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(.55, ctx.currentTime + 1.2);
    timer = setInterval(schedule, 40); schedule();
  }
  function stop(){
    if(!playing) return;
    playing = false; clearInterval(timer);
    master.gain.cancelScheduledValues(ctx.currentTime);
    master.gain.setValueAtTime(master.gain.value, ctx.currentTime);
    master.gain.linearRampToValueAtTime(0, ctx.currentTime + .25);
  }

  /* ---------- button ---------- */
  var btn = document.createElement('button');
  btn.id = 'blizMusicBtn'; btn.type = 'button';
  function label(){
    btn.innerHTML = on ? '🎵 <span>Music</span>' : '🔇 <span>Music</span>';
    btn.title = (on ? 'Music on: ' : 'Music off: ') + theme.name + ' (original Blizzard track)';
    btn.classList.toggle('off', !on);
  }
  function toggle(){
    on = !on; store.set('music', on); label();
    if(on){ start(); } else stop();
  }
  ['pointerdown','mousedown','touchstart','touchend','click'].forEach(function(ev){
    btn.addEventListener(ev, function(e){ e.stopPropagation(); }, { passive:true });
  });
  btn.addEventListener('pointerup', function(e){ e.stopPropagation(); toggle(); });
  btn.addEventListener('keydown', function(e){ if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); e.stopPropagation(); toggle(); } });

  var css = document.createElement('style');
  css.textContent = '#blizMusicBtn{font:700 13px system-ui,-apple-system,sans-serif;height:36px;padding:0 13px;border-radius:999px;cursor:pointer;color:#fff;background:rgba(4,6,15,.8);border:2px solid rgba(255,255,255,.85);box-shadow:0 4px 14px rgba(0,0,0,.45);touch-action:manipulation;z-index:2147483646}'
    + '#blizMusicBtn:hover{background:#59ffb0;color:#001018}'
    + '#blizMusicBtn.off{opacity:.7}'
    + '#blizMusicBtn.float{position:fixed;top:12px;left:12px}'
    + '@media (max-width:420px){#blizMusicBtn span{display:none}}';

  function mount(){
    document.head.appendChild(css);
    label();
    var slot = document.getElementById('blizMusicSlot') || document.getElementById('blizExit');
    if(slot) slot.appendChild(btn);
    else { btn.classList.add('float'); document.body.appendChild(btn); }
  }
  if(document.body) mount(); else addEventListener('DOMContentLoaded', mount);

  // Browsers only allow sound after the player interacts, so start on the first tap / key.
  function kickoff(){ start(); }
  ['pointerdown','keydown','touchstart'].forEach(function(ev){ addEventListener(ev, kickoff, { capture:true, passive:true }); });
  document.addEventListener('visibilitychange', function(){ if(document.hidden) stop(); else start(); });

  window.BlizMusic = {
    setTheme:function(k){ if(!THEMES[k] || k === themeKey) return; themeKey = k; theme = THEMES[k]; label(); if(playing){ stop(); setTimeout(start, 300); } },
    stop:stop, start:start, themes:Object.keys(THEMES)
  };
})();
</script>
